eeks).", "s": "Height $=8+1.5w$: it starts at 8 cm and adds 1.5 cm each week.", "v": "The seedling starts at eight centimeters and grows one and a half centimeters each week, so after w weeks it is eight plus one point five w. The answer is B.", "topic": "Linear equations", "d": 1, "orig": 4, "test": 3, "o": ["$1.5+8w$", "$8+1.5w$", "$9.5w$", "$8w+1.5w$"], "a": 1}, {"q": "If $\\dfrac{x+4}{2}=9$, what is the value of $x$?", "h": "Multiply both sides by 2 first.", "s": "$x+4=18 \\Rightarrow x=14$.", "v": "Multiply both sides by two: x plus four equals eighteen. Subtract four, and x is fourteen. The answer is fourteen.", "topic": "Linear equations", "d": 1, "orig": 5, "test": 3, "spr": true, "a": ["14"]}, {"q": "Which value of $x$ satisfies $5-2x\\lt -3$?", "h": "Solve the inequality; remember to flip the sign when dividing by a negative.", "s": "$-2x\\lt -8 \\Rightarrow x\\gt 4$. Only 5 is greater than 4.", "v": "Subtract five: negative two x is less than negative eight. Dividing by negative two flips the sign, so x is greater than four. Only five works. Note that four itself does not work, because the inequality is strict. The answer is D.", "topic": "Linear inequalities", "d": 2, "orig": 6, "test": 3, "o": ["$2$", "$3$", "$4$", "$5$"], "a": 3}, {"q": "What is the slope of the line $6x-3y=9$?", "h": "Solve for $y$ to get the form $y=mx+b$.", "s": "$-3y=-6x+9 \\Rightarrow y=2x-3$. The slope is 2.", "v": "Solve for y. Negative three y equals negative six x plus nine. Divide by negative three: y equals two x minus three. The slope is two. The answer is B.", "topic": "Linear functions", "d": 2, "orig": 7, "test": 3, "o": ["$-2$", "$2$", "$3$", "$6$"], "a": 1}, {"q": "If $3x+2y=16$ and $y=x+3$, what is the value of $y$?", "h": "Substitute $y=x+3$ into the first equation.", "s": "$3x+2(x+3)=16 \\Rightarrow 5x+6=16 \\Rightarrow x=2$, so $y=5$.", "v": "Replace y with x plus three. Three x plus two x plus six equals sixteen, so five x is ten and x is two. Then y is two plus three, which is five. Careful: the question asks for y, not x. The answer is C.", "topic": "Systems of linear equations", "d": 2, "orig": 8, "test": 3, "o": ["$2$", "$3$", "$5$", "$7$"], "a": 2}, {"q": "If $f(x)=7-3x$ and $f(a)=-11$, what is the value of $a$?", "h": "$f(a)=7-3a$. Set it equal to $-11$.", "s": "$7-3a=-11 \\Rightarrow -3a=-18 \\Rightarrow a=6$.", "v": "f of a is seven minus three a, and it equals negative eleven. Subtract seven: negative three a equals negative eighteen. Divide by negative three, and a is six. The answer is six.", "topic": "Linear functions", "d": 2, "orig": 9, "test": 3, "spr": true, "a": ["6"]}, {"q": "A line has slope $-\\dfrac12$ and $y$-intercept 4. Which point lies on the line?", "h": "Write the equation $y=-\\tfrac12x+4$ and test each point.", "s": "$y=-\\dfrac x2+4$. For $x=6$: $y=-3+4=1$ ✓. (For $x=2,4,8$ you get $3,2,0$.)", "v": "The line is y equals negative one half x plus four. When x is six, y is negative three plus four, which is one. So six, one is on the line. The answer is C.", "topic": "Linear functions", "d": 2, "orig": 10, "test": 3, "o": ["$(2,\\ 5)$", "$(4,\\ 6)$", "$(6,\\ 1)$", "$(8,\\ 2)$"], "a": 2}, {"q": "How many solutions does the equation $11x-3=-3+11x$ have?", "h": "Compare the two sides after rearranging the terms.", "s": "Both sides equal $11x-3$, so the equation is an identity: true for every $x$. Infinitely many solutions.", "v": "The right side, negative three plus eleven x, is the same as eleven x minus three. Both sides are identical, so every value of x works. There are infinitely many solutions. The answer is D.", "topic": "Linear equations", "d": 2, "orig": 11, "test": 3, "o": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "a": 3}, {"q": "A landscaper charges <span class=\"usd\">$<\/span>4.50 per square foot to lay sod, plus <span class=\"usd\">$<\/span>85 for delivery. A yard is a square with side length 22 feet. What is the total charge, in dollars, to lay sod on this yard?", "h": "Find the area of the square first, then apply the rate and add the delivery fee.", "s": "Area $=22^2=484$ ft². Charge $=4.50(484)+85=2178+85=\\$2{,}263$.", "v": "The yard's area is twenty two squared, which is four hundred eighty four square feet. At four dollars fifty per square foot, that is two thousand one hundred seventy eight dollars. Add eighty five for delivery to get two thousand two hundred sixty three dollars. The answer is B.", "topic": "Linear equations", "d": 3, "orig": 12, "test": 3, "o": ["$184$", "$2{,}263$", "$2{,}178$", "$2{,}348$"], "a": 1}, {"q": "The line $y=mx+3$ passes through $(4,\\ 15)$. What is the value of $m$?", "h": "Substitute $x=4$ and $y=15$.", "s": "$15=4m+3 \\Rightarrow 4m=12 \\Rightarrow m=3$.", "v": "Put in x equals four and y equals fifteen. Fifteen equals four m plus three, so four m is twelve and m is three. The answer is three.", "topic": "Linear functions", "d": 2, "orig": 13, "test": 3, "spr": true, "a": ["3"]}, {"q": "Which equation is $2x-3y=6$ solved for $y$?", "h": "Move $2x$ to the right side, then divide every term by $-3$.", "s": "$-3y=-2x+6 \\Rightarrow y=\\dfrac23x-2$.", "v": "Subtract two x from both sides: negative three y equals negative two x plus six. Divide every term by negative three: y equals two thirds x minus two. The answer is A.", "topic": "Linear equations", "d": 2, "orig": 14, "test": 3, "o": ["$y=\\dfrac23x-2$", "$y=-\\dfrac23x+2$", "$y=\\dfrac32x-3$", "$y=2x-6$"], "a": 0}, {"q": "How many solutions does the system $y=3x+1$ and $6x-2y=4$ have?", "h": "Write the second equation in slope-intercept form and compare slopes and intercepts.", "s": "$6x-2y=4 \\Rightarrow y=3x-2$. Same slope (3) as $y=3x+1$ but a different intercept: parallel lines, so zero solutions.", "v": "Solve the second equation for y: y equals three x minus two. Both lines have slope three, but their y intercepts are different, one and negative two. Parallel lines never meet, so there are no solutions. The answer is A.", "topic": "Systems of linear equations", "d": 3, "orig": 15, "test": 3, "o": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "a": 0}, {"q": "A store sells T-shirts for <span class=\"usd\">$<\/span>12 and hats for <span class=\"usd\">$<\/span>8. A customer bought 10 items for exactly <span class=\"usd\">$<\/span>96. How many T-shirts did the customer buy?", "h": "One equation counts the items, the other counts the dollars.", "s": "$t+h=10$ and $12t+8h=96$. With $h=10-t$: $12t+80-8t=96 \\Rightarrow 4t=16 \\Rightarrow t=4$.", "v": "Let t be T shirts and h be hats. t plus h is ten, and twelve t plus eight h is ninety six. Replace h with ten minus t: twelve t plus eighty minus eight t equals ninety six. So four t is sixteen, and t is four. The answer is C.", "topic": "Systems of linear equations", "d": 3, "orig": 16, "test": 3, "o": ["$6$", "$5$", "$4$", "$8$"], "a": 2}, {"q": "$f$ is linear and $f(x+1)-f(x)=5$ for every $x$. If $f(0)=-2$, what is $f(4)$?", "h": "$f(x+1)-f(x)=5$ says the slope is 5.", "s": "The slope is 5, so $f(4)=f(0)+4\\cdot 5=-2+20=18$.", "v": "Each time x increases by one, f increases by five, so the slope is five. Going from zero to four adds four times five, which is twenty. Negative two plus twenty is eighteen. The answer is B.", "topic": "Linear functions", "d": 3, "orig": 17, "test": 3, "o": ["$20$", "$18$", "$23$", "$3$"], "a": 1}, {"q": "If $3(2x-1)-4(x+2)=5$, what is the value of $x$?", "h": "Distribute carefully — the $-4$ multiplies both $x$ and $2$.", "s": "$6x-3-4x-8=5 \\Rightarrow 2x-11=5 \\Rightarrow 2x=16 \\Rightarrow x=8$.", "v": "Distribute: six x minus three minus four x minus eight equals five. Combine: two x minus eleven equals five. So two x is sixteen, and x is eight. The answer is eight.", "topic": "Linear equations", "d": 3, "orig": 18, "test": 3, "spr": true, "a": ["8"]}, {"q": "A line segment in the $xy$-plane has endpoints $(0,\\ 8)$ and $(6,\\ 0)$. Line $\\ell$ is perpendicular to this segment and passes through $(0,\\ 3)$. Which equation defines line $\\ell$?", "h": "Find the segment's slope, take the negative reciprocal, and use $(0,3)$ as the $y$-intercept.", "s": "Segment slope $=\\dfrac{0-8}{6-0}=-\\dfrac43$, so $\\ell$ has slope $\\dfrac34$ and $y$-intercept 3.<br>$y=\\dfrac34x+3 \\Rightarrow 4y=3x+12 \\Rightarrow -3x+4y=12$.", "v": "The segment's slope is zero minus eight over six, which is negative four thirds. The perpendicular slope is three fourths. The line passes through zero, three, so its y intercept is three: y equals three fourths x plus three. Multiply by four: four y equals three x plus twelve, or negative three x plus four y equals twelve. The answer is A.", "topic": "Linear functions", "d": 4, "orig": 19, "test": 3, "o": ["$-3x+4y=12$", "$3x+4y=12$", "$-4x+3y=9$", "$4x+3y=9$"], "a": 0}, {"q": "The equation $\\dfrac12(8x-b)=4x+3$ has infinitely many solutions. What is the value of $b$?", "h": "Distribute the $\\tfrac12$. Infinitely many solutions means the constants must match.", "s": "$4x-\\dfrac b2=4x+3 \\Rightarrow -\\dfrac b2=3 \\Rightarrow b=-6$.", "v": "Half of eight x is four x, and half of b is b over two. So four x minus b over two equals four x plus three. For infinitely many solutions the constants must match: negative b over two equals three, so b is negative six. The answer is A.", "topic": "Linear equations", "d": 4, "orig": 20, "test": 3, "o": ["$-6$", "$-3$", "$3$", "$6$"], "a": 0}, {"q": "The solution to the system $x+2y=7$ and $3x-y=k$ has $x=y$. What is the value of $k$?", "h": "Replace $y$ with $x$ in the first equation to find $x$.", "s": "With $y=x$: $3x=7 \\Rightarrow x=y=\\dfrac73$. Then $k=3x-y=2x=\\dfrac{14}{3}$.", "v": "Since x equals y, the first equation becomes three x equals seven, so x and y are both seven thirds. Then k is three x minus y, which is two x, or fourteen thirds. You can enter fourteen over three, or the decimal four point six six seven. The answer is fourteen thirds.", "topic": "Systems of linear equations", "d": 4, "orig": 21, "test": 3, "spr": true, "a": ["14/3", "4.666", "4.667"]}, {"q": "For a linear relationship between $x$ and $y$, the values $x=-2,\\ 6$ and $14$ correspond to $y=40+2k,\\ 40$ and $40-2k$, where $k$ is a positive constant. Which equation represents this relationship?", "h": "Find the slope (it contains $k$), use the point $(6,\\ 40)$, then clear the fraction.", "s": "Slope $=\\dfrac{40-(40+2k)}{6-(-2)}=-\\dfrac{2k}{8}=-\\dfrac k4$.<br>$y-40=-\\dfrac k4(x-6) \\Rightarrow 4y-160=-kx+6k \\Rightarrow kx+4y=160+6k$.", "v": "The slope is forty minus forty plus two k, which is negative two k, over six minus negative two, which is eight. So the slope is negative k over four. Using the point six, forty: y minus forty equals negative k over four times x minus six. Multiply by four: four y minus one hundred sixty equals negative k x plus six k. Rearranged, k x plus four y equals one hundred sixty plus six k. The answer is B.", "topic": "Linear functions", "d": 5, "orig": 22, "test": 3, "o": ["$kx-4y=40+6k$", "$kx+4y=160+6k$", "$kx+4y=40+6k$", "$kx-4y=160+6k$"], "a": 1}, {"q": "If $9-x=2x$, what is the value of $x$?", "h": "Add $x$ to both sides to collect the $x$ terms.", "s": "$9=3x \\Rightarrow x=3$.", "v": "Add x to both sides: nine equals three x. Divide by three, and x is three. The answer is A.", "topic": "Linear equations", "d": 1, "orig": 1, "test": 4, "o": ["$3$", "$4.5$", "$9$", "$-3$"], "a": 0}, {"q": "A bakery's daily profit is $P=2c-60$ dollars, where $c$ is the number of cookies sold. What is the least number of cookies it must sell to avoid a loss?", "h": "\"Avoid a loss\" means the profit is at least 0.", "s": "$2c-60\\ge 0 \\Rightarrow c\\ge 30$. The least number is 30.", "v": "To avoid a loss, the profit must be at least zero. So two c minus sixty is at least zero, which means c is at least thirty. The answer is B.", "topic": "Linear inequalities", "d": 2, "orig": 2, "test": 4, "o": ["$20$", "$30$", "$60$", "$120$"], "a": 1}, {"q": "What is the slope of the line $y=4$?", "h": "Picture the graph of $y=4$. Is it horizontal or vertical?", "s": "$y=4$ is a horizontal line ($y$ never changes), so its slope is 0. (A vertical line $x=4$ would have an undefined slope.)", "v": "The line y equals four is horizontal, because y stays at four for every x. A horizontal line has slope zero. The answer is C.", "topic": "Linear functions", "d": 1, "orig": 3, "test": 4, "o": ["$4$", "Undefined", "$0$", "$1$"], "a": 2}, {"q": "If $3x=12$, what is the value of $3x-7$?", "h": "You already know $3x$. Just subtract 7.", "s": "$3x-7=12-7=5$.", "v": "Three x is twelve, so three x minus seven is twelve minus seven, which is five. No need to find x. The answer is A.", "topic": "Linear equations", "d": 1, "orig": 4, "test": 4, "o": ["$5$", "$-3$", "$4$", "$12$"], "a": 0}, {"q": "A line passes through $(-2,\\ 3)$ and has slope 4. What is its $y$-intercept?", "h": "Use $y=mx+b$ with $m=4$ and the point $(-2,\\ 3)$ to find $b$.", "s": "$3=4(-2)+b \\Rightarrow 3=-8+b \\Rightarrow b=11$.", "v": "Use y equals m x plus b. Three equals four times negative two plus b, so three equals negative eight plus b, and b is eleven. The answer is eleven.", "topic": "Linear functions", "d": 2, "orig": 5, "test": 4, "spr": true, "a": ["11"]}, {"q": "Which point is a solution to the system $x+y\\lt 5$ and $x-y\\gt 1$?", "h": "Check each point in both inequalities. Watch the strict signs.", "s": "$(3,1)$: $3+1=4\\lt 5$ ✓ and $3-1=2\\gt 1$ ✓.<br>$(2,1)$: $2-1=1$ is not $\\gt 1$. $(4,2)$: $6$ is not $\\lt 5$. $(1,2)$: $-1$ is not $\\gt 1$.", "v": "For three, one: three plus one is four, which is less than five, and three minus one is two, which is greater than one. Both work. Two, one fails because two minus one is exactly one, not greater than one. The answer is C.", "topic": "Linear inequalities", "d": 2, "orig": 6, "test": 4, "o": ["$(2,\\ 1)$", "$(4,\\ 2)$", "$(3,\\ 1)$", "$(1,\\ 2)$"], "a": 2}, {"q": "A shipping company charges $f(w)=4.5+0.8w$ dollars for a package that weighs $w$ kilograms. By how much does the charge increase for each additional kilogram?", "h": "Which number is multiplied by $w$?", "s": "The coefficient of $w$ is 0.8, so each additional kilogram adds <span class=\"usd\">$<\/span>0.80.", "v": "The number multiplied by w, the weight, is zero point eight. So each extra kilogram adds eighty cents. Four fifty is the fixed charge. The answer is A.", "topic": "Linear functions", "d": 1, "orig": 7, "test": 4, "o": ["<span class=\"usd\">$<\/span>0.80", "<span class=\"usd\">$<\/span>4.50", "<span class=\"usd\">$<\/span>5.30", "<span class=\"usd\">$<\/span>3.70"], "a": 0}, {"q": "How many solutions does $2(3x+1)=6x+2$ have?", "h": "Distribute the left side and compare.", "s": "$6x+2=6x+2$ is an identity, true for all $x$: infinitely many solutions.", "v": "Two times three x plus one is six x plus two, which is exactly the right side. The equation is true for every x, so there are infinitely many solutions. The answer is D.", "topic": "Linear equations", "d": 2, "orig": 8, "test": 4, "o": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "a": 3}, {"q": "If $5x+2y=20$ and $x=2y-8$, what is the value of $x+y$?", "h": "Substitute $x=2y-8$ into the first equation.", "s": "$5(2y-8)+2y=20 \\Rightarrow 12y-40=20 \\Rightarrow y=5$, so $x=2$. $x+y=7$.", "v": "Replace x with two y minus eight. Five times that is ten y minus forty, plus two y gives twelve y minus forty equals twenty. So twelve y is sixty and y is five. Then x is two times five minus eight, which is two. x plus y is seven. The answer is seven.", "topic": "Systems of linear equations", "d": 3, "orig": 9, "test": 4, "spr": true, "a": ["7"]}, {"q": "In the relationship between $x$ and $y$, each increase of 1 in the value of $x$ decreases the value of $y$ by $\\dfrac52$. When $x=-4$, $y=3$. Which equation represents this relationship?", "h": "\"Decreases by $\\tfrac52$ per 1\" gives the slope. Then use $(-4,\\ 3)$ to find $b$.", "s": "Slope $=-\\dfrac52$. $3=-\\dfrac52(-4)+b=10+b \\Rightarrow b=-7$. So $y=-\\dfrac52x-7$.", "v": "y decreases by five halves for each one in x, so the slope is negative five halves. Then three equals negative five halves times negative four plus b, which is ten plus b. So b is negative seven. The equation is y equals negative five halves x minus seven. The answer is B.", "topic": "Linear functions", "d": 3, "orig": 10, "test": 4, "o": ["$y=\\dfrac52x-7$", "$y=-\\dfrac52x-7$", "$y=-\\dfrac52x+7$", "$y=\\dfrac52x+7$"], "a": 1}, {"q": "A runner's distance from a trailhead $t$ hours after starting is $d=6t+2$ miles. What does 2 represent?", "h": "What is $d$ when $t=0$?", "s": "At $t=0$, $d=2$: the runner starts 2 miles from the trailhead. (6 is the speed.)", "v": "When t is zero, at the start, d equals two. So two is the runner's distance from the trailhead at the start. Six is the speed in miles per hour. The answer is B.", "topic": "Linear functions", "d": 1, "orig": 11, "test": 4, "o": ["The runner's speed", "The runner's distance from the trailhead at the start", "The total time", "The distance covered per hour"], "a": 1}, {"q": "If $\\dfrac23x-5=7$, what is the value of $x$?", "h": "Add 5, then multiply by $\\tfrac32$.", "s": "$\\dfrac23x=12 \\Rightarrow x=12\\cdot\\dfrac32=18$.", "v": "Add five: two thirds x equals twelve. Multiply by three halves: x equals eighteen. The answer is C.", "topic": "Linear equations", "d": 1, "orig": 12, "test": 4, "o": ["$8$", "$12$", "$18$", "$24$"], "a": 2}, {"q": "The solution to the system $50(0.4r-0.3s)=700$ and $20(0.3r+0.4s)=460$ is $(r,\\ s)$. What is the value of $r+s$?", "h": "Divide out the 50 and the 20 first, then eliminate $s$.", "s": "$0.4r-0.3s=14$ and $0.3r+0.4s=23$. Multiply by 4 and by 3: $1.6r-1.2s=56$ and $0.9r+1.2s=69$.<br>Adding: $2.5r=125 \\Rightarrow r=50$. Then $0.4s=23-15=8 \\Rightarrow s=20$. So $r+s=70$.", "v": "Divide the first equation by fifty: zero point four r minus zero point three s equals fourteen. Divide the second by twenty: zero point three r plus zero point four s equals twenty three. Multiply the first by four and the second by three, then add, and the s terms cancel: two point five r equals one hundred twenty five, so r is fifty. Then zero point four s equals twenty three minus fifteen, which is eight, so s is twenty. r plus s is seventy. The answer is seventy.", "topic": "Systems of linear equations", "d": 4, "orig": 13, "test": 4, "spr": true, "a": ["70"]}, {"q": "At which point do the lines $y=-x+8$ and $y=\\dfrac13x$ intersect?", "h": "Set the two right sides equal and solve for $x$.", "s": "$-x+8=\\dfrac x3 \\Rightarrow 8=\\dfrac{4x}{3} \\Rightarrow x=6$, $y=2$. The point is $(6,\\ 2)$.", "v": "Set negative x plus eight equal to one third x. Then eight equals four thirds x, so x is six. y is one third of six, which is two. The point is six, two. The answer is C.", "topic": "Systems of linear equations", "d": 2, "orig": 14, "test": 4, "o": ["$(2,\\ 6)$", "$\\left(4,\\ \\dfrac43\\right)$", "$(6,\\ 2)$", "$(3,\\ 1)$"], "a": 2}, {"q": "The lines $3x+4y=12$ and $ax-8y=5$ are parallel. What is the value of $a$?", "h": "Parallel lines have equal slopes. The slope of $Ax+By=C$ is $-\\tfrac AB$.", "s": "Slopes: $-\\dfrac34$ and $\\dfrac a8$. $\\dfrac a8=-\\dfrac34 \\Rightarrow a=-6$.", "v": "The slope of the first line is negative three fourths. The slope of the second is negative a over negative eight, which is a over eight. Set them equal: a over eight equals negative three fourths, so a is negative six. The answer is A.", "topic": "Systems of linear equations", "d": 3, "orig": 15, "test": 4, "o": ["$-6$", "$6$", "$-3$", "$3$"], "a": 0}, {"q": "In the $xy$-plane, a line passes through $(0,\\ 15)$ and $(25,\\ 0)$. The line models the combinations of bags of rice, $x$, and bags of beans, $y$, that a food bank can buy for a total of <span class=\"usd\">$<\/span>900. What is the price, in dollars, of one bag of rice?", "h": "The point $(25,\\ 0)$ means 25 bags of rice and no beans cost <span class=\"usd\">$<\/span>900.", "s": "25 bags of rice and 0 bags of beans cost <span class=\"usd\">$<\/span>900, so one bag of rice costs $900\\div 25=\\$36$. (Beans cost $900\\div 15=\\$60$ — a trap.)", "v": "The point twenty five, zero means twenty five bags of rice and no beans cost nine hundred dollars. So one bag of rice is nine hundred divided by twenty five, which is thirty six dollars. Sixty dollars is the price of beans, which is a trap. The answer is C.", "topic": "Linear functions", "d": 3, "orig": 16, "test": 4, "o": ["$25$", "$60$", "$36$", "$15$"], "a": 2}, {"q": "$f$ is linear with $f(-2)=9$ and $f(4)=-3$. For what value of $x$ is $f(x)=0$?", "h": "Find the slope and the rule for $f$, then set it equal to 0.", "s": "Slope $=\\dfrac{-3-9}{4-(-2)}=-2$. $f(x)=-2x+b$ with $9=4+b \\Rightarrow b=5$: $f(x)=-2x+5$.<br>$-2x+5=0 \\Rightarrow x=\\dfrac52$.", "v": "The slope is negative three minus nine, which is negative twelve, over four minus negative two, which is six. So the slope is negative two. Using f of negative two equals nine, b is five, so f of x is negative two x plus five. Setting that equal to zero gives x equals five halves, or two point five. The answer is five halves.", "topic": "Linear functions", "d": 3, "orig": 17, "test": 4, "spr": true, "a": ["5/2", "2.5"]}, {"q": "A shelf holds 10 boxes, and every box has a positive weight. Four of the boxes have a combined weight of 52 pounds. Each of the other 6 boxes weighs at most 12 pounds. The total weight of the boxes on the shelf is $w$ pounds. Which inequality best represents this situation?", "h": "Find the smallest and the largest possible total weight of the other 6 boxes.", "s": "The other 6 boxes weigh more than 0 and at most $6\\times 12=72$ pounds. So $52\\lt w\\le 52+72=124$.", "v": "The six other boxes have positive weight, so together they weigh more than zero, and at most six times twelve, which is seventy two pounds. Adding the fifty two pounds, the total is more than fifty two and at most one hundred twenty four. The answer is A.", "topic": "Linear inequalities", "d": 4, "orig": 18, "test": 4, "o": ["$52\\lt w\\le 124$", "$0\\lt w\\le 124$", "$52\\lt w\\le 72$", "$w\\ge 124$"], "a": 0}, {"q": "If $\\dfrac{x+y}{x-y}=3$, what is the value of $\\dfrac xy$?", "h": "Cross-multiply, then collect $x$ terms on one side and $y$ terms on the other.", "s": "$x+y=3x-3y \\Rightarrow 4y=2x \\Rightarrow \\dfrac xy=2$.", "v": "Multiply both sides by x minus y: x plus y equals three x minus three y. Rearranging, four y equals two x. Dividing both sides by two y gives x over y equals two. The answer is B.", "topic": "Linear equations", "d": 4, "orig": 19, "test": 4, "o": ["$\\dfrac12$", "$2$", "$3$", "$4$"], "a": 1}, {"q": "The system $6x-py=3$ and $4x+9y=2$ has infinitely many solutions. What is the value of $p$?", "h": "The first equation must be a constant multiple of the second. Find that multiple from the $x$-coefficients.", "s": "$\\dfrac64=1.5$, so $-p=1.5\\times 9=13.5 \\Rightarrow p=-13.5$. The constants also have ratio $\\dfrac32=1.5$ ✓.", "v": "Six over four is one point five, so the first equation must be one point five times the second. Then negative p equals one point five times nine, which is thirteen point five, so p is negative thirteen point five. The constants three and two also have ratio one point five, so it checks. The answer is A.", "topic": "Systems of linear equations", "d": 4, "orig": 20, "test": 4, "o": ["$-13.5$", "$-6$", "$6$", "$13.5$"], "a": 0}, {"q": "A line through the origin is perpendicular to $2x+5y=10$. The point $(a,\\ 10)$ lies on this line. What is the value of $a$?", "h": "The slope of $2x+5y=10$ is $-\\tfrac25$. The perpendicular line through the origin is $y=mx$.", "s": "$2x+5y=10$ has slope $-\\dfrac25$, so the line is $y=\\dfrac52x$. Then $10=\\dfrac52a \\Rightarrow a=4$.", "v": "The given line has slope negative two fifths, so the perpendicular slope is five halves. Through the origin, the line is y equals five halves x. Put in y equals ten: ten equals five halves a, so a is four. The answer is four.", "topic": "Linear functions", "d": 4, "orig": 21, "test": 4, "spr": true, "a": ["4"]}, {"q": "Tank A holds 40,000 liters of fuel and loses 1,250 liters per hour. Tank B holds 25,000 liters and loses 500 liters per hour. After how many hours will tank A hold 3,000 liters less than tank B?", "h": "Write $A(t)$ and $B(t)$, then solve $A=B-3000$.", "s": "$A=40{,}000-1{,}250t$ and $B=25{,}000-500t$.<br>$40{,}000-1{,}250t=22{,}000-500t \\Rightarrow 18{,}000=750t \\Rightarrow t=24$.", "v": "Tank A has forty thousand minus twelve hundred fifty t liters. Tank B has twenty five thousand minus five hundred t liters. We want A to equal B minus three thousand, which is twenty two thousand minus five hundred t. Then eighteen thousand equals seven hundred fifty t, so t is twenty four hours. The answer is C.", "topic": "Linear equations", "d": 5, "orig": 22, "test": 4, "o": ["$20$", "$22$", "$24$", "$30$"], "a": 2}, {"q": "If $x\\gt 0$ and $x^2=49$, what is the value of $x$?", "h": "Which positive number times itself is 49?", "s": "$x=\\pm 7$, and $x\\gt 0$ gives $x=7$.", "v": "x squared equals forty nine means x is seven or negative seven. Since x is positive, x is seven. The answer is A.", "topic": "Quadratics", "d": 1, "orig": 1, "test": 5, "o": ["$7$", "$14$", "$24.5$", "$49$"], "a": 0}, {"q": "Which expression is equivalent to $(x+3)(x-5)$?", "h": "Multiply each term in the first bracket by each term in the second (FOIL).", "s": "$x^2-5x+3x-15=x^2-2x-15$.", "v": "Multiply out: x times x is x squared, x times negative five is negative five x, three times x is three x, and three times negative five is negative fifteen. Negative five x plus three x is negative two x. So the result is x squared minus two x minus fifteen. The answer is C.", "topic": "Polynomials & factoring", "d": 1, "orig": 2, "test": 5, "o": ["$x^2+2x-15$", "$x^2-15$", "$x^2-2x-15$", "$x^2-8x-15$"], "a": 2}, {"q": "If $f(x)=x^2+2x$, what is $f(3)$?", "h": "Substitute 3 for every $x$.", "s": "$f(3)=3^2+2(3)=9+6=15$.", "v": "Three squared is nine and two times three is six. Nine plus six is fifteen. The answer is A.", "topic": "Functions & transformations", "d": 1, "orig": 3, "test": 5, "o": ["$15$", "$9$", "$11$", "$18$"], "a": 0}, {"q": "Which expression is equivalent to $x^5\\cdot x^3$?", "h": "When you multiply powers with the same base, add the exponents.", "s": "$x^5\\cdot x^3=x^{5+3}=x^8$.", "v": "When multiplying powers with the same base, add the exponents. Five plus three is eight, so the result is x to the eighth. The answer is B.", "topic": "Exponential, radical & rational", "d": 1, "orig": 4, "test": 5, "o": ["$x^{15}$", "$x^8$", "$x^2$", "$2x^8$"], "a": 1}, {"q": "What is the greater solution to $x^2-7x+10=0$?", "h": "Find two numbers that multiply to 10 and add to $-7$.", "s": "$(x-2)(x-5)=0 \\Rightarrow x=2$ or $x=5$. The greater solution is 5.", "v": "Negative two and negative five multiply to ten and add to negative seven, so the equation factors as x minus two times x minus five equals zero. The solutions are two and five. The greater one is five. The answer is five.", "topic": "Quadratics", "d": 1, "orig": 5, "test": 5, "spr": true, "a": ["5"]}, {"q": "The population of a town $t$ years from now is modeled by $P(t)=800(1.05)^t$. What does 1.05 indicate?", "h": "Write the base as $1+r$. What is $r$?", "s": "$1.05=1+0.05$: each year the population is multiplied by 1.05, i.e. it grows by 5%.", "v": "The base one point zero five equals one plus zero point zero five. Multiplying by it each year means the population grows by five percent each year. The answer is B.", "topic": "Exponential, radical & rational", "d": 2, "orig": 6, "test": 5, "o": ["The population increases by 5 people each year.", "The population increases by 5% each year.", "The initial population is 1.05.", "The population decreases by 5% each year."], "a": 1}, {"q": "Which expression is equivalent to $x^2-36$?", "h": "Difference of squares: $a^2-b^2=(a-b)(a+b)$.", "s": "$x^2-36=x^2-6^2=(x-6)(x+6)$.", "v": "x squared minus thirty six is a difference of two squares, x squared minus six squared. It factors as x minus six times x plus six. The answer is A.", "topic": "Polynomials & factoring", "d": 1, "orig": 7, "test": 5, "o": ["$(x-6)(x+6)$", "$(x-6)^2$", "$(x-18)(x+2)$", "$(x-36)(x+1)$"], "a": 0}, {"q": "If $4\\sqrt{3x}=12$, what is the value of $15x$?", "h": "Divide by 4 first, then square both sides.", "s": "$\\sqrt{3x}=3 \\Rightarrow 3x=9 \\Rightarrow x=3$, so $15x=45$. (Faster: $15x=5\\cdot 3x=45$.)", "v": "Divide by four: the square root of three x equals three. Square both sides: three x equals nine. Then fifteen x is five times three x, which is five times nine, or forty five. The answer is B.", "topic": "Exponential, radical & rational", "d": 2, "orig": 8, "test": 5, "o": ["$9$", "$45$", "$15$", "$135$"], "a": 1}, {"q": "If $f(x)=2^x$, what is the value of $f(5)-f(3)$?", "h": "Compute $2^5$ and $2^3$ separately.", "s": "$f(5)-f(3)=2^5-2^3=32-8=24$.", "v": "Two to the fifth is thirty two and two cubed is eight. Thirty two minus eight is twenty four. The answer is twenty four.", "topic": "Exponential, radical & rational", "d": 2, "orig": 9, "test": 5, "spr": true, "a": ["24"]}, {"q": "What is the vertex of the parabola $y=(x-4)^2-7$?", "h": "In vertex form $y=a(x-h)^2+k$, the vertex is $(h,\\ k)$. Watch the sign of $h$.", "s": "$y=(x-4)^2-7$ has $h=4$ and $k=-7$: vertex $(4,\\ -7)$.", "v": "In vertex form, y equals a times x minus h squared plus k, the vertex is h, k. Here h is four, because of x minus four, and k is negative seven. The vertex is four, negative seven. The answer is C.", "topic": "Quadratics", "d": 1, "orig": 10, "test": 5, "o": ["$(-4,\\ -7)$", "$(4,\\ 7)$", "$(4,\\ -7)$", "$(-4,\\ 7)$"], "a": 2}, {"q": "If $f(x)=x^2-1$ and $g(x)=3x$, what is $f(g(2))$?", "h": "Work from the inside out: find $g(2)$ first.", "s": "$g(2)=6$, then $f(6)=36-1=35$.", "v": "Start inside. g of two is three times two, which is six. Then f of six is six squared minus one, which is thirty five. The answer is A.", "topic": "Functions & transformations", "d": 2, "orig": 11, "test": 5, "o": ["$35$", "$11$", "$12$", "$33$"], "a": 0}, {"q": "The equation $a=-\\dfrac{b}{36c}$ relates the distinct nonzero numbers $a$, $b$ and $c$. Which equation correctly expresses $b$ in terms of $a$ and $c$?", "h": "Multiply both sides by $36c$, then by $-1$.", "s": "$36ac=-b \\Rightarrow b=-36ac$.", "v": "Multiply both sides by thirty six c: thirty six a c equals negative b. Multiply both sides by negative one: b equals negative thirty six a c. The answer is C.", "topic": "Exponential, radical & rational", "d": 2, "orig": 12, "test": 5, "o": ["$b=-\\dfrac{36a}{c}$", "$b=-\\dfrac{c}{36a}$", "$b=-36ac$", "$b=a+36c$"], "a": 2}, {"q": "If $x^2+8x+c=(x+4)^2$ for all $x$, what is the value of $c$?", "h": "Expand $(x+4)^2$ and compare the constant terms.", "s": "$(x+4)^2=x^2+8x+16$, so $c=16$.", "v": "x plus four squared is x squared plus eight x plus sixteen. Matching the constant terms, c is sixteen. The answer is sixteen.", "topic": "Polynomials & factoring", "d": 2, "orig": 13, "test": 5, "spr": true, "a": ["16"]}, {"q": "How many distinct real solutions does the equation $(x-8)(x+3)=0$ have?", "h": "A product is 0 when one of its factors is 0.", "s": "$x=8$ or $x=-3$: two different values, so exactly two solutions.", "v": "The product is zero when x minus eight is zero or x plus three is zero. That gives x equals eight or x equals negative three, two different solutions. The answer is C.", "topic": "Quadratics", "d": 2, "orig": 14, "test": 5, "o": ["Zero", "Exactly one", "Exactly two", "Infinitely many"], "a": 2}, {"q": "A ball's height $t$ seconds after it is thrown is $h(t)=-5t^2+20t+1$ meters. What is the maximum height of the ball, in meters?", "h": "The maximum is at the vertex, $t=-\\dfrac{b}{2a}$.", "s": "$t=-\\dfrac{20}{2(-5)}=2$. $h(2)=-20+40+1=21$ meters.", "v": "The maximum of a downward parabola is at the vertex, where t equals negative b over two a. That is negative twenty over negative ten, which is two seconds. Then h of two is negative twenty plus forty plus one, which is twenty one meters. The answer is B.", "topic": "Quadratics", "d": 3, "orig": 15, "test": 5, "o": ["$20$", "$21$", "$25$", "$41$"], "a": 1}, {"q": "Which ordered pair is a solution to the system $y=x^2$ and $y=x+6$?", "h": "Set $x^2=x+6$ and solve, or test each pair in BOTH equations.", "s": "$x^2-x-6=0 \\Rightarrow (x-3)(x+2)=0 \\Rightarrow x=3$ or $x=-2$. At $x=-2$, $y=4$: $(-2,\\ 4)$ is a solution.", "v": "Set x squared equal to x plus six. That gives x squared minus x minus six equals zero, which factors as x minus three times x plus two. So x is three or negative two. When x is negative two, y is four, and four equals negative two plus six. The answer is D.", "topic": "Nonlinear systems", "d": 3, "orig": 16, "test": 5, "o": ["$(2,\\ 4)$", "$(-3,\\ 9)$", "$(6,\\ 36)$", "$(-2,\\ 4)$"], "a": 3}, {"q": "For $x\\ne -3$, which expression is equivalent to $\\dfrac{x^2-9}{x+3}$?", "h": "Factor the numerator as a difference of squares.", "s": "$\\dfrac{(x-3)(x+3)}{x+3}=x-3$.", "v": "The numerator, x squared minus nine, factors as x minus three times x plus three. The x plus three cancels with the denominator, leaving x minus three. The answer is B.", "topic": "Exponential, radical & rational", "d": 2, "orig": 17, "test": 5, "o": ["$x+3$", "$x-3$", "$x-9$", "$x^2-3$"], "a": 1}, {"q": "If $p(x)=2x^3-5x^2+kx-6$ and $p(2)=0$, what is the value of $k$?", "h": "Substitute $x=2$ and set the result equal to 0.", "s": "$p(2)=16-20+2k-6=0 \\Rightarrow 2k-10=0 \\Rightarrow k=5$.", "v": "Put two in for x. Two times eight is sixteen, five times four is twenty, so sixteen minus twenty plus two k minus six equals zero. That is two k minus ten equals zero, so k is five. The answer is five.", "topic": "Polynomials & factoring", "d": 3, "orig": 18, "test": 5, "spr": true, "a": ["5"]}, {"q": "In the $xy$-plane, a graph falls from left to right, approaches the horizontal line $y=3$ as $x$ increases, and crosses the $y$-axis at $(0,\\ 4)$. Which equation could define the graph?", "h": "Falling means a negative exponent (decay). The asymptote is the added constant. Then check $x=0$.", "s": "$y=2^{-x}+3$ falls, approaches $y=3$, and $y(0)=1+3=4$ ✓.", "v": "A falling exponential graph needs two to the negative x. The graph levels off at y equals three, so the constant added is three. Check x equals zero: two to the zero is one, plus three is four. That matches. The answer is B.", "topic": "Exponential, radical & rational", "d": 3, "orig": 19, "test": 5, "o": ["$y=2^x+3$", "$y=2^{-x}+3$", "$y=2^x+4$", "$y=2^{-x}+4$"], "a": 1}, {"q": "A car worth <span class=\"usd\">$<\/span>24,000 loses 15% of its value each year. What is its value, in dollars, after 2 years?", "h": "Losing 15% means keeping 85% each year. Multiply by 0.85 twice.", "s": "$24{,}000\\times 0.85^2=24{,}000\\times 0.7225=\\$17{,}340$.", "v": "Losing fifteen percent each year means keeping eighty five percent. After two years the value is twenty four thousand times zero point eight five squared, which is twenty four thousand times zero point seven two two five. That is seventeen thousand three hundred forty dollars. The answer is C.", "topic": "Exponential, radical & rational", "d": 3, "orig": 20, "test": 5, "o": ["$16{,}800$", "$20{,}400$", "$17{,}340$", "$17{,}000$"], "a": 2}, {"q": "The parabola $y=x^2-6x+k$ and the line $y=2$ intersect at exactly one point. What is the value of $k$?", "h": "Set $x^2-6x+k=2$. Exactly one solution means the discriminant is 0.", "s": "$x^2-6x+(k-2)=0$. Discriminant: $36-4(k-2)=0 \\Rightarrow k-2=9 \\Rightarrow k=11$.", "v": "Set x squared minus six x plus k equal to two, so x squared minus six x plus k minus two equals zero. Exactly one intersection means the discriminant is zero: thirty six minus four times k minus two equals zero. So k minus two is nine, and k is eleven. The answer is eleven.", "topic": "Nonlinear systems", "d": 4, "orig": 21, "test": 5, "spr": true, "a": ["11"]}, {"q": "What is the solution set of $\\sqrt{2x+3}=x$?", "h": "Square both sides, solve, then CHECK each answer in the original equation.", "s": "$2x+3=x^2 \\Rightarrow (x-3)(x+1)=0$. $x=3$ checks ($\\sqrt9=3$); $x=-1$ fails ($\\sqrt1=1\\ne -1$). Solution set $\\{3\\}$.", "v": "Square both sides: two x plus three equals x squared, which factors as x minus three times x plus one equals zero. So x is three or negative one. Check: the square root of nine is three, so three works. The square root of one is one, not negative one, so negative one is extraneous. The answer is B.", "topic": "Exponential, radical & rational", "d": 4, "orig": 22, "test": 5, "o": ["$\\{-1,\\ 3\\}$", "$\\{3\\}$", "$\\{-1\\}$", "There is no solution."], "a": 1}, {"q": "If $x\\gt 0$ and $3x^2=75$, what is the value of $x$?", "h": "Divide by 3 first, then take the positive square root.", "s": "$x^2=25$ and $x\\gt 0 \\Rightarrow x=5$.", "v": "Divide both sides by three: x squared equals twenty five. Since x is positive, x is five. The answer is A.", "topic": "Quadratics", "d": 1, "orig": 1, "test": 6, "o": ["$5$", "$25$", "$\\sqrt{75}$", "$15$"], "a": 0}, {"q": "Which expression is the factored form of $4x^2-12x$?", "h": "Find the greatest common factor of $4x^2$ and $12x$.", "s": "The GCF is $4x$: $4x^2-12x=4x(x-3)$.", "v": "Both terms share four x. Four x squared divided by four x is x, and twelve x divided by four x is three. So the expression is four x times x minus three. The answer is B.", "topic": "Polynomials & factoring", "d": 1, "orig": 2, "test": 6, "o": ["$x(4x-3)$", "$4x(x-3)$", "$4x(x-12)$", "$2x(2x-3)$"], "a": 1}, {"q": "If $f(x)=\\dfrac{x-2}{x+1}$, what is $f(5)$?", "h": "Substitute 5 in the numerator and in the denominator.", "s": "$f(5)=\\dfrac{5-2}{5+1}=\\dfrac36=\\dfrac12$.", "v": "Five minus two is three, and five plus one is six. Three sixths is one half. The answer is A.", "topic": "Exponential, radical & rational", "d": 1, "orig": 3, "test": 6, "o": ["$\\dfrac12$", "$2$", "$\\dfrac34$", "$1$"], "a": 0}, {"q": "What is the value of $5^{-2}$?", "h": "A negative exponent means \"one over\": $a^{-n}=\\dfrac{1}{a^n}$.", "s": "$5^{-2}=\\dfrac{1}{5^2}=\\dfrac{1}{25}$.", "v": "A negative exponent means take the reciprocal. Five to the negative two is one over five squared, which is one over twenty five. It is not a negative number. The answer is C.", "topic": "Exponential, radical & rational", "d": 1, "orig": 4, "test": 6, "o": ["$-25$", "$-10$", "$\\dfrac{1}{25}$", "$\\dfrac{1}{10}$"], "a": 2}, {"q": "If $g(x)=x^2-3x+2$, what is $g(-1)$?", "h": "Use parentheses: $(-1)^2=1$ and $-3(-1)=+3$.", "s": "$g(-1)=(-1)^2-3(-1)+2=1+3+2=6$.", "v": "Negative one squared is one. Negative three times negative one is positive three. One plus three plus two is six. The answer is six.", "topic": "Functions & transformations", "d": 1, "orig": 5, "test": 6, "spr": true, "a": ["6"]}, {"q": "Which of the following is a zero of $f(x)=(x+4)(2x-6)$?", "h": "Set each factor equal to 0.", "s": "$x+4=0 \\Rightarrow x=-4$; $2x-6=0 \\Rightarrow x=3$. Of the options, 3 is a zero.", "v": "A zero makes the function equal zero, so set each factor to zero. x plus four is zero when x is negative four, and two x minus six is zero when x is three. Only three is among the choices. The answer is B.", "topic": "Polynomials & factoring", "d": 2, "orig": 6, "test": 6, "o": ["$-3$", "$3$", "$4$", "$6$"], "a": 1}, {"q": "Which function models exponential decay?", "h": "In $a\\cdot b^x$, decay means the base $b$ is between 0 and 1.", "s": "Only $f(x)=4(0.7)^x$ has a base between 0 and 1, so it decays. (The starting value $a$ does not decide growth or decay.)", "v": "An exponential function decays when its base is between zero and one. Only four times zero point seven to the x has such a base. The coefficient zero point five in choice B is not the base, so that one still grows. The answer is C.", "topic": "Exponential, radical & rational", "d": 2, "orig": 7, "test": 6, "o": ["$f(x)=3(1.2)^x$", "$f(x)=0.5(2)^x$", "$f(x)=4(0.7)^x$", "$f(x)=2x-7$"], "a": 2}, {"q": "If $(x-1)^2=16$, which of the following could be the value of $x$?", "h": "Take square roots of both sides: $x-1=\\pm 4$.", "s": "$x-1=4$ or $x-1=-4 \\Rightarrow x=5$ or $x=-3$. Answer: $-3$.", "v": "Take the square root of both sides: x minus one is four or negative four. So x is five or negative three. Negative three is a choice. The answer is B.", "topic": "Quadratics", "d": 2, "orig": 8, "test": 6, "o": ["$-5$", "$-3$", "$3$", "$17$"], "a": 1}, {"q": "The expression $(6x^3-4)-(-3x^3+2)$ is equivalent to $bx^3-6$, where $b$ is a constant. What is the value of $b$?", "h": "Distribute the minus sign to both terms in the second bracket.", "s": "$6x^3-4+3x^3-2=9x^3-6$, so $b=9$.", "v": "Subtracting the second bracket changes both signs: six x cubed minus four plus three x cubed minus two. That is nine x cubed minus six, so b is nine. The answer is nine.", "topic": "Polynomials & factoring", "d": 2, "orig": 9, "test": 6, "spr": true, "a": ["9"]}, {"q": "If $f(x)=3x-4$ and $g(x)=x^2$, what is $g(f(2))$?", "h": "Inside first: compute $f(2)$, then put that into $g$.", "s": "$f(2)=6-4=2$, then $g(2)=2^2=4$.", "v": "First find f of two: three times two minus four is two. Then g of two is two squared, which is four. The answer is A.", "topic": "Functions & transformations", "d": 2, "orig": 10, "test": 6, "o": ["$4$", "$8$", "$12$", "$2$"], "a": 0}, {"q": "The exponential function $h$ is defined by $h(x)=a\\cdot b^x$, where $a$ and $b$ are positive constants. If $h(k)=n$ and the value of $h(k+1)$ is 48% more than $n$, where $k$ and $n$ are constants, what is the value of $b$?", "h": "Going from $x=k$ to $x=k+1$ multiplies the output by $b$ once.", "s": "$h(k+1)=b\\cdot h(k)=b\\cdot n$. \"48% more than $n$\" is $1.48n$, so $b=1.48$.", "v": "Increasing x by one multiplies the output by b. So h of k plus one equals b times n. Forty eight percent more than n is one point four eight n. So b is one point four eight. The answer is B.", "topic": "Exponential, radical & rational", "d": 3, "orig": 11, "test": 6, "o": ["$0.48$", "$1.48$", "$0.52$", "$2.96$"], "a": 1}, {"q": "What is the maximum value of $y=-2(x+1)^2+5$?", "h": "The parabola opens down ($a\\lt 0$), so the vertex is the highest point.", "s": "$a=-2\\lt 0$, so the maximum is the vertex's $y$-value: 5, at $x=-1$.", "v": "The coefficient negative two means the parabola opens downward, so its vertex is the highest point. The vertex is negative one, five. The maximum value is five. The answer is C.", "topic": "Quadratics", "d": 2, "orig": 12, "test": 6, "o": ["$-1$", "$1$", "$5$", "$-2$"], "a": 2}, {"q": "What is the product of the solutions to $x^2-10x+21=0$?", "h": "Factor, or use: product of roots $=\\dfrac ca$.", "s": "$(x-3)(x-7)=0$, roots 3 and 7. Product $=21$ (also $\\dfrac ca=\\dfrac{21}{1}$).", "v": "The equation factors as x minus three times x minus seven, so the roots are three and seven. Their product is twenty one. You can also use c over a, which is twenty one over one. The answer is twenty one.", "topic": "Quadratics", "d": 2, "orig": 13, "test": 6, "spr": true, "a": ["21"]}, {"q": "A culture that starts with 500 bacteria doubles every 3 hours. How many bacteria are there after 12 hours?", "h": "How many 3-hour periods are in 12 hours?", "s": "$12\\div 3=4$ doublings: $500\\times 2^4=500\\times 16=8{,}000$.", "v": "Twelve hours contains four three hour periods, so the culture doubles four times. Five hundred times two to the fourth, which is sixteen, is eight thousand. The answer is C.", "topic": "Exponential, radical & rational", "d": 2, "orig": 14, "test": 6, "o": ["$2{,}000$", "$4{,}000$", "$8{,}000$", "$16{,}000$"], "a": 2}, {"q": "What is the greatest solution to $5x^2+3x-1=0$?", "h": "Use the quadratic formula with $a=5$, $b=3$, $c=-1$. The greater root uses $+$.", "s": "$x=\\dfrac{-3\\pm\\sqrt{9+20}}{10}=\\dfrac{-3\\pm\\sqrt{29}}{10}$. The greater one is $-\\dfrac{3}{10}+\\dfrac{\\sqrt{29}}{10}$.", "v": "Use the quadratic formula. b squared minus four a c is nine plus twenty, which is twenty nine. So x equals negative three plus or minus root twenty nine, all over ten. The greater solution uses the plus sign: negative three tenths plus root twenty nine over ten. The answer is B.", "topic": "Quadratics", "d": 3, "orig": 15, "test": 6, "o": ["$-\\dfrac{3}{10}-\\dfrac{\\sqrt{29}}{10}$", "$-\\dfrac{3}{10}+\\dfrac{\\sqrt{29}}{10}$", "$-\\dfrac35+\\dfrac{\\sqrt{29}}{5}$", "$-\\dfrac35-\\dfrac{\\sqrt{29}}{5}$"], "a": 1}, {"q": "If $h(x)=x^2-4x$, which expression is equal to $h(x+1)$?", "h": "Replace every $x$ with $(x+1)$, then expand.", "s": "$(x+1)^2-4(x+1)=x^2+2x+1-4x-4=x^2-2x-3$.", "v": "Replace x with x plus one. x plus one squared is x squared plus two x plus one. Minus four times x plus one is minus four x minus four. Combine: x squared minus two x minus three. The answer is A.", "topic": "Functions & transformations", "d": 3, "orig": 16, "test": 6, "o": ["$x^2-2x-3$", "$x^2-4x+1$", "$x^2-2x+5$", "$x^2+2x-3$"], "a": 0}, {"q": "The weekly revenue $R(p)$, in dollars, that a shop earns when it prices a product at $p$ dollars is given by $R(p)=-2p^2+120p$. If $R$ is graphed in the $xy$-plane with $y=R(p)$, what is the best interpretation of the point $(25,\\ 1{,}750)$ on the graph?", "h": "The $x$-coordinate is the input (price); the $y$-coordinate is the output (revenue).", "s": "$x=p=25$ is the price and $y=R(25)=1{,}750$ is the revenue: at a price of <span class=\"usd\">$<\/span>25, the weekly revenue is <span class=\"usd\">$<\/span>1,750.", "v": "The x coordinate is the input, the price, and the y coordinate is the output, the weekly revenue. So at a price of twenty five dollars, the weekly revenue is one thousand seven hundred fifty dollars. The answer is C.", "topic": "Quadratics", "d": 2, "orig": 17, "test": 6, "o": ["At a price of <span class=\"usd\">$<\/span>1,750, the weekly revenue is <span class=\"usd\">$<\/span>25.", "The weekly revenue increases by <span class=\"usd\">$<\/span>25 for every <span class=\"usd\">$<\/span>1,750 increase in price.", "At a price of <span class=\"usd\">$<\/span>25, the weekly revenue is <span class=\"usd\">$<\/span>1,750.", "At a price of <span class=\"usd\">$<\/span>25, the weekly revenue increases by <span class=\"usd\">$<\/span>1,750 each week."], "a": 2}, {"q": "If $x^{\\frac{1}{2}}=6$, what is the value of $x^{\\frac{3}{2}}$?", "h": "$x^{\\frac{3}{2}}=\\left(x^{\\frac{1}{2}}\\right)^3$.", "s": "$x^{\\frac{3}{2}}=\\left(x^{\\frac{1}{2}}\\right)^3=6^3=216$. (Or $x=36$ and $36\\sqrt{36}=216$.)", "v": "x to the three halves is x to the one half, cubed. That is six cubed, which is two hundred sixteen. The answer is two hundred sixteen.", "topic": "Exponential, radical & rational", "d": 3, "orig": 18, "test": 6, "spr": true, "a": ["216"]}, {"q": "$p(x)$ is a polynomial and $p(4)=0$. Which statement must be true?", "h": "Factor theorem: $p(a)=0$ exactly when $(x-a)$ is a factor.", "s": "By the factor theorem, $p(4)=0$ means $x-4$ is a factor of $p(x)$.", "v": "The factor theorem says that if p of a equals zero, then x minus a is a factor. Here p of four is zero, so x minus four is a factor. Careful: it is x minus four, not x plus four. The answer is D.", "topic": "Polynomials & factoring", "d": 3, "orig": 19, "test": 6, "o": ["$x+4$ is a factor of $p(x)$.", "$p(0)=4$.", "When $p(x)$ is divided by $x$, the remainder is 4.", "$x-4$ is a factor of $p(x)$."], "a": 3}, {"q": "The parabola $y=ax^2+bx+c$ passes through $(0,\\ -3)$ and $(1,\\ 0)$, and its axis of symmetry is $x=2$. What is the value of $a$?", "h": "$(0,-3)$ gives $c$. The axis gives $-\\dfrac{b}{2a}=2$. Then use $(1,\\ 0)$.", "s": "$c=-3$. $-\\dfrac{b}{2a}=2 \\Rightarrow b=-4a$. At $(1,0)$: $a+b-3=0 \\Rightarrow a-4a=3 \\Rightarrow a=-1$.", "v": "The point zero, negative three gives c equals negative three. The axis of symmetry is negative b over two a equals two, so b equals negative four a. Plug in the point one, zero: a plus b minus three equals zero. Replace b: a minus four a equals three, so negative three a equals three and a is negative one. The answer is A.", "topic": "Quadratics", "d": 4, "orig": 20, "test": 6, "o": ["$-1$", "$1$", "$3$", "$-3$"], "a": 0}, {"q": "For $x\\ne -6$, $\\dfrac{x^2+kx-12}{x+6}=x-2$. What is the value of $k$?", "h": "Multiply both sides by $(x+6)$ and expand.", "s": "$x^2+kx-12=(x+6)(x-2)=x^2+4x-12$, so $k=4$.", "v": "Multiply both sides by x plus six. x plus six times x minus two is x squared plus four x minus twelve. Comparing the x terms, k is four. The answer is four.", "topic": "Polynomials & factoring", "d": 3, "orig": 21, "test": 6, "spr": true, "a": ["4"]}, {"q": "The value of a machine $t$ years from now is $V(t)=1{,}200(0.9)^{\\frac{t}{4}}$ dollars. After how many years will its value be $1{,}200(0.81)$ dollars?", "h": "$0.81=0.9^2$. Match the exponents.", "s": "$(0.9)^{\\frac{t}{4}}=0.81=(0.9)^2 \\Rightarrow \\dfrac t4=2 \\Rightarrow t=8$ years.", "v": "Zero point eight one is zero point nine squared. So zero point nine to the t over four equals zero point nine to the second power. Then t over four is two, and t is eight years. The answer is C.", "topic": "Exponential, radical & rational", "d": 4, "orig": 22, "test": 6, "o": ["$2$", "$4$", "$8$", "$16$"], "a": 2}, {"q": "What are the solutions to $x^2-25=0$?", "h": "$x^2=25$. Which numbers square to 25? There are two.", "s": "$x^2=25 \\Rightarrow x=-5$ or $x=5$.", "v": "x squared equals twenty five. Both five and negative five square to twenty five, so there are two solutions. The answer is B.", "topic": "Quadratics", "d": 1, "orig": 1, "test": 7, "o": ["$5$ only", "$-5$ and $5$", "$-25$ and $25$", "$25$ only"], "a": 1}, {"q": "If $f(x)=2x^2-3$, what is $f(-2)$?", "h": "Square first: $(-2)^2=4$. Then multiply by 2.", "s": "$f(-2)=2(-2)^2-3=2(4)-3=5$.", "v": "Negative two squared is four. Two times four is eight, and eight minus three is five. The answer is A.", "topic": "Functions & transformations", "d": 1, "orig": 2, "test": 7, "o": ["$5$", "$-11$", "$11$", "$-5$"], "a": 0}, {"q": "Which expression is equivalent to $(3x^2y)(4xy^3)$?", "h": "Multiply the numbers; add the exponents of matching letters.", "s": "$3\\cdot 4=12$, $x^2\\cdot x=x^3$, $y\\cdot y^3=y^4$: $12x^3y^4$.", "v": "Multiply the coefficients: three times four is twelve. x squared times x is x cubed. y times y cubed is y to the fourth. So the result is twelve x cubed y to the fourth. The answer is C.", "topic": "Exponential, radical & rational", "d": 1, "orig": 3, "test": 7, "o": ["$7x^3y^4$", "$12x^2y^3$", "$12x^3y^4$", "$12x^3y^3$"], "a": 2}, {"q": "Which expression is equivalent to $\\sqrt{50}$?", "h": "Write 50 as a perfect square times another number.", "s": "$\\sqrt{50}=\\sqrt{25\\cdot 2}=\\sqrt{25}\\cdot\\sqrt2=5\\sqrt2$.", "v": "Fifty is twenty five times two. The square root of twenty five is five, so root fifty is five root two. The answer is B.", "topic": "Exponential, radical & rational", "d": 1, "orig": 4, "test": 7, "o": ["$25\\sqrt2$", "$5\\sqrt2$", "$2\\sqrt5$", "$10\\sqrt5$"], "a": 1}, {"q": "What is the $x$-coordinate of the vertex of the parabola $f(x)=x^2-4x+1$?", "h": "Vertex $x$-coordinate: $x=-\\dfrac{b}{2a}$.", "s": "$x=-\\dfrac{-4}{2(1)}=2$.", "v": "The x coordinate of the vertex is negative b over two a. That is four over two, which is two. The answer is two.", "topic": "Quadratics", "d": 1, "orig": 5, "test": 7, "spr": true, "a": ["2"]}, {"q": "A quantity is modeled by $Q=300(0.8)^t$, where $t$ is the number of periods. By what percent does $Q$ decrease each period?", "h": "Write $0.8=1-r$.", "s": "$0.8=1-0.2$: each period $Q$ keeps 80%, so it decreases by 20%.", "v": "The base zero point eight equals one minus zero point two. Each period, Q keeps eighty percent of its value, so it loses twenty percent. The answer is C.", "topic": "Exponential, radical & rational", "d": 2, "orig": 6, "test": 7, "o": ["$80\\%$", "$8\\%$", "$20\\%$", "$0.8\\%$"], "a": 2}, {"q": "Which expression is equivalent to $(x+2)^2$?", "h": "$(a+b)^2=a^2+2ab+b^2$. Don't forget the middle term.", "s": "$(x+2)^2=x^2+2\\cdot 2x+4=x^2+4x+4$.", "v": "x plus two squared is x squared, plus two times x times two, which is four x, plus two squared, which is four. That gives x squared plus four x plus four. The answer is B.", "topic": "Polynomials & factoring", "d": 1, "orig": 7, "test": 7, "o": ["$x^2+4$", "$x^2+4x+4$", "$x^2+2x+4$", "$x^2+4x+2$"], "a": 1}, {"q": "If $2^{x+1}=16$, what is the value of $x$?", "h": "Write 16 as a power of 2.", "s": "$16=2^4$, so $x+1=4 \\Rightarrow x=3$.", "v": "Sixteen is two to the fourth. So x plus one equals four, and x is three. The answer is A.", "topic": "Exponential, radical & rational", "d": 2, "orig": 8, "test": 7, "o": ["$3$", "$4$", "$7$", "$8$"], "a": 0}, {"q": "If $x(x-6)=-9$, what is the value of $x$?", "h": "Expand and move everything to one side. Look for a perfect square.", "s": "$x^2-6x+9=0 \\Rightarrow (x-3)^2=0 \\Rightarrow x=3$.", "v": "Expand to get x squared minus six x equals negative nine. Add nine: x squared minus six x plus nine equals zero. That is x minus three, squared. So x is three. The answer is three.", "topic": "Quadratics", "d": 2, "orig": 9, "test": 7, "spr": true, "a": ["3"]}, {"q": "For which value of $x$ is $g(x)=\\dfrac{4}{x-2}$ undefined?", "h": "A fraction is undefined when its denominator is 0.", "s": "$x-2=0 \\Rightarrow x=2$.", "v": "A fraction is undefined when the denominator is zero. x minus two is zero when x is two. The answer is C.", "topic": "Exponential, radical & rational", "d": 1, "orig": 10, "test": 7, "o": ["$-2$", "$0$", "$2$", "$4$"], "a": 2}, {"q": "If $f(x)=x+3$ and $g(x)=2x^2$, what is $f(g(1))$?", "h": "Inside first: $g(1)$.", "s": "$g(1)=2$, then $f(2)=5$.", "v": "g of one is two times one squared, which is two. Then f of two is two plus three, which is five. The answer is A.", "topic": "Functions & transformations", "d": 2, "orig": 11, "test": 7, "o": ["$5$", "$8$", "$32$", "$11$"], "a": 0}, {"q": "Which transformation maps the graph of $y=x^2$ onto the graph of $y=(x+3)^2-2$?", "h": "$(x+h)$ inside the square moves the graph LEFT by $h$; a constant outside moves it up or down.", "s": "$(x+3)^2$ shifts 3 units left and $-2$ shifts 2 units down.", "v": "Adding three inside the square shifts the graph three units to the left. Subtracting two outside shifts it two units down. The answer is B.", "topic": "Functions & transformations", "d": 2, "orig": 12, "test": 7, "o": ["3 units right, 2 units down", "3 units left, 2 units down", "3 units left, 2 units up", "3 units right, 2 units up"], "a": 1}, {"q": "The function $f$ is defined by $f(x)=(x-a)(x-b)$, where $a$ and $b$ are integer constants. If $f(10)\\gt 0$, $f(14)\\lt 0$ and $f(18)\\gt 0$, what is one possible value of $a+b$?", "h": "The parabola opens up. It changes sign at each root. Where must the two roots be?", "s": "$f$ changes sign between 10 and 14, and again between 14 and 18. So one root is strictly between 10 and 14 and the other is strictly between 14 and 18: $a\\in\\{11,12,13\\}$, $b\\in\\{15,16,17\\}$. So $a+b$ can be any integer from 26 to 30.", "v": "The parabola opens upward and changes sign at each root. Since f of ten is positive and f of fourteen is negative, one root lies strictly between ten and fourteen, so it is eleven, twelve or thirteen. Since f of eighteen is positive again, the other root is fifteen, sixteen or seventeen. Their sum can be any whole number from twenty six to thirty. Any of those answers is correct.", "topic": "Quadratics", "d": 4, "orig": 13, "test": 7, "spr": true, "a": ["26", "27", "28", "29", "30"]}, {"q": "What is the sum of the solutions to $x^2+4x-12=0$?", "h": "Sum of roots $=-\\dfrac ba$. Or factor.", "s": "Sum $=-\\dfrac41=-4$ (the roots are 2 and $-6$).", "v": "The sum of the roots is negative b over a, which is negative four. You can check: the equation factors as x minus two times x plus six, with roots two and negative six, and their sum is negative four. The answer is D.", "topic": "Quadratics", "d": 2, "orig": 14, "test": 7, "o": ["$4$", "$-6$", "$12$", "$-4$"], "a": 3}, {"q": "What is the remainder when $p(x)=x^3-2x^2-5x+6$ is divided by $x-1$?", "h": "Remainder theorem: the remainder on division by $x-a$ is $p(a)$.", "s": "$p(1)=1-2-5+6=0$. The remainder is 0 (so $x-1$ is a factor).", "v": "By the remainder theorem, the remainder when dividing by x minus one is p of one. One minus two minus five plus six is zero. The answer is A.", "topic": "Polynomials & factoring", "d": 3, "orig": 15, "test": 7, "o": ["$0$", "$1$", "$-6$", "$6$"], "a": 0}, {"q": "A rectangle's length is 3 cm greater than its width, and its area is 54 cm². What is its width, in cm?", "h": "Let the width be $w$. Then $w(w+3)=54$.", "s": "$w^2+3w-54=0 \\Rightarrow (w+9)(w-6)=0 \\Rightarrow w=6$ (a width must be positive).", "v": "Let the width be w, so the length is w plus three. The area gives w times w plus three equals fifty four, or w squared plus three w minus fifty four equals zero. That factors as w plus nine times w minus six. A width must be positive, so w is six. The answer is C.", "topic": "Quadratics", "d": 2, "orig": 16, "test": 7, "o": ["$9$", "$3$", "$6$", "$18$"], "a": 2}, {"q": "Which expression is equivalent to $\\dfrac{7(x+2)}{(x+2)^2}$, where $x\\gt -2$?", "h": "Cancel one factor of $(x+2)$ from the top and the bottom.", "s": "$\\dfrac{7(x+2)}{(x+2)(x+2)}=\\dfrac{7}{x+2}$.", "v": "The denominator is x plus two times x plus two. One factor cancels with the numerator, leaving seven over x plus two. The answer is C.", "topic": "Exponential, radical & rational", "d": 2, "orig": 17, "test": 7, "o": ["$7$", "$\\dfrac{1}{x+2}$", "$\\dfrac{7}{x+2}$", "$\\dfrac{7x+14}{x^2+4}$"], "a": 2}, {"q": "What is the value of $8^{\\frac{2}{3}}+16^{\\frac{3}{4}}$?", "h": "$a^{\\frac{m}{n}}=\\left(\\sqrt[n]{a}\\right)^m$. Take the root first.", "s": "$8^{\\frac{2}{3}}=\\left(\\sqrt[3]8\\right)^2=2^2=4$ and $16^{\\frac{3}{4}}=\\left(\\sqrt[4]{16}\\right)^3=2^3=8$. Sum $=12$.", "v": "The cube root of eight is two, and two squared is four. The fourth root of sixteen is two, and two cubed is eight. Four plus eight is twelve. The answer is twelve.", "topic": "Exponential, radical & rational", "d": 3, "orig": 18, "test": 7, "spr": true, "a": ["12"]}, {"q": "The function $f$ is defined by $f(x)=4\\left(\\left(\\tfrac12\\right)^x+9\\right)$. For all values of $x$, the value of $f(x)$ is greater than $k$, where $k$ is a constant. What is the greatest possible value of $k$?", "h": "$\\left(\\tfrac12\\right)^x$ is always positive but can get as close to 0 as you like.", "s": "$f(x)=4\\left(\\tfrac12\\right)^x+36\\gt 36$, and $f(x)$ gets arbitrarily close to 36. So the greatest $k$ is 36.", "v": "One half to the x is always positive, but it can get very close to zero. So f of x is always more than four times nine, which is thirty six, and it gets as close to thirty six as we like. The greatest possible k is thirty six. The answer is B.", "topic": "Exponential, radical & rational", "d": 4, "orig": 19, "test": 7, "o": ["$0$", "$36$", "$9$", "$40$"], "a": 1}, {"q": "Which of the following are solutions to $x-c=(x-c)(x-25)$, where $c$ is a constant and $c\\gt 26$?<br>I. $c$ &nbsp;&nbsp; II. $25$ &nbsp;&nbsp; III. $26$", "h": "Don't divide by $(x-c)$ — move everything to one side and factor it out.", "s": "$(x-c)(x-25)-(x-c)=0 \\Rightarrow (x-c)(x-25-1)=0 \\Rightarrow (x-c)(x-26)=0$. So $x=c$ or $x=26$: I and III. ($x=25$ gives $25-c\\ne 0$.)", "v": "Move x minus c to the right side and factor it out: x minus c times x minus twenty five minus one equals zero, which is x minus c times x minus twenty six. So the solutions are c and twenty six. Twenty five does not work, because then the left side is twenty five minus c, which is not zero. The answer is B.", "topic": "Polynomials & factoring", "d": 5, "orig": 20, "test": 7, "o": ["I and II only", "I and III only", "II and III only", "I, II, and III"], "a": 1}, {"q": "For what value of $x$ does $f(x)=(x-3)(x+5)$ reach its minimum?", "h": "The vertex is halfway between the zeros.", "s": "Zeros 3 and $-5$; halfway is $x=\\dfrac{3+(-5)}{2}=-1$.", "v": "The zeros are three and negative five. A parabola's vertex lies halfway between its zeros, so x is three plus negative five over two, which is negative one. The answer is negative one.", "topic": "Quadratics", "d": 3, "orig": 21, "test": 7, "spr": true, "a": ["-1"]}, {"q": "$f(x)=a\\cdot b^x$ with $b\\gt 0$, $f(0)=6$ and $f(2)=54$. What is $f(3)$?", "h": "$f(0)=a$. Then $f(2)=a\\cdot b^2$.", "s": "$a=6$; $6b^2=54 \\Rightarrow b^2=9 \\Rightarrow b=3$. $f(3)=6\\cdot 27=162$.", "v": "f of zero is a, so a is six. Then six b squared is fifty four, so b squared is nine and b is three. f of three is six times three cubed, which is six times twenty seven, or one hundred sixty two. The answer is B.", "topic": "Exponential, radical & rational", "d": 4, "orig": 22, "test": 7, "o": ["$108$", "$162$", "$216$", "$486$"], "a": 1}, {"q": "What are the solutions to $(x-4)(x+4)=0$?", "h": "Set each factor equal to 0.", "s": "$x-4=0$ or $x+4=0$, so $x=4$ or $x=-4$.", "v": "The product is zero when either factor is zero. x minus four is zero when x is four, and x plus four is zero when x is negative four. The answer is B.", "topic": "Quadratics", "d": 1, "orig": 1, "test": 8, "o": ["$4$ only", "$-4$ and $4$", "$0$ and $4$", "$16$ only"], "a": 1}, {"q": "If $f(x)=x^3-2x$, what is $f(2)$?", "h": "$2^3=8$.", "s": "$f(2)=2^3-2(2)=8-4=4$.", "v": "Two cubed is eight, and two times two is four. Eight minus four is four. The answer is A.", "topic": "Functions & transformations", "d": 1, "orig": 2, "test": 8, "o": ["$4$", "$2$", "$6$", "$8$"], "a": 0}, {"q": "For $x\\ne 0$, which expression is equivalent to $\\dfrac{x^4}{x^{-2}}$?", "h": "When dividing powers with the same base, subtract the exponents.", "s": "$\\dfrac{x^4}{x^{-2}}=x^{4-(-2)}=x^6$.", "v": "Dividing powers with the same base means subtracting exponents. Four minus negative two is six, so the result is x to the sixth. The answer is C.", "topic": "Exponential, radical & rational", "d": 1, "orig": 3, "test": 8, "o": ["$x^2$", "$x^{-8}$", "$x^6$", "$x^8$"], "a": 2}, {"q": "The amount in an account $t$ years from now is $f(t)=1{,}000(1.03)^t$ dollars. What was the initial amount, in dollars?", "h": "The initial amount is the value at $t=0$.", "s": "$f(0)=1{,}000(1.03)^0=1{,}000(1)=\\$1{,}000$.", "v": "The initial amount is f of zero. Anything to the zero power is one, so f of zero is one thousand dollars. The answer is A.", "topic": "Exponential, radical & rational", "d": 1, "orig": 4, "test": 8, "o": ["$1{,}000$", "$1.03$", "$3$", "$1{,}030$"], "a": 0}, {"q": "What is the positive solution to $3x^2-27=0$?", "h": "Isolate $x^2$ first.", "s": "$3x^2=27 \\Rightarrow x^2=9 \\Rightarrow x=3$ (positive).", "v": "Add twenty seven and divide by three: x squared equals nine. The positive solution is three. The answer is three.", "topic": "Quadratics", "d": 1, "orig": 5, "test": 8, "spr": true, "a": ["3"]}, {"q": "Which expression is equivalent to $9x^2-4$?", "h": "$9x^2=(3x)^2$ and $4=2^2$: a difference of squares.", "s": "$9x^2-4=(3x)^2-2^2=(3x-2)(3x+2)$.", "v": "Nine x squared is three x squared, and four is two squared. A difference of squares factors as three x minus two times three x plus two. The answer is B.", "topic": "Polynomials & factoring", "d": 2, "orig": 6, "test": 8, "o": ["$(3x-2)^2$", "$(3x-2)(3x+2)$", "$(9x-2)(x+2)$", "$(3x-4)(3x+1)$"], "a": 1}, {"q": "The graph of $f(x)=x^2-1$ is shifted up 4 units to give $g$. Which equation defines $g$?", "h": "Shifting up means adding to the whole output: $g(x)=f(x)+4$.", "s": "$g(x)=f(x)+4=x^2-1+4=x^2+3$.", "v": "Shifting a graph up four units adds four to the output. So g of x is x squared minus one plus four, which is x squared plus three. The answer is A.", "topic": "Functions & transformations", "d": 1, "orig": 7, "test": 8, "o": ["$g(x)=x^2+3$", "$g(x)=(x+4)^2-1$", "$g(x)=(x-4)^2-1$", "$g(x)=x^2-5$"], "a": 0}, {"q": "If $\\sqrt{x-3}=4$, what is the value of $x$?", "h": "Square both sides.", "s": "$x-3=16 \\Rightarrow x=19$. Check: $\\sqrt{16}=4$ ✓.", "v": "Square both sides: x minus three equals sixteen. So x is nineteen. Check: the square root of sixteen is four. The answer is D.", "topic": "Exponential, radical & rational", "d": 2, "orig": 8, "test": 8, "o": ["$7$", "$13$", "$16$", "$19$"], "a": 3}, {"q": "What is the maximum value of $f(x)=-x^2+6x-5$?", "h": "The maximum is at the vertex, $x=-\\dfrac{b}{2a}$.", "s": "$x=-\\dfrac{6}{2(-1)}=3$. $f(3)=-9+18-5=4$.", "v": "The parabola opens down, so the maximum is at the vertex. x equals negative six over negative two, which is three. Then f of three is negative nine plus eighteen minus five, which is four. The answer is four.", "topic": "Quadratics", "d": 3, "orig": 9, "test": 8, "spr": true, "a": ["4"]}, {"q": "If $x^2+y^2=40$ and $xy=12$, what is the value of $(x+y)^2$?", "h": "$(x+y)^2=x^2+2xy+y^2$.", "s": "$(x+y)^2=x^2+y^2+2xy=40+2(12)=64$.", "v": "x plus y squared equals x squared plus y squared plus two x y. That is forty plus two times twelve, which is sixty four. The answer is B.", "topic": "Polynomials & factoring", "d": 2, "orig": 10, "test": 8, "o": ["$52$", "$64$", "$28$", "$144$"], "a": 1}, {"q": "The function $f$ is defined by $f(x)=6x-10$. If $f(a)+4=3a$, what is the value of $a$?", "h": "Replace $f(a)$ with $6a-10$.", "s": "$6a-10+4=3a \\Rightarrow 3a=6 \\Rightarrow a=2$.", "v": "f of a is six a minus ten. So six a minus ten plus four equals three a, which simplifies to six a minus six equals three a. Then three a is six, and a is two. The answer is B.", "topic": "Functions & transformations", "d": 2, "orig": 11, "test": 8, "o": ["$-2$", "$2$", "$6$", "$\\dfrac{10}{3}$"], "a": 1}, {"q": "A biologist studies an algae population in a laboratory tank. A model predicts that a population with an initial count of 20 cells will increase by 120% every 9 days. Which equation represents this model, where $y$ is the predicted number of cells $x$ days after the initial count?", "h": "\"Increase by 120%\" means multiply by $1+1.20$. The number of 9-day periods in $x$ days is $\\tfrac x9$.", "s": "Growth factor $=1+1.20=2.20$ every 9 days; after $x$ days there are $\\dfrac x9$ periods: $y=20(2.20)^{\\frac{x}{9}}$.", "v": "Increasing by one hundred twenty percent means multiplying by one plus one point two, which is two point two. This happens every nine days, so in x days it happens x over nine times. The model is y equals twenty times two point two to the x over nine. The answer is C.", "topic": "Exponential, radical & rational", "d": 3, "orig": 12, "test": 8, "o": ["$y=20(1.20)^{\\frac{x}{9}}$", "$y=20(1.20)^{9x}$", "$y=20(2.20)^{\\frac{x}{9}}$", "$y=20(2.20)^{9x}$"], "a": 2}, {"q": "If $\\dfrac{x+1}{x-2}=4$, what is the value of $x$?", "h": "Multiply both sides by $(x-2)$.", "s": "$x+1=4(x-2)=4x-8 \\Rightarrow 9=3x \\Rightarrow x=3$.", "v": "Multiply both sides by x minus two: x plus one equals four x minus eight. Then nine equals three x, so x is three. The answer is three.", "topic": "Exponential, radical & rational", "d": 2, "orig": 13, "test": 8, "spr": true, "a": ["3"]}, {"q": "The equation $x^2+bx+9=0$ has no real solutions. Which of the following could be the value of $b$?", "h": "No real solutions means the discriminant $b^2-4ac$ is negative.", "s": "$b^2-36\\lt 0 \\Rightarrow -6\\lt b\\lt 6$. Only 5 works ($\\pm 6$ give exactly one solution).", "v": "No real solutions means the discriminant is negative: b squared minus thirty six is less than zero. So b must be strictly between negative six and six. Only five fits. The answer is C.", "topic": "Quadratics", "d": 3, "orig": 14, "test": 8, "o": ["$-7$", "$-6$", "$5$", "$6$"], "a": 2}, {"q": "Which quadratic function has zeros $-2$ and $3$ and a $y$-intercept of 12?", "h": "Write $f(x)=a(x+2)(x-3)$ and use $f(0)=12$ to find $a$.", "s": "$f(0)=a(2)(-3)=-6a=12 \\Rightarrow a=-2$: $f(x)=-2(x+2)(x-3)$.", "v": "Zeros negative two and three give f of x equals a times x plus two times x minus three. At x equals zero this is a times two times negative three, which is negative six a. That must equal twelve, so a is negative two. The answer is B.", "topic": "Quadratics", "d": 3, "orig": 15, "test": 8, "o": ["$f(x)=2(x+2)(x-3)$", "$f(x)=-2(x+2)(x-3)$", "$f(x)=-2(x-2)(x+3)$", "$f(x)=(x+2)(x-3)+12$"], "a": 1}, {"q": "Which is the vertex form of $y=2x^2-8x+3$?", "h": "The vertex is at $x=-\\dfrac{b}{2a}$; then find $y$ there. Keep $a=2$.", "s": "$x=\\dfrac{8}{4}=2$; $y(2)=8-16+3=-5$. So $y=2(x-2)^2-5$.", "v": "The vertex x coordinate is eight over four, which is two. Plugging in, y is eight minus sixteen plus three, which is negative five. Keeping the leading coefficient two, the vertex form is y equals two times x minus two squared, minus five. The answer is A.", "topic": "Quadratics", "d": 3, "orig": 16, "test": 8, "o": ["$y=2(x-2)^2-5$", "$y=2(x-2)^2+3$", "$y=2(x+2)^2-5$", "$y=(x-2)^2-5$"], "a": 0}, {"q": "Which ordered pair is a solution to the system $x^2+y^2=13$ and $y=x+1$?", "h": "Each option satisfies $x^2+y^2=13$. Which also satisfies $y=x+1$?", "s": "$x^2+(x+1)^2=13 \\Rightarrow x^2+x-6=0 \\Rightarrow x=2$ or $x=-3$. Solutions $(2,3)$ and $(-3,-2)$. Only $(-3,\\ -2)$ is listed.", "v": "Substitute y equals x plus one into the circle: x squared plus x plus one squared equals thirteen. That simplifies to x squared plus x minus six equals zero, so x is two or negative three. The points are two, three and negative three, negative two. Only negative three, negative two is a choice. The answer is B.", "topic": "Nonlinear systems", "d": 3, "orig": 17, "test": 8, "o": ["$(3,\\ 2)$", "$(-3,\\ -2)$", "$(2,\\ -3)$", "$(-2,\\ 3)$"], "a": 1}, {"q": "If $4^x=2^{x+6}$, what is the value of $x$?", "h": "Write $4^x$ as a power of 2.", "s": "$4^x=2^{2x}$, so $2x=x+6 \\Rightarrow x=6$.", "v": "Four to the x is two to the two x. Setting the exponents equal: two x equals x plus six, so x is six. The answer is six.", "topic": "Exponential, radical & rational", "d": 3, "orig": 18, "test": 8, "spr": true, "a": ["6"]}, {"q": "At which value of $x$ does the graph of $f(x)=(x-1)^3(x+2)^2$ touch the $x$-axis without crossing it?", "h": "A zero with an even power touches; a zero with an odd power crosses.", "s": "$(x+2)^2$ has an even power, so the graph touches at $x=-2$. At $x=1$ (odd power 3) it crosses.", "v": "The factor x plus two is squared, an even power, so the graph touches the x axis at x equals negative two and turns back. The factor x minus one is cubed, an odd power, so the graph crosses there. The answer is A.", "topic": "Polynomials & factoring", "d": 3, "orig": 19, "test": 8, "o": ["$-2$", "$1$", "$2$", "$-1$"], "a": 0}, {"q": "For all $x$, $x^2-8x+c=(x-a)^2-5$. What is the value of $c$?", "h": "Expand $(x-a)^2-5$ and match the $x$ terms first.", "s": "$(x-a)^2-5=x^2-2ax+a^2-5$. Then $-2a=-8 \\Rightarrow a=4$, and $c=a^2-5=16-5=11$.", "v": "Expanding the right side gives x squared minus two a x plus a squared minus five. Matching x terms, negative two a equals negative eight, so a is four. Then c equals a squared minus five, which is sixteen minus five, or eleven. The answer is A.", "topic": "Quadratics", "d": 4, "orig": 20, "test": 8, "o": ["$11$", "$16$", "$21$", "$-5$"], "a": 0}, {"q": "A parabola in the $xy$-plane has vertex $(3,\\ 40)$. The equation $y=-ax^2+bx+c$ represents this parabola, where $a$, $b$ and $c$ are positive integer constants. What is the greatest possible value of $b$?", "h": "Write $y=-a(x-3)^2+40$ and expand. Express $b$ and $c$ in terms of $a$, then use $c\\gt 0$.", "s": "$y=-a(x-3)^2+40=-ax^2+6ax+(40-9a)$. So $b=6a$ and $c=40-9a$.<br>$c\\gt 0 \\Rightarrow a\\lt \\tfrac{40}{9}\\approx 4.4 \\Rightarrow a\\le 4$. Greatest $b=6\\cdot 4=24$.", "v": "In vertex form the parabola is y equals negative a times x minus three squared, plus forty. Expanding gives negative a x squared plus six a x plus forty minus nine a. So b is six a and c is forty minus nine a. Since c must be positive, nine a is less than forty, so a is at most four. The greatest b is six times four, which is twenty four. The answer is twenty four.", "topic": "Quadratics", "d": 5, "orig": 21, "test": 8, "spr": true, "a": ["24"]}, {"q": "The line $y=3x+c$ intersects the parabola $y=x^2+x+4$ at exactly one point. What is the value of $c$?", "h": "Set them equal and make the discriminant 0.", "s": "$x^2+x+4=3x+c \\Rightarrow x^2-2x+(4-c)=0$. Discriminant: $4-4(4-c)=0 \\Rightarrow 4-c=1 \\Rightarrow c=3$.", "v": "Set x squared plus x plus four equal to three x plus c. That gives x squared minus two x plus four minus c equals zero. Exactly one intersection means the discriminant is zero: four minus four times four minus c equals zero. So four minus c is one, and c is three. The answer is B.", "topic": "Nonlinear systems", "d": 4, "orig": 22, "test": 8, "o": ["$1$", "$3$", "$4$", "$5$"], "a": 1}, {"q": "What is 20% of 150?", "h": "20% $=0.20$. Multiply.", "s": "$0.20\\times 150=30$.", "v": "Twenty percent is zero point two. Zero point two times one hundred fifty is thirty. The answer is C.", "topic": "Percentages", "d": 1, "orig": 1, "test": 9, "o": ["$15$", "$20$", "$30$", "$45$"], "a": 2}, {"q": "The ratio of the side length of square M to the side length of square N is 2 to 10. Square M has a side length of 9 inches. What is the side length, in inches, of square N?", "h": "N's side is $\\tfrac{10}{2}=5$ times M's side.", "s": "$\\dfrac{2}{10}=\\dfrac{9}{N} \\Rightarrow 2N=90 \\Rightarrow N=45$ inches.", "v": "The ratio two to ten means N is five times as long as M. Five times nine inches is forty five inches. The answer is A.", "topic": "Ratios, rates & units", "d": 1, "orig": 2, "test": 9, "o": ["$45$", "$1.8$", "$18$", "$90$"], "a": 0}, {"q": "If 1 mile is about 1.6 km, about how many kilometers are in 5 miles?", "h": "Each mile is 1.6 km. Multiply.", "s": "$5\\times 1.6=8$ km.", "v": "Each mile is about one point six kilometers, so five miles is five times one point six, which is eight kilometers. The answer is B.", "topic": "Ratios, rates & units", "d": 1, "orig": 3, "test": 9, "o": ["$3.1$", "$8$", "$6.6$", "$80$"], "a": 1}, {"q": "What is the mean of 4, 8, 10 and 14?", "h": "Mean = sum ÷ number of values.", "s": "$\\dfrac{4+8+10+14}{4}=\\dfrac{36}{4}=9$.", "v": "Add the values: four plus eight plus ten plus fourteen is thirty six. Divide by four values to get nine. The answer is A.", "topic": "Statistics", "d": 1, "orig": 4, "test": 9, "o": ["$9$", "$8$", "$10$", "$12$"], "a": 0}, {"q": "The price of a <span class=\"usd\">$<\/span>40 shirt is increased by 35%. What is the new price, in dollars?", "h": "An increase of 35% means multiplying by 1.35.", "s": "$40\\times 1.35=\\$54$.", "v": "Increasing by thirty five percent means multiplying by one point three five. Forty times one point three five is fifty four dollars. The answer is fifty four.", "topic": "Percentages", "d": 1, "orig": 5, "test": 9, "spr": true, "a": ["54"]}, {"q": "What is the median of the data set 7, 3, 9, 1, 5, 11?", "h": "Sort the data first. With an even number of values, average the two middle ones.", "s": "Sorted: 1, 3, <b>5, 7<\/b>, 9, 11. Median $=\\dfrac{5+7}{2}=6$.", "v": "First put the values in order: one, three, five, seven, nine, eleven. There are six values, so the median is the average of the middle two, five and seven, which is six. The answer is B.", "topic": "Statistics", "d": 1, "orig": 6, "test": 9, "o": ["$5$", "$6$", "$7$", "$36$"], "a": 1}, {"q": "The table summarizes the members of a public library by age group and by the branch they use.<table class=\"dt\"><tr><th><\/th><th>North branch<\/th><th>South branch<\/th><th>Total<\/th><\/tr><tr><th>Under 18<\/th><td>14<\/td><td>26<\/td><td>40<\/td><\/tr><tr><th>18 or older<\/th><td>51<\/td><td>39<\/td><td>90<\/td><\/tr><tr><th>Total<\/th><td>65<\/td><td>65<\/td><td>130<\/td><\/tr><\/table>If a member is selected at random, what is the probability that the member is 18 or older?", "h": "Use the row total for \"18 or older\" over the grand total.", "s": "90 of the 130 members are 18 or older: $\\dfrac{90}{130}$.", "v": "There are ninety members who are eighteen or older, out of one hundred thirty in total. The probability is ninety over one hundred thirty. The answer is D.", "topic": "Probability", "d": 1, "orig": 7, "test": 9, "o": ["$\\dfrac{51}{130}$", "$\\dfrac{39}{130}$", "$\\dfrac{40}{130}$", "$\\dfrac{90}{130}$"], "a": 3}, {"q": "A car travels 180 km in 2.5 hours. What is its average speed, in km/h?", "h": "Speed = distance ÷ time.", "s": "$180\\div 2.5=72$ km/h.", "v": "Average speed is distance divided by time. One hundred eighty divided by two point five is seventy two kilometers per hour. The answer is C.", "topic": "Ratios, rates & units", "d": 1, "orig": 8, "test": 9, "o": ["$45$", "$60$", "$72$", "$90$"], "a": 2}, {"q": "The price of an item dropped from <span class=\"usd\">$<\/span>50 to <span class=\"usd\">$<\/span>42. By what percent did the price decrease?", "h": "Percent change = change ÷ ORIGINAL value × 100.", "s": "$\\dfrac{50-42}{50}=\\dfrac{8}{50}=0.16=16\\%$. Enter 16.", "v": "The price dropped by eight dollars. Divide by the original price, fifty: eight over fifty is zero point one six, or sixteen percent. The answer is sixteen.", "topic": "Percentages", "d": 2, "orig": 9, "test": 9, "spr": true, "a": ["16"]}, {"q": "At a café, the line of best fit for daily hot-chocolate sales ($y$) versus temperature ($x$, °C) is $\\hat y=-1.5x+60$. What does $-1.5$ represent?", "h": "$-1.5$ is the slope: change in predicted $y$ per 1 unit of $x$. Note the sign.", "s": "The slope $-1.5$ means: for each 1 °C warmer, predicted sales drop by 1.5 cups.", "v": "Negative one point five is the slope of the line. It tells us that for every one degree increase in temperature, the predicted sales go down by one and a half cups. The answer is A.", "topic": "Data & scatterplots", "d": 2, "orig": 10, "test": 9, "o": ["For each 1 °C increase in temperature, predicted sales decrease by 1.5 cups.", "At 1.5 °C, sales are 60 cups.", "For each 1 °C increase in temperature, predicted sales increase by 1.5 cups.", "Each sale lowers the temperature by 1.5 °C."], "a": 0}, {"q": "120 people were asked which pet they prefer.<table class=\"dt\"><tr><th><\/th><th>Cat<\/th><th>Dog<\/th><th>Total<\/th><\/tr><tr><th>Adult<\/th><td>24<\/td><td>36<\/td><td>60<\/td><\/tr><tr><th>Teen<\/th><td>30<\/td><td>30<\/td><td>60<\/td><\/tr><tr><th>Total<\/th><td>54<\/td><td>66<\/td><td>120<\/td><\/tr><\/table>A person who prefers dogs is selected at random. What is the probability the person is an adult?", "h": "The person is chosen from the dog lovers only, so the denominator is the Dog total.", "s": "Of 66 dog lovers, 36 are adults: $\\dfrac{36}{66}=\\dfrac{6}{11}$.", "v": "We only look at people who prefer dogs, which is sixty six people. Of them, thirty six are adults. Thirty six over sixty six simplifies to six elevenths. The answer is B.", "topic": "Probability", "d": 2, "orig": 11, "test": 9, "o": ["$\\dfrac{36}{120}$", "$\\dfrac{6}{11}$", "$\\dfrac35$", "$\\dfrac12$"], "a": 1}, {"q": "120 people were asked which pet they prefer.<table class=\"dt\"><tr><th><\/th><th>Cat<\/th><th>Dog<\/th><th>Total<\/th><\/tr><tr><th>Adult<\/th><td>24<\/td><td>36<\/td><td>60<\/td><\/tr><tr><th>Teen<\/th><td>30<\/td><td>30<\/td><td>60<\/td><\/tr><tr><th>Total<\/th><td>54<\/td><td>66<\/td><td>120<\/td><\/tr><\/table>A teen is selected at random. What is the probability the teen prefers cats?", "h": "Now the denominator is the Teen total.", "s": "Of 60 teens, 30 prefer cats: $\\dfrac{30}{60}=\\dfrac12$. ($\\tfrac{30}{54}$ would be \"a cat lover is a teen\".)", "v": "We pick
