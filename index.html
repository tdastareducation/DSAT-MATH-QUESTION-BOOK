<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var _t=localStorage.getItem("dsat-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=_t}catch(e){document.documentElement.dataset.theme="light"}</script>
<title>D-SAT Math Question Bank</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9e3d6; --paper:#fffdf7; --ink:#1f2433; --muted:#6b6f7c; --line:#e3dccb;
  --accent:#2f5fd0; --accent2:#f2a23a; --ok:#1f9d5b; --okbg:#e3f6ec; --bad:#d23c3c; --badbg:#fbe7e7;
  --cover1:#1d3a8a; --cover2:#2f5fd0; --shadow:0 18px 40px rgba(40,30,10,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171d; --paper:#1f222b; --ink:#eceef4; --muted:#9aa0ad; --line:#2f3340;
    --okbg:#173627; --badbg:#3a1d1d; --shadow:0 18px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:760px;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:10px}
header .brand{font-family:Fraunces,serif;font-weight:800;font-size:18px}
.score{font-weight:800;font-size:14px;background:var(--paper);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.stage{width:100%;max-width:760px;padding:8px 16px;perspective:1800px;flex:1}
.page{background:var(--paper);border-radius:6px 16px 16px 6px;box-shadow:var(--shadow);min-height:560px;padding:28px 26px 24px 34px;position:relative;transform-origin:left center;overflow:hidden}
.page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;background:linear-gradient(90deg,rgba(0,0,0,.12),transparent)}
.flip-next{animation:flipN .45s ease}
.flip-prev{animation:flipP .45s ease}
@keyframes flipN{from{transform:rotateY(-70deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes flipP{from{transform:rotateY(40deg);opacity:.2}to{transform:none;opacity:1}}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.qnum{background:var(--accent);color:#fff;font-weight:800;border-radius:10px;min-width:44px;height:44px;display:grid;place-items:center;font-size:20px}
.qbar{flex:1;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--line),transparent)}
.qtext{font-size:19px;line-height:1.6;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-size:17px;text-align:left;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.opt .l{width:32px;height:32px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:none;border-radius:999px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.speak{background:var(--accent2);color:#2a1a00}
.btn.speaking{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.sol{margin-top:18px;border-left:4px solid var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,transparent);padding:14px 16px;border-radius:0 12px 12px 0;line-height:1.7;display:none}
.sol.show{display:block;animation:fade .3s}
.sol h4{margin:0 0 6px;font-family:Fraunces,serif}
.hint{display:none;margin-top:12px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;line-height:1.6}
.hint.show{display:block;animation:fade .3s}
.hintbtn{border-color:var(--accent)!important;color:var(--accent)!important}
.qhead{flex-wrap:nowrap;align-items:flex-start}
.qmeta{flex:1;display:flex;flex-direction:column;gap:6px;padding-top:4px;min-width:0}
.testlbl{font-weight:800;font-size:12px;letter-spacing:.15em;color:var(--accent)}
.topic{text-align:right;flex:none;max-width:48%}
.tname{display:inline-block;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px;line-height:1.2}
.stars{color:var(--accent2);font-size:17px;letter-spacing:2px;margin-top:4px}
.stars .off{color:var(--line)}
.ktitle{font-weight:800;margin-top:14px}
.back .key{margin:8px 0}
.rtag{font-weight:800;font-size:12px;letter-spacing:.18em;color:var(--accent);margin-bottom:14px}
.rhead{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.rhead h2{font-family:Fraunces,serif;margin:2px 0 4px;font-size:28px}
.rhead p{margin:0;color:var(--muted)}
.rico{font-size:30px}
.ring{--p:0;width:130px;height:130px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:100px;height:100px;border-radius:50%;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:Fraunces,serif;font-size:28px}
.ring span{font-size:13px;color:var(--muted);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.chips .c{padding:7px 12px;border-radius:999px;font-weight:800;font-size:14px}
.c.ok{background:var(--okbg);color:var(--ok)} .c.bad{background:var(--badbg);color:var(--bad)} .c.blank{background:var(--line);color:var(--muted)}
.rnote{font-size:14px;color:var(--muted);margin:8px 0}
.rlist{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rlh,.rrow{display:grid;grid-template-columns:40px 1fr 92px 34px;align-items:center;gap:8px;padding:9px 12px}
.rlh{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--line) 50%,transparent)}
.rrow{width:100%;border:none;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.rrow:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.rn{font-weight:800}
.rt{font-weight:700;font-size:15px;min-width:0}
.rt small{display:block;color:var(--accent2);font-size:12px;letter-spacing:1px}
.ra{font-weight:800;font-size:14px;color:var(--muted)}
.rs{font-weight:800;font-size:18px;text-align:center}
.rrow.ok .rs{color:var(--ok)} .rrow.bad .rs{color:var(--bad)} .rrow.void .rs{color:var(--accent2)} .rrow.blank .rs{color:var(--muted)}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.tcard{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:16px;color:#fff;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.tcard:hover{background:rgba(255,255,255,.2)}
.tl{font-size:12px;letter-spacing:.18em;font-weight:800;opacity:.85}
.ts{font-family:Fraunces,serif;font-size:38px;font-weight:800}
.tp{font-weight:700}
.tv{font-size:13px;opacity:.85;margin-top:6px}
@media (max-width:520px){.tcards{grid-template-columns:1fr}.ring{width:110px;height:110px}.ring>div{width:84px;height:84px}.rlh,.rrow{grid-template-columns:30px 1fr 78px 26px;padding:9px 10px}}
.who{font-family:Nunito,sans-serif;font-weight:700;font-size:14px;color:var(--muted)}
.student{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:4px 0 6px;max-width:460px}
.student label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.95}
.student input{font:inherit;font-size:16px;font-weight:700;padding:11px 13px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;min-height:46px}
.student input::placeholder{color:rgba(255,255,255,.6);font-weight:600}
.student input:focus{outline:none;border-color:var(--accent2);background:rgba(255,255,255,.22)}
.ana h2{font-family:Fraunces,serif;margin:0;font-size:28px}
.ana h3{font-family:Fraunces,serif;font-size:18px;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.anahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.info div{border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.info span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.info b{font-size:15px}
.ov{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ovt{flex:1;min-width:220px}
.ovv{font-family:Fraunces,serif;font-size:22px;font-weight:800}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.ana table{width:100%;border-collapse:collapse;font-size:14px}
.ana th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:color-mix(in srgb,var(--line) 50%,transparent);padding:8px 10px;white-space:nowrap}
.ana td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
.ana td small{display:block;color:var(--muted);font-size:11px}
.ana tr{break-inside:avoid}
td.g{color:var(--ok);font-weight:800} td.r{color:var(--bad);font-weight:800}
.abar{height:6px;border-radius:4px;background:var(--line);margin-top:4px;min-width:70px;overflow:hidden}
.abar i{display:block;height:100%;background:var(--accent)}
.abar.strong i{background:var(--ok)} .abar.mid i{background:var(--accent2)} .abar.weak i{background:var(--bad)}
.st{color:var(--accent2);letter-spacing:1px;white-space:nowrap} .st.off{color:var(--line)}
.tag2,.res{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.tag2.strong,.res.ok{background:var(--okbg);color:var(--ok)}
.tag2.mid,.res.void{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:#a2620a}
.tag2.weak,.res.bad{background:var(--badbg);color:var(--bad)}
.tag2.na,.res.blank{background:var(--line);color:var(--muted)}
.recs ul{margin:6px 0;padding-left:20px;line-height:1.7}
.sign{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:30px;font-size:13px;font-weight:800;color:var(--muted)}
.sign span{display:block;border-bottom:1px solid var(--muted);height:28px}
.foot{font-size:12px;color:var(--muted);margin-top:18px}
@media (max-width:520px){.info{grid-template-columns:1fr 1fr}.student{grid-template-columns:1fr}.qt{font-size:12px}}
@media print{
  :root{--paper:#fff;--ink:#111;--muted:#555;--line:#ddd;--okbg:#e3f6ec;--badbg:#fbe7e7}
  @page{size:A4;margin:12mm}
  body{background:#fff!important;display:block}
  header,.pager,.noprint{display:none!important}
  .stage{padding:0!important;max-width:none;perspective:none}
  .page{box-shadow:none!important;border-radius:0!important;padding:0!important;animation:none!important;transform:none!important;min-height:0}
  .page::before{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tw{overflow:visible}
  .ana h3{break-after:avoid}
}
.note{margin-top:10px;font-size:14px;color:var(--muted)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.fig{display:flex;justify-content:center;margin:6px 0 14px}
.fig svg{max-width:100%;height:auto}
.fig text{fill:var(--ink);font-weight:800;font-family:Nunito}
.fig .s{stroke:var(--ink);fill:none;stroke-width:2.5}
.feedback{margin-top:12px;font-weight:800}
/* covers */
.cover{background:linear-gradient(150deg,var(--cover1),var(--cover2));color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:40px 34px 34px 44px}
.cover::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08)}
.cover .tag{letter-spacing:.2em;text-transform:uppercase;font-size:13px;opacity:.85}
.cover h1{font-family:Fraunces,serif;font-size:clamp(34px,8vw,56px);line-height:1;margin:14px 0}
.cover .sub{font-size:18px;opacity:.9;max-width:420px}
.cover .symbols{font-family:Fraunces,serif;font-size:42px;opacity:.25;letter-spacing:.3em;margin:20px 0}
.cover .btn{background:var(--accent2);color:#2a1a00;align-self:flex-start;font-size:18px;padding:14px 24px}
.feat{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.feat span{background:rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.back{background:linear-gradient(150deg,var(--cover2),var(--cover1));color:#fff;padding:34px 30px 30px 44px}
.back h2{font-family:Fraunces,serif;font-size:34px;margin:0 0 6px}
.big{font-size:56px;font-family:Fraunces,serif;font-weight:800}
.key{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}
.key div{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 4px;text-align:center;font-weight:800;cursor:pointer;font-size:14px}
.key div.k-ok{background:rgba(70,220,140,.35)}
.key div.k-bad{background:rgba(255,90,90,.4)}
.back .btn{background:#fff;color:var(--cover1)}
.stage{padding-bottom:22px}
.page{min-height:0}
.page.cover,.page.back{min-height:520px}
.page.has-pager{border-bottom-left-radius:0;border-bottom-right-radius:0;padding-bottom:40px}
.pager{position:sticky;bottom:10px;z-index:5;display:flex;align-items:center;gap:12px;margin-top:-1px;padding:12px;
  background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:0 0 18px 18px;box-shadow:var(--shadow)}
.navbtn{min-height:52px;min-width:52px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);
  font:inherit;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;cursor:pointer;
  transition:transform .15s,background .15s,border-color .15s}
.navbtn .arr{font-size:30px;line-height:0;margin-top:-3px}
.navbtn.next{background:var(--accent);border-color:var(--accent);color:#fff}
.navbtn:hover:not(:disabled){transform:translateY(-2px)}
.navbtn.prev:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.navbtn:active:not(:disabled){transform:scale(.96)}
.navbtn:disabled{opacity:.35;cursor:not-allowed}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.mid select{width:100%;min-height:44px;font:inherit;font-weight:700;font-size:15px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-overflow:ellipsis}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .35s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,select:focus-visible,.key div:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
@media (max-width:520px){
  .pager{gap:8px;padding:10px;bottom:6px}
  .navbtn .lbl{display:none}
  .navbtn{padding:0;width:56px;min-height:56px}
  .mid select{font-size:14px}
}
.pageno{position:absolute;bottom:10px;right:18px;font-size:13px;color:var(--muted)}
@media (max-width:520px){.page{padding:22px 16px 20px 26px;min-height:520px}.qtext{font-size:17px}.opt{font-size:16px}}
/* ---------- drawing tools (whiteboard) ---------- */
.wb{position:fixed;left:0;top:50%;transform:translate(-100%,-50%);z-index:45;display:flex;align-items:center;transition:transform .28s ease}
.wb.open{transform:translate(0,-50%)}
.wb{user-select:none;-webkit-user-select:none}
.wb:not(.open) .wbbar{box-shadow:none;visibility:hidden;transition:visibility 0s .28s}
.wbbar{display:flex;flex-direction:column;gap:4px;padding:8px 6px;background:#fff;border-radius:0 14px 14px 0;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.wbbar button,.wbfly button{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:#374151;display:flex;align-items:center;justify-content:center;padding:0}
.wbbar button:hover,.wbfly button:hover{background:#eef2f6}
.wbbar button.on{background:#e0ecff;color:#1a56db}
.wbbar svg,.wbfly svg,.wbtab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wbbar .wbt[data-t=pen],.wbbar .wbt[data-t=hl]{color:var(--wbc,#374151)}
.wbsep{height:1px;background:#e5e7eb;margin:2px 4px}
.wbclr{color:#dc2626!important}
.wbtab{position:absolute;left:100%;top:50%;transform:translateY(-50%);width:22px;height:54px;border:0;border-radius:0 10px 10px 0;background:#fff;box-shadow:3px 2px 10px rgba(0,0,0,.16);color:#374151;padding:0;display:flex;align-items:center;justify-content:center}
.wb.open .wbtab svg{transform:rotate(180deg)}
.wbfly{position:absolute;left:calc(100% + 30px);top:50%;transform:translateY(-50%);background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:8px}
.wbfly[hidden]{display:none}
.wbshapes,.wbsizes{display:grid;grid-template-columns:repeat(4,36px);gap:4px}
.wbshapes,.wbmodes{display:none}.wbfly.sh .wbshapes{display:grid}
.wbcols{display:grid;grid-template-columns:repeat(10,24px);gap:3px}
.wbfly .wbcols button{width:24px;height:24px;border-radius:7px}
.wbfly.er .wbcols,.wbfly.er .wbmore{display:none}
.wbfly.er .wbmodes{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.wbfly .wbmodes button{width:auto;height:auto;padding:6px 8px;gap:6px;font-weight:800;font-size:13px}
.wbmodes button.on{background:#e0ecff;color:#1a56db}
.wbmore{display:flex;align-items:center;gap:8px}
.wbpick{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:#374151;cursor:pointer;padding:2px 6px;border-radius:8px}
.wbpick:hover{background:#eef2f6}
.wbpick input{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer}
.wbfly .wbw{width:26px;height:26px}
.wbcols button::after,.wbw::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--cc);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.wbcols button.on,.wbsizes button.on,.wbshapes button.on,.wbw.on{background:#e0ecff;box-shadow:0 0 0 2px #1a56db}
.wbsizes i{display:block;border-radius:50%;background:#374151}
.ink{position:absolute;left:0;top:0;z-index:6;pointer-events:none;touch-action:auto}
body.drawing #page .ink,body.drawing .solsheet .ink{pointer-events:auto;touch-action:none}
body.drawing.t-pen #page .ink,body.drawing.t-hl #page .ink,body.drawing.t-shape #page .ink{cursor:crosshair}
body.drawing.t-eraser #page .ink{cursor:cell}
body.drawing.t-laser #page .ink{cursor:none}
@media(max-width:600px){.wbbar button,.wbfly button{width:32px;height:32px}.wbshapes,.wbsizes{grid-template-columns:repeat(4,32px)}.wbcols{grid-template-columns:repeat(10,22px)}.wbfly .wbcols button{width:22px;height:22px}}
@media print{.wb{display:none!important}}

.wbselp{display:none}
.wbfly.sl .wbselp{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:220px}

.qb i{position:absolute;right:4px;bottom:1px;font-size:10px;font-style:normal;opacity:.6}
.qb.un{border-style:dashed}
.qb.ans{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent)}
.qb.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.qb.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.qb.fl::after{content:"⚑";position:absolute;top:-8px;right:-6px;font-size:14px;color:var(--accent2);background:var(--paper);border-radius:50%;line-height:1;padding:1px}
.qb:hover{transform:translateY(-2px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 4px;font-size:13px;color:var(--muted);font-weight:700}
.legend i.qb{display:inline-block;width:18px;height:18px;border-radius:6px;vertical-align:-4px;margin-right:4px;cursor:default}
.legend i.qb.fl::after{top:-6px;right:-5px;font-size:11px}
/* question page */
.qtools{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 14px}
.btn.sm{padding:7px 12px;font-size:14px}
.flagbtn.on{background:color-mix(in srgb,var(--accent2) 22%,transparent)!important;border-color:var(--accent2)!important;color:#a2620a!important}
:root[data-theme="dark"] .flagbtn.on{color:var(--accent2)!important}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.opt.sel .l{background:var(--accent);color:#fff;border-color:var(--accent)}
.feedback.pend{color:var(--muted);font-weight:600;font-size:14px}
.sprrow input.saved{border-color:var(--accent)}
.lockcard{text-align:center;border:2px dashed var(--line);border-radius:18px;padding:26px 18px;margin-top:10px}
.lockcard .lk{font-size:40px}.lockcard h3{font-family:Fraunces,serif;margin:6px 0}.lockcard .tools{justify-content:center}
/* evaluation */
.rh3{font-family:Fraunces,serif;font-size:18px;margin:20px 0 8px}
.etab{width:100%;border-collapse:collapse;font-size:14.5px}.etab td{padding:7px 10px;border-top:1px solid var(--line)}
.lnk{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:2px 9px;font:inherit;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
.flg{font-style:normal;color:var(--accent2);font-size:12px}
.anahead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.anatools{display:flex;gap:8px;flex-wrap:wrap}
.ana h3 small{font-family:Nunito,sans-serif;font-size:12px;color:var(--muted)}
/* results */
.resultsp .tcard.done{background:rgba(255,255,255,.2)}
.trend{display:flex;align-items:flex-end;gap:6px;height:110px;margin:16px 0 4px;padding:8px;background:rgba(255,255,255,.1);border-radius:14px}
.trend .tb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.trend .tb i{display:block;width:100%;max-width:34px;background:linear-gradient(#ffd27a,#f2a23a);border-radius:6px 6px 2px 2px}
.trend small{font-size:10px;font-weight:800;opacity:.85}
/* menu additions */
.mnh{gap:10px}.mnh .tdlogo{height:26px}
.mnq button.ans{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent)}
.mnq button.fl{position:relative}.mnq button.fl::after{content:"⚑";position:absolute;top:-6px;right:-4px;font-size:10px;color:var(--accent2)}
.mnleg i.ans{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent)}
.mnleg i.flk{border:0;width:auto;font-style:normal;color:var(--accent2)}
/* solution page header + answer bar */
.solhd{flex-wrap:wrap;row-gap:6px}
.solclock{font-weight:800;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 11px;font-variant-numeric:tabular-nums}
.solclock.warn{background:#d23c3c}.solclock[hidden]{display:none}
.solnav{border:0;border-radius:22px;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-weight:800;padding:8px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.solnav:disabled{opacity:.4;cursor:default}
.solnav.on{background:#f2a23a;color:#2a1a00}
.dsbtn{display:inline-flex;align-items:center;gap:6px}.dsbtn .clogo{width:20px;height:20px}
.dsbtn.on{background:#fff;color:var(--cover1)}
.sola button.ok{border-color:#1f9d5b;background:#e3f6ec}.sola button.bad{border-color:#d23c3c;background:#fbe7e7}
.dspan.cpanel{border-left:3px solid var(--accent)}
@media(max-width:700px){.solnav{padding:7px 9px;font-size:12.5px}.soltt small{display:none}.dsbtn span{display:none}}
@media print{.tmr,.toast,.mbox,.covergo{display:none!important}}
.soltt{flex:1 1 150px}
@media(max-width:1150px){.soltt b{font-size:16px}.snaptg{display:none}}
.tmr{white-space:nowrap}@media(max-width:520px){header .brand span{font-size:15px;white-space:nowrap}}

.imprint table.imp{width:100%;border-collapse:collapse}.imprint .imp th{width:30%;text-align:left;vertical-align:top;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-top:1px solid var(--line);background:transparent}.imprint .imp td{padding:9px 10px;border-top:1px solid var(--line);line-height:1.55}.imprint .small{font-size:13px;color:var(--muted);line-height:1.55}

/* stacked fractions for a/b in plain text */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.12;margin:0 .12em;white-space:nowrap}
.fr>span{display:block;padding:0 .18em}
.fr>.de{border-top:1.4px solid currentColor}
.fr .fr{font-size:.92em}
sup.fx{font-size:.66em;vertical-align:baseline;position:relative;top:-.42em;line-height:1;margin-left:.05em;display:inline-block}
sup.fx .fr{font-size:1em;vertical-align:bottom}
th .fr,.exo .fr{font-size:.88em}

.nw{white-space:nowrap}
</style>
</head>

{tag:"PART 0.1", title:"What is the Digital SAT?", html:`
<p>The Digital SAT is a College Board exam taken on a laptop or tablet in the Bluebook app. It lasts <b>2 hours 14 minutes</b>, is scored from <b>400 to 1600</b>, and is adaptive within each section.</p>
<div class="tw"><table><thead><tr><th>Section</th><th>Modules</th><th>Time</th><th>Questions</th><th>Score</th></tr></thead><tbody>
<tr><td><b>Reading and Writing</b></td><td>Module 1 and 2</td><td>32 + 32 min</td><td>27 + 27 = 54</td><td>200–800</td></tr>
<tr><td><b>Break</b></td><td>—</td><td>10 min</td><td>—</td><td>—</td></tr>
<tr><td><b>Math</b></td><td>Module 1 and 2</td><td>35 + 35 min</td><td>22 + 22 = 44</td><td>200–800</td></tr>
<tr class="tot"><td><b>Total</b></td><td></td><td>2 h 14 min</td><td>98</td><td>400–1600</td></tr></tbody></table></div>
<h3>Structure of the Math section</h3>
<ul>
<li>44 questions in 70 minutes: about 1 minute 35 seconds per question.</li>
<li>4 of the 44 questions are pretest items that do not count toward your score. You cannot tell which ones they are, so treat every question as scored.</li>
<li>About 75% are multiple choice (four options, A–D) and about 25% are student-produced response (SPR, "grid-in").</li>
<li>A calculator is allowed on every question. Bluebook includes the Desmos graphing calculator, and you may also bring an approved handheld calculator.</li>
<li>A reference sheet is always available: area and circumference of a circle, rectangle, triangle, the Pythagorean theorem, 30-60-90 and 45-45-90 triangles, volumes of a prism, cylinder, sphere, cone and pyramid, the fact that a circle has 360° = 2π radians, and that the angles of a triangle sum to 180°.</li>
<li>There is no penalty for wrong answers. <b>Never leave a question blank.</b></li>
</ul>
<h3>How adaptivity works</h3>
<ol>
<li>Module 1 gives every student the same mix of easy, medium and hard questions.</li>
<li>Based on your Module 1 performance, Module 2 is either a harder or an easier set.</li>
<li>Reaching the harder Module 2 is required for a high score (roughly 650+). The easier Module 2 caps your score.</li>
<li><b>Takeaway:</b> careless errors in Module 1 are the most expensive errors on the test. Do not rush the easy questions.</li>
</ol>
<h3>SPR (student-produced response) entry rules</h3>
<div class="tw"><table class="nofrac"><thead><tr><th>Rule</th><th>Correct</th><th>Incorrect</th></tr></thead><tbody>
<tr><td>Up to 5 characters for a positive answer, 6 for a negative answer (including the minus sign)</td><td class="g">3.125</td><td class="r">3.12500</td></tr>
<tr><td>Fractions and decimals are both accepted</td><td class="g">7/2 or 3.5</td><td class="r">3 1/2 (no mixed numbers)</td></tr>
<tr><td>Long decimals: fill the box (truncate or round)</td><td class="g">2/3, .6666, .6667, 0.667</td><td class="r">0.66, .67</td></tr>
<tr><td>No units, %, $ or commas</td><td class="g">1500</td><td class="r">1,500 or $1500</td></tr>
<tr><td>More than one correct answer: enter just one</td><td>—</td><td>—</td></tr></tbody></table></div>
<p>Bluebook shows an answer preview under the entry box. Check it after every SPR answer.</p>
<h3>Bluebook tools</h3>
<ul>
<li><b>Timer:</b> can be hidden, but appears automatically with an alert when 5 minutes remain.</li>
<li><b>Mark for Review:</b> flag a question and return to it before the module ends.</li>
<li><b>Answer Eliminator:</b> cross out options you know are wrong.</li>
<li><b>Question navigator:</b> move freely within a module; once a module ends you cannot go back.</li>
<li>Scores are usually released in your College Board account about two weeks after the test.</li>
</ul>`},

{tag:"PART 0.4", title:"Math section strategy", html:`
<div class="callout">The winning strategy: <b>maximize accuracy in Module 1</b>, bank time for the hard questions, and use Desmos to shortcut algebra.</div>
<h3>1. The two-pass method</h3>
<ol>
<li><b>Pass 1 (~25 min):</b> answer every question you can solve in about a minute. If a question passes 2 minutes, enter your best guess, Mark for Review and move on.</li>
<li><b>Pass 2 (~8 min):</b> return to the marked questions.</li>
<li><b>Last 2 min:</b> make sure nothing is blank and every SPR entry is formatted correctly.</li>
</ol>
<div class="tw"><table><thead><tr><th>Question range</th><th>Typical difficulty</th><th>Target time</th></tr></thead><tbody>
<tr><td>1–7</td><td>Easy</td><td>45–60 s</td></tr>
<tr><td>8–15</td><td>Medium</td><td>1.5 min</td></tr>
<tr><td>16–22</td><td>Hard</td><td>2–2.5 min</td></tr></tbody></table></div>
<h3>2. Desmos strategies</h3>
<ul>
<li><b>Solving equations:</b> graph each side separately (y = left side, y = right side); the x-coordinates of the intersections are the solutions.</li>
<li><b>Quadratics:</b> type the expression; the vertex, zeros and y-intercept appear when you click the curve.</li>
<li><b>Systems:</b> enter both equations as given and read the intersection. Parallel lines = no solution; the same line = infinitely many.</li>
<li><b>Sliders:</b> when a question has an unknown constant (k, a, c), make it a slider and find the value that meets the condition.</li>
<li><b>Regression:</b> enter data in a table and type y₁ ~ mx₁ + b to get the line of best fit.</li>
<li><b>Statistics:</b> mean([...]), median([...]) and stdev([...]) are built in.</li>
</ul>
<p class="tip">🧮 Practise these strategies in this book: open any question's ✍ solution page and press <b>Calculator+</b> — graphing, tables and regressions, sliders, statistics, matrices and geometry are built in.</p>
<h3>3. When Desmos is slower than hand work</h3>
<ul>
<li>One-step equations, percent and ratio questions, and setting up the equation in a word problem.</li>
<li>"Which expression is equivalent?" questions are usually faster by factoring. If you are unsure, graph the original and each option: identical graphs mean equivalent expressions.</li>
</ul>
<h3>4. Classic test techniques</h3>
<ul>
<li><b>Back-solving:</b> with numeric options, start with a middle value and plug it in.</li>
<li><b>Picking numbers:</b> with variable options, choose a simple value such as x = 2 and evaluate the question and each option.</li>
<li><b>Elimination:</b> cross out options with the wrong sign, unit or size.</li>
<li><b>Define your variable</b> in a word problem ("x = number of weeks") on scratch paper.</li>
</ul>
<h3>5. Patterns that real exam questions repeat</h3>
<ul>
<li>"Value of an expression" shortcuts (if 8x − 10 = 6, find 8x + 10) often appear early in a module: spot the relationship before solving for x.</li>
<li>Unit conversions, including cubic conversions (1 yd³ = 27 ft³). Write units as fractions and cancel.</li>
<li>Exponential models in many forms: a growth factor from a percent, "increases by 150%" (factor 2.5, not 1.5), asymptotes and the graph of y = bˣ + c.</li>
<li>Interpretation questions ("best interpretation of p(5) = 105" or of a point on a graph). Name the input and output units before reading the options.</li>
<li>The hardest Module 2 questions often combine geometry with algebra: a pyramid's height from its surface area, a right-triangle altitude, or a parabola's vertex with integer constraints.</li>
</ul>
<h3>6. Study plan (8-week example)</h3>
<div class="tw"><table><thead><tr><th>Week</th><th>Focus</th><th>In this book</th></tr></thead><tbody>
<tr><td>1</td><td>Bluebook diagnostic (official practice test 1)</td><td>Part 0</td></tr>
<tr><td>2–3</td><td>Algebra</td><td><a href="#" data-unit="1">Unit 1 + 4 tests</a></td></tr>
<tr><td>4–5</td><td>Advanced Math</td><td><a href="#" data-unit="2">Unit 2 + 4 tests</a></td></tr>
<tr><td>6</td><td>Data Analysis</td><td><a href="#" data-unit="3">Unit 3 + 3 tests</a></td></tr>
<tr><td>7</td><td>Geometry and Trigonometry</td><td><a href="#" data-unit="4">Unit 4 + 3 tests</a></td></tr>
<tr><td>8</td><td>Two official practice tests + error-notebook review</td><td>Missed questions</td></tr></tbody></table></div>`},

const FRAC=(()=>{
  const ATOM=/[0-9A-Za-zα-ωΔπθℓŷ√∛.,·'⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻ˣᵗⁿᵐ₀₁₂₃₄₅₆₇₈₉°%]/;
  const UNITS=new Set(["km","h","m","s","cm","cm²","cm³","g","ft","in","min","mi","gal","L","kg","mg","mL","yd","hr"]);
  const E=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function match(s,i,dir){let d=0;for(let k=i;k>=0&&k<s.length;k+=dir){const c=s[k];if(c==="("||c==="[")d+=dir>0?1:-1;else if(c===")"||c==="]")d+=dir>0?-1:1;if(d===0)return k}return -1}
  /* operand = run of atom characters and bracket groups, no spaces */
  function leftOp(s,i){let k=i;while(k>=0){const c=s[k];if(c===")"||c==="]"){const m=match(s,k,-1);if(m<0)break;k=m-1;if(k>=0&&s[k]==="^")k--;continue}if(ATOM.test(c)){k--;continue}break}
    let a=k+1;while(a<=i&&/[.,·]/.test(s[a]))a++;return a}
  function rightOp(s,i){let k=i;if(s[k]==="−"||s[k]==="-")k++;while(k<s.length){const c=s[k];if(c==="("||c==="["){const m=match(s,k,1);if(m<0)break;k=m+1;continue}if(c==="^"&&s[k+1]==="("){k++;continue}if(ATOM.test(c)){k++;continue}break}
    let b=k-1;while(b>=i&&/[.,·']/.test(s[b]))b--;return b}
  const isGroup=t=>t[0]==="("&&match(t,0,1)===t.length-1;
  const strip=t=>isGroup(t)?t.slice(1,-1):t;
  function frac(a,b){return`<span class="fr"><span class="nu">${conv(strip(a))}</span><span class="de">${conv(strip(b))}</span></span>`}
  function conv(s){
    // first top-level slash
    let d=0;
    for(let i=0;i<s.length;i++){const c=s[i];if((c==="("||c==="[")&&match(s,i,1)>=0)d++;else if((c===")"||c==="]")&&d>0)d--;else if(c==="/"&&d===0){
      let L=i-1;if(s[L]===" ")L--;let R=i+1;if(s[R]===" ")R++;
      const a0=leftOp(s,L),b0=rightOp(s,R);
      if(a0<=L&&b0>=R){const A=s.slice(a0,L+1),B=s.slice(R,b0+1);
        const skip=(/^[A-Za-z]+[²³]?$/.test(A)&&/^[A-Za-z]+[²³]?$/.test(B)&&UNITS.has(A)&&UNITS.has(B))||/[a-z]\.[a-z]/i.test(A);
        if(!skip){const pre=s.slice(0,a0);if(/[−-]$/.test(pre))return conv(pre.slice(0,-1))+`<span class="nw">${E(pre.slice(-1))}${frac(A,B)}</span>`+conv(s.slice(b0+1));return conv(pre)+frac(A,B)+conv(s.slice(b0+1))}}
      return conv(s.slice(0,i))+"/"+conv(s.slice(i+1))}}
    // no top-level slash: recurse into groups
    let out="",k=0;
    while(k<s.length){const c=s[k];
      if(c==="("){const m=match(s,k,1);if(m<0){out+="("+conv(s.slice(k+1));break}const inner=s.slice(k+1,m);
        if(out.endsWith("^")){out=out.slice(0,-1);out+=`<sup class="fx">${conv(inner)}</sup>`}
        else{const ci=conv(inner);const lone=/^<span class="fr">/.test(ci)&&ci.endsWith("</span></span>")&&(ci.match(/class="fr"/g)||[]).length===1&&!/[⁰¹²³⁴⁵⁶⁷⁸⁹ˣᵗⁿᵐ^]/.test(s[m+1]||"");out+=lone?ci:"("+ci+")"}
        k=m+1;continue}
      out+=E(c);k++}
    return out}
  /* apply to the text nodes under root (skips .nofrac, buttons, inputs, KaTeX) */
  function dom(root){if(!root)return;const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.includes("/")&&!n.parentElement.closest(".nofrac,button,input,textarea,.katex,script,style,.fr,a")?1:3});
    const L=[];while(tw.nextNode())L.push(tw.currentNode);

  return{conv,dom};
})();

ost <span class=\"usd\">$<\/span>3 and pens cost <span class=\"usd\">$<\/span>2. Ayla will spend at most <span class=\"usd\">$<\/span>40 and buy at least 5 notebooks. If she buys 5 notebooks, what is the greatest number of pens she can buy?", "o": [], "s": "Model: 3n + 2p ≤ 40, n ≥ 5. With n = 5: 15 + 2p ≤ 40 → p ≤ 12.5 → 12 pens."}, {"t": "Which table satisfies the inequality?", "q": "For which list of (p, q) pairs are all pairs solutions to p + q &lt; 45?", "o": ["(0, 44), (3, 42), (6, 40)", "(0, 42), (3, 40), (6, 38)", "(0, 40), (3, 42), (6, 44)", "(0, 45), (3, 41), (6, 37)"], "s": "Add each pair. A: 44, 45, 46 — fails at 45. B: 42, 43, 44 — all less than 45 ✓. C: 40, 45, 50 — fails. D: 45 — fails. Answer: B. Check every row; one failing row eliminates the option."}, {"t": "Which list satisfies a strict inequality?", "q": "For which list of (x, y) pairs are all pairs solutions to x + y &gt; 30?", "o": ["(10, 15), (20, 12), (25, 6)", "(12, 19), (15, 16), (20, 11)", "(5, 25), (18, 13), (30, 2)", "(14, 14), (16, 16), (17, 17)"], "s": "Add each pair. B: 31, 31, 31, all greater than 30. A fails at 25, C at 30 (30 is not greater than 30) and D at 28. Answer: B"}, {"t": "Which list satisfies a two-variable inequality?", "q": "For which list of (a, b) pairs are all pairs solutions to 2a − b ≤ 10?", "o": ["(6, 1), (7, 4), (8, 5)", "(6, 0), (4, −3), (3, −4)", "(5, 0), (6, 2), (9, 8)", "(8, 6), (10, 9), (7, 3)"], "s": "Compute 2a − b for each pair. C: 10, 10, 10, all ≤ 10. A fails at (6, 1) with 11, B at (6, 0) with 12 and D at (10, 9) with 11. Answer: C"}, {"t": "Total from fixed and bounded parts", "q": "A playlist has 12 songs. Four of the songs have a combined length of 15 minutes. Each of the other 8 songs lasts at most 5 minutes, and every song has a positive length. The total length of the playlist is t minutes. Which inequality best describes t?", "o": ["0 &lt; t ≤ 55", "15 &lt; t ≤ 40", "15 &lt; t ≤ 55", "t ≥ 40"], "s": "The other 8 songs add more than 0 and at most 8 × 5 = 40 minutes. So 15 &lt; t ≤ 15 + 40 = 55. Answer: C. Trap B forgets to add the known 15 minutes to the upper bound."}, {"t": "Total from a fixed part and bounded parts", "q": "A delivery truck makes 10 deliveries. Three of the deliveries take 50 minutes combined. Each of the other 7 deliveries takes at most 12 minutes, and every delivery takes a positive amount of time. Which of the following could be the total time, in minutes, for all 10 deliveries?", "o": ["48", "50", "120", "140"], "s": "The other 7 deliveries add more than 0 and at most 7 × 12 = 84 minutes, so 50 &lt; total ≤ 134. Only 120 fits. Answer: C"}, {"t": "Greatest possible total", "q": "A shelf holds 15 books. Five of the books weigh 8 kilograms combined. Each of the other books weighs at most 0.6 kilogram. What is the greatest possible total weight, in kilograms, of the 15 books?", "o": [], "s": "The greatest total comes when each of the other 10 books weighs 0.6 kg: 8 + 10(0.6) = 14. Answer: 14"}], "mis": ["Forgetting to reverse the sign when dividing by a negative.", "Rounding down in an \"at least how many\" question (12.3 → 13, not 12).", "Ignoring dashed vs. solid boundaries on a graph.", "Using a strict lower bound of 0 for a total that already contains a known positive part."]}, {"id": "1.3", "title": "Systems of two linear equations", "intro": "The solution of two linear equations is the intersection point of two lines: intersecting lines give 1 solution, parallel lines 0, and identical lines infinitely many.", "sum": "<ul><li><b>Substitution:<\/b> use it when one equation is already solved for x or y.<\/li><li><b>Elimination:<\/b> match coefficients, then add or subtract the equations.<\/li><li><b>Desmos:<\/b> enter both equations and click the intersection.<\/li><li><b>Clear decimals first:<\/b> divide out a common factor, then multiply by 10 or 100 so every coefficient is an integer.<\/li><li><b>Number of solutions<\/b> (for a₁x + b₁y = c₁ and a₂x + b₂y = c₂):<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Condition<\/th><th>Graph<\/th><th>Solutions<\/th><\/tr><\/thead><tbody><tr><td>a₁/a₂ ≠ b₁/b₂<\/td><td>Intersecting lines (different slopes)<\/td><td>One<\/td><\/tr><tr><td>a₁/a₂ = b₁/b₂ ≠ c₁/c₂<\/td><td>Parallel lines (same slope, different intercepts)<\/td><td>None<\/td><\/tr><tr><td>a₁/a₂ = b₁/b₂ = c₁/c₂<\/td><td>Same line<\/td><td>Infinitely many<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Shortcut:<\/b> if the question asks for x + y or x − y, try adding or subtracting the equations directly.<\/li><\/ul>", "ex": [{"t": "Substitution", "q": "If y = 2x − 1 and 3x + 2y = 19, what is x + y?", "o": [], "s": "3x + 2(2x − 1) = 19 → 7x = 21 → x = 3, y = 5 → x + y = 8."}, {"t": "Elimination", "q": "The solution to 5x + 3y = 29 and 2x − 3y = −1 is (x, y). What is y?", "o": [], "s": "Add: 7x = 28 → x = 4. 5(4) + 3y = 29 → 3y = 9 → y = 3."}, {"t": "No solution", "q": "The system 3x − ky = 7 and 6x − 4y = 10 has no solution. What is k?", "o": [], "s": "The lines must be parallel: 3/6 = k/4 → k = 2. Check: 7/10 ≠ 1/2, so the lines are not identical ✓."}, {"t": "Infinitely many solutions", "q": "The system ax + 6y = 12 and 2x + 3y = 6 has infinitely many solutions. What is a?", "o": [], "s": "Multiply the second equation by 2: 4x + 6y = 12. It must match the first → a = 4."}, {"t": "Word problem", "q": "A theater sells adult tickets for <span class=\"usd\">$<\/span>12 and child tickets for <span class=\"usd\">$<\/span>7. It sold 50 tickets for <span class=\"usd\">$<\/span>460. How many adult tickets were sold?", "o": [], "s": "a + c = 50 and 12a + 7c = 460. c = 50 − a → 12a + 350 − 7a = 460 → 5a = 110 → a = 22."}, {"t": "Shortcut", "q": "If 3x + 4y = 23 and 4x + 3y = 26, what is x + y?", "o": [], "s": "Add: 7x + 7y = 49 → x + y = 7. (No need to solve: x = 5, y = 2.)"}, {"t": "Decimal coefficients", "q": "The solution to the system 30(0.5a − 0.2b) = 240 and 40(0.2a + 0.5b) = 360 is (a, b). What is a + b?", "o": [], "s": "Divide out the outer factors: 0.5a − 0.2b = 8 and 0.2a + 0.5b = 9. Multiply by 10: 5a − 2b = 80 and 2a + 5b = 90. Eliminate b: 25a − 10b = 400 and 4a + 10b = 180 → 29a = 580 → a = 20. Then 2(20) + 5b = 90 → b = 10. a + b = 30. In Desmos, entering both equations as given and reading the intersection (20, 10) is just as fast."}, {"t": "Clear the decimals first", "q": "The solution to the system 20(0.3x + 0.1y) = 140 and 10(0.2x − 0.3y) = 10 is (x, y). What is the value of x + y?", "o": [], "s": "Distribute: 6x + 2y = 140 → 3x + y = 70, and 2x − 3y = 10. From the first, y = 70 − 3x. Then 2x − 3(70 − 3x) = 10 → 11x = 220 → x = 20 and y = 10. x + y = 30. Answer: 30"}, {"t": "Decimal coefficients, elimination", "q": "The solution to the system 50(0.4m + 0.2n) = 500 and 20(0.5m − 0.25n) = 50 is (m, n). What is the value of n?", "o": ["15", "20", "35", "10"], "s": "Distribute: 20m + 10n = 500 → 2m + n = 50, and 10m − 5n = 50 → 2m − n = 10. Adding gives 4m = 60 → m = 15, so n = 50 − 30 = 20. Answer: B"}], "mis": ["Stopping after finding one variable when the question asks for the other, or for a sum.", "Not checking the constant ratio for \"no solution\" (the lines might be identical instead).", "Distributing the outer factor to only one term inside the parentheses."]}, {"id": "1.4", "title": "Linear functions and their graphs", "intro": "In a linear function f(x) = mx + b, m is the slope (rate of change) and b is the y-intercept (starting value). The SAT often asks what these numbers mean in a real-world context.", "sum": "<p><b>Slope:<\/b> m = (y₂ − y₁)/(x₂ − x₁)<\/p><div class=\"tw\"><table><thead><tr><th>Form<\/th><th>Equation<\/th><th>Use it when you know<\/th><\/tr><\/thead><tbody><tr><td>Slope-intercept<\/td><td>y = mx + b<\/td><td>The slope and the y-intercept<\/td><\/tr><tr><td>Point-slope<\/td><td>y − y₁ = m(x − x₁)<\/td><td>A point and the slope<\/td><\/tr><tr><td>Standard<\/td><td>Ax + By = C<\/td><td>Slope = −A/B, y-intercept = C/B<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Parallel lines:<\/b> equal slopes. <b>Perpendicular lines:<\/b> slopes multiply to −1 (m and −1/m).<\/li><li><b>Horizontal line<\/b> y = k (slope 0); <b>vertical line<\/b> x = k (undefined slope).<\/li><li><b>Context:<\/b> m = \"change in y for each 1-unit increase in x\"; b = \"value of y when x = 0\"; x-intercept = \"when y reaches 0\".<\/li><li><b>f(a) = b in context:<\/b> \"when the input is a, the output is b\". Name both units before you read the options.<\/li><li><b>From a table:<\/b> if x changes by equal steps and y changes by equal steps, the relationship is linear. Constants such as n or k in the table cancel when you subtract.<\/li><\/ul>", "ex": [{"t": "Equation from two points", "q": "What is the equation of the line through (2, 5) and (6, 17)?", "o": [], "s": "m = (17 − 5)/(6 − 2) = 3. y − 5 = 3(x − 2) → y = 3x − 1."}, {"t": "Interpreting the intercept", "q": "A phone plan costs C(m) = 0.15m + 40 dollars per month, where m is minutes of calls. What does 40 represent?", "o": [], "s": "When m = 0, C = 40: the fixed monthly fee paid even with no calls. The 0.15 is the cost per minute."}, {"t": "Perpendicular line", "q": "A line is perpendicular to y = (2/3)x + 1 and passes through (4, −1). What is its y-intercept?", "o": [], "s": "Perpendicular slope = −3/2. y + 1 = −(3/2)(x − 4) → y = −1.5x + 5 → y-intercept 5."}, {"t": "Function from a table", "q": "<table class=\"dt\"><tr><th>x<\/th><td>1<\/td><td>3<\/td><td>5<\/td><\/tr><tr><th>f(x)<\/th><td>7<\/td><td>13<\/td><td>19<\/td><\/tr><\/table>f is linear. What is f(10)?", "o": [], "s": "Each increase of 2 in x adds 6 → m = 3. f(1) = 7 → b = 4. f(x) = 3x + 4 → f(10) = 34."}, {"t": "Starting value from two values", "q": "f is linear, f(2) = 10 and f(5) = 19. What is f(0)?", "o": [], "s": "m = 9/3 = 3. f(0) = f(2) − 2·3 = 4."}, {"t": "Real-world model", "q": "A 30-cm candle burns 1.5 cm per hour. When will it be 12 cm tall, and when will it burn out?", "o": [], "s": "h(t) = 30 − 1.5t. 12 = 30 − 1.5t → t = 12 hours. Burnout: 0 = 30 − 1.5t → t = 20 hours (the t-intercept)."}, {"t": "Interpret f(a) = b", "q": "The function w(t) = 480 − 15t gives the number of gallons of water remaining in a tank t minutes after draining begins. What is the best interpretation of w(8) = 360?", "o": [], "s": "Input t = 8 minutes, output 360 gallons: 8 minutes after draining begins, 360 gallons remain in the tank. Wrong options typically swap the numbers (\"360 minutes … 8 gallons\") or describe a change (\"decreased by 360\")."}, {"t": "Interpret C(10) = 155", "q": "The function C(n) = 35 + 12n gives the total cost, in dollars, of a gym membership after n months. What is the best interpretation of C(10) = 155?", "o": ["After 10 months, the total cost of the membership is <span class=\"usd\">$<\/span>155.", "After 155 months, the total cost is <span class=\"usd\">$<\/span>10.", "The monthly fee is <span class=\"usd\">$<\/span>10.", "The cost increases by <span class=\"usd\">$<\/span>155 each month."], "s": "The input n = 10 is the number of months and the output 155 is the total cost in dollars. Answer: A"}, {"t": "Interpret h(20) = 300", "q": "The function h(t) = 1,200 − 45t gives the height, in meters, of a descending balloon t minutes after its descent begins. What is the best interpretation of h(20) = 300?", "o": ["After 300 minutes, the balloon is 20 meters high.", "The balloon descends 300 meters each minute.", "20 minutes after the descent begins, the balloon is 300 meters high.", "The balloon's starting height is 300 meters."], "s": "In h(20) = 300, 20 is the time (in minutes) and 300 is the height (in meters). Answer: C"}, {"t": "Slope from a table with a constant", "q": "For a linear relationship, x = −6, −3, 0 correspond to y = m + 84, m + 42, m, where m is a constant. What is the slope?", "o": [], "s": "Use two rows: (m − (m + 42)) / (0 − (−3)) = −42/3 = −14. The constant m cancels; options containing m are traps."}, {"t": "Slope from a table with a constant", "q": "For a linear relationship, x = 2, 4 and 6 correspond to y = k − 9, k − 18 and k − 27, where k is a constant. What is the slope of the line?", "o": [], "s": "Each time x increases by 2, y decreases by 9. Slope = −9/2 = −4.5. The constant k cancels. Answer: −4.5"}, {"t": "Slope when the constant cancels", "q": "For a linear relationship, x = −10, 0 and 10 correspond to y = 3c + 25, 3c and 3c − 25, where c is a constant. What is the slope?", "o": ["−2.5", "2.5", "−25", "3"], "s": "Δy/Δx = (3c − (3c + 25))/(0 − (−10)) = −25/10 = −2.5. Answer: A"}, {"t": "Perpendicular line from a segment", "q": "A segment in the xy-plane runs from (0, 6) to (4, 0). Line ℓ is perpendicular to the segment and passes through (0, −2). Which equation defines ℓ?", "o": ["3x + 2y = −4", "2x − 3y = 6", "2x + 3y = −6", "3x − 2y = 4"], "s": "Segment slope = (0 − 6)/(4 − 0) = −3/2, so ℓ has slope 2/3: y = (2/3)x − 2 → multiply by 3: 3y = 2x − 6 → 2x − 3y = 6. Answer: B. Check the y-intercept in each option: only B gives y = −2 at x = 0 with slope 2/3."}, {"t": "Perpendicular to a segment", "q": "A segment in the xy-plane runs from (0, 4) to (6, 0). Line ℓ is perpendicular to the segment and passes through (0, 5). Which equation defines ℓ?", "o": ["y = −(2/3)x + 5", "y = (3/2)x + 5", "y = −(3/2)x + 5", "y = (2/3)x + 4"], "s": "The segment's slope is (0 − 4)/(6 − 0) = −2/3. The perpendicular slope is the negative reciprocal, 3/2, and the y-intercept is 5. Answer: B"}, {"t": "Perpendicular line through a given point", "q": "A segment runs from (−2, 1) to (2, 9). Line ℓ is perpendicular to the segment and passes through (4, 3). Which equation defines ℓ?", "o": ["y = 2x − 5", "y = −(1/2)x + 3", "y = −(1/2)x + 5", "y = (1/2)x + 1"], "s": "Segment slope = (9 − 1)/(2 + 2) = 2, so ℓ has slope −1/2. Using (4, 3): 3 = −2 + b → b = 5. Answer: C"}, {"t": "Rate plus a point", "q": "In the relationship between x and y, each increase of 1 in x increases y by 5/3. When x = 3, y = −1. Which equation represents the relationship?", "o": [], "s": "y = (5/3)x + b. −1 = (5/3)(3) + b → b = −6 → y = (5/3)x − 6."}, {"t": "Rate of change plus one point", "q": "In a linear relationship, each increase of 1 in x decreases y by 3/4. When x = 8, y = 2. Which equation represents the relationship?", "o": ["y = −(3/4)x + 8", "y = (3/4)x − 4", "y = −(3/4)x + 2", "y = 8x − 3/4"], "s": "Slope = −3/4. Then 2 = −(3/4)(8) + b → 2 = −6 + b → b = 8. Answer: A"}, {"t": "Find the y-intercept from a rate and a point", "q": "In a linear relationship, each increase of 2 in x increases y by 5. When x = −2, y = 1. What is the y-coordinate of the y-intercept of the graph?", "o": [], "s": "Slope = 5/2. Then 1 = (5/2)(−2) + b → 1 = −5 + b → b = 6. Answer: 6"}, {"t": "Unit price from a budget line", "q": "A line passes through (0, 12) and (30, 0). It models the combinations of boxes of pens, x, and boxes of pencils, y, that a school can buy for exactly <span class=\"usd\">$<\/span>720. What is the price of one box of pens?", "o": [], "s": "The x-intercept means <span class=\"usd\">$<\/span>720 buys 30 boxes of pens and no pencils: 720/30 = <span class=\"usd\">$<\/span>24. (Pencils: 720/12 = <span class=\"usd\">$<\/span>60 per box.)"}, {"t": "Unit price from the x-intercept", "q": "A line in the xy-plane passes through (0, 20) and (16, 0). It models the combinations of notebooks, x, and folders, y, that a student can buy for exactly <span class=\"usd\">$<\/span>80. What is the price, in dollars, of one notebook?", "o": [], "s": "The x-intercept means 16 notebooks and 0 folders cost <span class=\"usd\">$<\/span>80, so one notebook costs 80/16 = <span class=\"usd\">$<\/span>5. Answer: 5"}, {"t": "Unit price from the y-intercept", "q": "A line passes through (0, 25) and (40, 0). It models the pounds of apples, x, and pounds of cherries, y, that can be bought for exactly <span class=\"usd\">$<\/span>100. What is the price per pound of cherries, in dollars?", "o": ["2.50", "4", "25", "40"], "s": "The y-intercept means 25 pounds of cherries cost <span class=\"usd\">$<\/span>100, so cherries cost 100/25 = <span class=\"usd\">$<\/span>4 per pound. Choice A is the price of apples. Answer: B"}, {"t": "Equation from a table with a parameter", "q": "For a linear relationship, x = −4, 4, 12 correspond to y = 50 + 3k, 50, 50 − 3k, where k is a positive constant. Which equation represents the relationship?", "o": [], "s": "Slope = (50 − (50 + 3k)) / (4 − (−4)) = −3k/8. Through (4, 50): y − 50 = (−3k/8)(x − 4). Multiply by 8: 8y − 400 = −3kx + 12k → 3kx + 8y = 400 + 12k. Check with (12, 50 − 3k): 36k + 400 − 24k = 400 + 12k ✓."}, {"t": "Equation from a table with a parameter", "q": "For a linear relationship, x = −3, 3 and 9 correspond to y = 20 + 2k, 20 and 20 − 2k, where k is a positive constant. Which equation represents the relationship?", "o": ["y = −(k/3)x + 20 + k", "y = (k/3)x + 20", "y = −(k/3)x + 20", "y = −3kx + 20 + k"], "s": "Slope = −2k/6 = −k/3. Using (3, 20): y − 20 = −(k/3)(x − 3) → y = −(k/3)x + k + 20. Answer: A"}, {"t": "Slope written with a parameter", "q": "For a linear relationship, x = 0, 5 and 10 correspond to y = 8, 8 + 5k and 8 + 10k, where k is a constant. Which equation represents the relationship?", "o": ["y = 5kx + 8", "y = kx + 8", "y = 8x + k", "y = (k/5)x + 8"], "s": "Slope = 5k/5 = k, and the y-intercept is 8 (at x = 0). Answer: B"}], "mis": ["Writing slope as (x₂ − x₁)/(y₂ − y₁).", "Reading the slope of Ax + By = C as A/B (it is −A/B).", "For perpendicular slopes, flipping only the sign or only the fraction.", "In interpretation questions, swapping the input and output values."]}]}, {"u": 2, "name": "Advanced Math", "share": "~35%", "desc": "Advanced Math tests nonlinear expressions and functions. It supplies 13–15 of the 40 scored questions and most of the hard questions in Module 2.", "lessons": [{"id": "2.1", "title": "Quadratic equations and functions", "intro": "A quadratic function can be written three ways, and each form shows different information directly. On the SAT, choosing the right form is half the work.", "sum": "<div class=\"tw\"><table><thead><tr><th>Form<\/th><th>Equation<\/th><th>Shows directly<\/th><\/tr><\/thead><tbody><tr><td>Standard<\/td><td>f(x) = ax² + bx + c<\/td><td>y-intercept = c<\/td><\/tr><tr><td>Factored<\/td><td>f(x) = a(x − r)(x − s)<\/td><td>Zeros (x-intercepts) r and s<\/td><\/tr><tr><td>Vertex<\/td><td>f(x) = a(x − h)² + k<\/td><td>Vertex (h, k); maximum or minimum value k<\/td><\/tr><\/tbody><\/table><\/div><ul><li>a &gt; 0 → opens up (minimum); a &lt; 0 → opens down (maximum).<\/li><li><b>Vertex x-coordinate and axis of symmetry:<\/b> x = −b/(2a). The vertex is also halfway between the two zeros.<\/li><\/ul><p><b>Quadratic formula:<\/b> x = (−b ± √(b² − 4ac)) / (2a), with discriminant Δ = b² − 4ac.<\/p><div class=\"tw\"><table><thead><tr><th>Discriminant (Δ)<\/th><th>Real solutions<\/th><th>Graph<\/th><\/tr><\/thead><tbody><tr><td>Δ &gt; 0<\/td><td>2<\/td><td>Crosses the x-axis twice<\/td><\/tr><tr><td>Δ = 0<\/td><td>1<\/td><td>Touches the x-axis<\/td><\/tr><tr><td>Δ &lt; 0<\/td><td>0<\/td><td>Does not reach the x-axis<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Sum of roots<\/b> = −b/a, <b>product of roots<\/b> = c/a.<\/li><li><b>Special products:<\/b> a² − b² = (a − b)(a + b); a² ± 2ab + b² = (a ± b)².<\/li><li><b>Sign of a(x − r)(x − s)<\/b> with a &gt; 0, r &lt; s: positive outside the zeros, negative between them.<\/li><\/ul>", "ex": [{"t": "Solve by factoring", "q": "What is the positive solution to x² − 5x − 14 = 0?", "o": [], "s": "Numbers with product −14 and sum −5: −7 and 2 → (x − 7)(x + 2) = 0 → x = 7 or x = −2. Positive solution: 7."}, {"t": "Vertex", "q": "What is the minimum value of f(x) = 2x² − 12x + 7?", "o": [], "s": "x = −(−12)/(2·2) = 3. f(3) = 18 − 36 + 7 = −11. Vertex (3, −11)."}, {"t": "Discriminant", "q": "For what value of c does x² + 6x + c = 0 have exactly one real solution?", "o": [], "s": "Δ = 36 − 4c = 0 → c = 9. (Check: x² + 6x + 9 = (x + 3)².)"}, {"t": "Sum of roots", "q": "What is the sum of the solutions to 3x² − 12x + 5 = 0?", "o": [], "s": "−b/a = 12/3 = 4. No need to find each root."}, {"t": "Projectile", "q": "A ball's height after t seconds is h(t) = −16t² + 64t + 5 feet. What is its maximum height?", "o": [], "s": "t = −64/(2·(−16)) = 2. h(2) = −64 + 128 + 5 = 69 feet. Here 5 is the launch height and 2 seconds is the time to reach the top."}, {"t": "Reading vertex form", "q": "Which statement about f(x) = −3(x + 2)² + 8 is true?", "o": ["Its minimum value is 8.", "Its vertex is (2, 8).", "Its maximum value is 8.", "Its y-intercept is 8."], "s": "a = −3 &lt; 0, so it opens down and the vertex (−2, 8) is a maximum. f(0) = −12 + 8 = −4. Answer: C."}, {"t": "Distinct solutions of a factored equation", "q": "How many distinct real solutions does (x + 5)(x − 9) = 0 have? How many does (x − 3)² = 0 have?", "o": [], "s": "Each factor gives a zero: x = −5 and x = 9 → exactly two. For (x − 3)² = 0 both factors give x = 3 → exactly one distinct solution."}, {"t": "Repeated root", "q": "How many distinct real solutions does (2x − 6)(x − 3) = 0 have?", "o": ["0", "1", "2", "3"], "s": "2x − 6 = 0 → x = 3 and x − 3 = 0 → x = 3. Both factors give the same value, so there is only 1 distinct solution. Answer: B"}, {"t": "Count the distinct zeros", "q": "How many distinct real solutions does x(x + 4)(x − 7) = 0 have?", "o": [], "s": "x = 0, x = −4 and x = 7 are three different values. Answer: 3"}, {"t": "Interpret a point on a quadratic model", "q": "The estimated monthly heating cost H(t), in dollars, for a house kept at a thermostat setting of t °C is H(t) = 1.5t² − 30t + 260. What is the best interpretation of the point (18, 206) on the graph of y = H(t)?", "o": [], "s": "Input = setting, output = cost: at a thermostat setting of 18 °C, the estimated monthly heating cost is <span class=\"usd\">$<\/span>206. (Check: 1.5(324) − 540 + 260 = 206.) Wrong options swap the roles (\"a setting of 206 °C\") or describe a rate (\"increases by <span class=\"usd\">$<\/span>206 per degree\")."}, {"t": "Interpret a point on a profit model", "q": "The function P(x) = −2x² + 120x − 1,000 gives a shop's daily profit, in dollars, when it sells x units. What is the best interpretation of P(30) = 800?", "o": ["When the shop sells 30 units, its daily profit is <span class=\"usd\">$<\/span>800.", "When the shop sells 800 units, its daily profit is <span class=\"usd\">$<\/span>30.", "The shop's maximum profit is <span class=\"usd\">$<\/span>30.", "Each unit earns <span class=\"usd\">$<\/span>30 in profit."], "s": "The input is the number of units (30) and the output is the profit in dollars (800). Check: −1,800 + 3,600 − 1,000 = 800 ✓. Answer: A"}, {"t": "Interpret a point on a height model", "q": "The height, in meters, of a ball t seconds after it is thrown is h(t) = −4.9t² + 19.6t + 2. What is the best interpretation of h(2) = 21.6?", "o": ["The ball reaches a maximum height of 2 meters.", "After 21.6 seconds, the ball is 2 meters high.", "2 seconds after it is thrown, the ball is 21.6 meters above the ground.", "The ball travels 21.6 meters each second."], "s": "t = 2 is the time and 21.6 is the height. Check: −19.6 + 39.2 + 2 = 21.6 ✓. Answer: C"}, {"t": "Quadratic formula, greatest solution", "q": "What is the greatest solution to 2x² + 7x − 3 = 0?", "o": ["−7/4 − √73/4", "−7/4 + √73/4", "−7/2 + √73/2", "−7/2 − √73/2"], "s": "x = (−7 ± √(49 + 24))/(2·2) = (−7 ± √73)/4. The greatest uses +: −7/4 + √73/4. Answer: B. Trap C divides by 2 instead of 2a = 4."}, {"t": "Quadratic formula, greatest solution", "q": "What is the greatest solution to x² − 4x − 1 = 0?", "o": ["2 − √5", "2 + √5", "4 + √5", "−2 + √5"], "s": "x = (4 ± √(16 + 4))/2 = (4 ± 2√5)/2 = 2 ± √5. The greater is 2 + √5. Answer: B"}, {"t": "Quadratic formula with a ≠ 1", "q": "What is the greatest solution to 3x² + 5x − 1 = 0?", "o": ["−5/6 − √37/6", "5/6 + √37/6", "−5/6 + √37/6", "−5/3 + √37/3"], "s": "x = (−5 ± √(25 + 12))/6 = (−5 ± √37)/6. The greater is −5/6 + √37/6. Answer: C"}, {"t": "Sign analysis", "q": "f(x) = (x − a)(x − b), where a and b are integers. If f(20) &gt; 0, f(23) &lt; 0 and f(26) &gt; 0, what is one possible value of a + b?", "o": [], "s": "f is negative only between its zeros, so one zero is strictly between 20 and 23 and the other strictly between 23 and 26. With integers: {21, 22} and {24, 25}. Possible sums: 45, 46 or 47 (any one is accepted)."}, {"t": "Sign analysis, many possible answers", "q": "For the function f(x) = (x − a)(x − b), where a and b are integers, f(5) &gt; 0, f(8) &lt; 0 and f(12) &gt; 0. What is one possible value of a + b?", "o": [], "s": "f is negative only between its zeros, so one zero is 6 or 7 and the other is 9, 10 or 11. a + b can be 15, 16, 17 or 18. Answer: any of 15, 16, 17, 18"}, {"t": "Sign analysis with a unique answer", "q": "For f(x) = (x − p)(x − q), where p and q are integers and p &lt; q, f(0) &gt; 0, f(2) &lt; 0 and f(4) &gt; 0. What is the value of pq?", "o": [], "s": "One zero lies strictly between 0 and 2, so p = 1. The other lies strictly between 2 and 4, so q = 3. pq = 3. Answer: 3"}, {"t": "Vertex with integer constraints", "q": "A parabola has vertex (2, 23) and equation y = −ax² + bx + c, where a, b and c are positive integers. What is the greatest possible value of b?", "o": [], "s": "Vertex x-coordinate: b/(2a) = 2 → b = 4a. Plug in the vertex: 23 = −4a + 8a + c → 4a + c = 23. Since c ≥ 1, 4a ≤ 22 → a ≤ 5. The greatest b is 4(5) = 20 (with c = 3)."}, {"t": "Vertex with positive-integer coefficients", "q": "A parabola has vertex (3, 50) and equation y = −ax² + bx + c, where a, b and c are positive integers. What is the greatest possible value of b?", "o": [], "s": "y = −a(x − 3)² + 50 = −ax² + 6ax + (50 − 9a). So b = 6a and c = 50 − 9a &gt; 0 → a ≤ 5. The greatest b is 6(5) = 30. Answer: 30"}, {"t": "Integer constraint on the constant term", "q": "A parabola has vertex (1, 12) and equation y = −ax² + bx + c, where a, b and c are positive integers. What is the greatest possible value of b?", "o": ["11", "12", "22", "24"], "s": "y = −a(x − 1)² + 12 = −ax² + 2ax + (12 − a). c = 12 − a &gt; 0 → a ≤ 11, so the greatest b is 2(11) = 22. Answer: C"}], "mis": ["In (x + 2)², reading the vertex as x = +2; it is x = −2.", "In h(t) = −16t² + 64t + 5, answering with the time of the maximum (2) instead of the height (69).", "Dividing both sides by x and losing the solution x = 0 (x² = 5x → x = 0 or 5).", "Counting a repeated zero twice when the question asks for distinct solutions."]}, {"id": "2.2", "title": "Polynomials and factoring", "intro": "Polynomial questions ask for three things: operate on expressions correctly, factor them, and connect zeros to graphs and remainders.", "sum": "<ul><li><b>Operations:<\/b> combine like terms; when multiplying, multiply every term by every term. When subtracting, change every sign in the second parentheses.<\/li><li><b>Factoring order:<\/b> greatest common factor → special products (a² − b², perfect squares) → trinomials → grouping.<\/li><li><b>Remainder theorem:<\/b> when p(x) is divided by (x − a), the remainder is p(a).<\/li><li><b>Factor theorem:<\/b> p(a) = 0 ⇔ (x − a) is a factor ⇔ a is a zero ⇔ the graph passes through (a, 0).<\/li><li><b>Multiplicity:<\/b> if (x − a) appears to an even power, the graph touches the x-axis and turns back; an odd power means it crosses.<\/li><li><b>Do not divide by an expression that could be zero.<\/b> In x − a = (x − a)(x − b), dividing by (x − a) loses the solution x = a.<\/li><\/ul>", "ex": [{"t": "Subtraction", "q": "Which expression is equivalent to (3x² − 2x + 5) − (x² + 4x − 3)?", "o": [], "s": "3x² − 2x + 5 − x² − 4x + 3 = 2x² − 6x + 8."}, {"t": "Multiplication", "q": "What is the coefficient of x in (2x − 3)(x + 4)?", "o": [], "s": "2x² + 8x − 3x − 12 = 2x² + 5x − 12 → 5."}, {"t": "Factor and count zeros", "q": "At how many points does the graph of f(x) = x³ − 9x cross the x-axis?", "o": [], "s": "x(x² − 9) = x(x − 3)(x + 3) → zeros −3, 0, 3 → 3 points."}, {"t": "Remainder theorem", "q": "What is the remainder when p(x) = x³ − 4x² + 2x + 7 is divided by x − 3?", "o": [], "s": "p(3) = 27 − 36 + 6 + 7 = 4."}, {"t": "Factor theorem", "q": "If (x + 2) is a factor of p(x) = x³ + kx² − 4x − 8, what is k?", "o": [], "s": "p(−2) = −8 + 4k + 8 − 8 = 0 → 4k = 8 → k = 2. Check: x²(x + 2) − 4(x + 2) = (x + 2)(x − 2)(x + 2) ✓."}, {"t": "Multiplicity", "q": "Which statement about f(x) = (x − 1)²(x + 3) is true?", "o": ["The graph crosses the x-axis at x = 1.", "The graph touches the x-axis at x = 1 and turns back.", "f has three distinct zeros.", "f(0) = −3."], "s": "(x − 1)² has an even power → touches and turns. The distinct zeros are only 1 and −3. f(0) = 1·3 = 3. Answer: B."}, {"t": "Subtract, then match a coefficient", "q": "The expression (9x⁴ + 2) − (−5x⁴ + 7) is equivalent to bx⁴ − 5, where b is a constant. What is b?", "o": [], "s": "9x⁴ + 2 + 5x⁴ − 7 = 14x⁴ − 5 → b = 14. Trap: 4, from 9 − 5 without changing the sign of −5x⁴."}, {"t": "Subtract polynomials, match a coefficient", "q": "The expression (7x³ − 4) − (−2x³ + 5) is equivalent to bx³ − 9, where b is a constant. What is the value of b?", "o": [], "s": "7x³ − 4 + 2x³ − 5 = 9x³ − 9, so b = 9. Answer: 9"}, {"t": "Two coefficients after subtracting", "q": "The expression (3x² + 8x) − (5x² − 2x) is equivalent to ax² + bx. What is the value of a + b?", "o": ["8", "12", "−8", "4"], "s": "3x² + 8x − 5x² + 2x = −2x² + 10x. a + b = −2 + 10 = 8. Answer: A"}, {"t": "Do not divide away a solution", "q": "For the equation x − c = (x − c)(x − 18), where c is a constant and c &gt; 19, which of the following are solutions? I. c  ·  II. 18  ·  III. 19", "o": [], "s": "Move everything to one side: (x − c)(x − 18) − (x − c) = 0 → (x − c)(x − 18 − 1) = 0 → (x − c)(x − 19) = 0. Solutions: x = c and x = 19. x = 18 gives 18 − c on the left but 0 on the right, so it fails. I and III only."}, {"t": "Keep the common factor", "q": "For the equation x − c = (x − c)(x − 10), where c is a constant and c &gt; 12, which of the following are solutions? I. c  ·  II. 10  ·  III. 11", "o": ["I only", "I and II", "I and III", "II and III"], "s": "Move everything to one side: (x − c)(x − 10) − (x − c) = (x − c)(x − 11) = 0. So x = c or x = 11. Dividing by (x − c) would lose x = c. Answer: C"}, {"t": "Sum of all solutions", "q": "What is the sum of all solutions to 2(x + 4) = (x + 4)(x − 1)?", "o": [], "s": "(x + 4)(x − 1) − 2(x + 4) = (x + 4)(x − 3) = 0 → x = −4 or x = 3. The sum is −1. Answer: −1"}], "mis": ["Changing the sign of only the first term when subtracting.", "Testing p(2) for the factor (x + 2); the correct test is p(−2).", "Skipping the common factor x in x³ − 9x and losing the zero x = 0.", "Dividing both sides by (x − c) and losing x = c."]}, {"id": "2.3", "title": "Exponential, radical and rational expressions", "intro": "Three core skills: simplify with exponent rules, model exponential growth and decay, and check for extraneous solutions in radical and rational equations. It is one of the most frequently tested skill groups on real exams.", "sum": "<div class=\"tw\"><table><thead><tr><th>Rule<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>aᵐ · aⁿ = aᵐ⁺ⁿ<\/td><td>x³ · x⁴ = x⁷<\/td><\/tr><tr><td>aᵐ / aⁿ = aᵐ⁻ⁿ<\/td><td>x⁸ / x³ = x⁵<\/td><\/tr><tr><td>(aᵐ)ⁿ = aᵐⁿ<\/td><td>(x²)⁵ = x¹⁰<\/td><\/tr><tr><td>a⁻ⁿ = 1/aⁿ<\/td><td>2⁻³ = 1/8<\/td><\/tr><tr><td>a^(m/n) = ⁿ√(aᵐ)<\/td><td>8^(2/3) = 4<\/td><\/tr><tr><td>a⁰ = 1 (a ≠ 0)<\/td><td>7⁰ = 1<\/td><\/tr><\/tbody><\/table><\/div><p><b>Exponential models:<\/b> f(t) = a(1 + r)ᵗ (growth) · f(t) = a(1 − r)ᵗ (decay) · f(t) = a · b^(t/k)<\/p><ul><li>a = initial value; b &gt; 1 growth, 0 &lt; b &lt; 1 decay. b = 1.06 → 6% growth per period; b = 0.85 → 15% decay.<\/li><li><b>\"Increases by p%\"<\/b> → factor 1 + p/100. So \"increases by 150%\" → × 2.5, and \"62% more than\" → × 1.62.<\/li><li><b>\"Every k days\"<\/b> → exponent t/k.<\/li><li><b>Graphs of y = a·bˣ + c:<\/b> the horizontal asymptote is y = c; the y-intercept is a + c. If a &gt; 0, the function is always greater than c. bˣ rises left to right when b &gt; 1; b⁻ˣ falls.<\/li><li><b>Linear or exponential?<\/b> Equal steps with a constant difference → linear; constant ratio (percent) → exponential.<\/li><li><b>Radical equation:<\/b> isolate the root → square → solve → check every solution in the original equation.<\/li><li><b>Rational expressions:<\/b> values that make a denominator 0 are excluded; cancel only common factors, never terms.<\/li><li><b>Literal rational equations:<\/b> multiply both sides by the denominator first, then isolate.<\/li><\/ul>", "ex": [{"t": "Exponent rules", "q": "For x ≠ 0, which expression is equivalent to (2x³)⁴ / (4x⁵)?", "o": [], "s": "(2x³)⁴ = 16x¹². 16x¹² / 4x⁵ = 4x⁷."}, {"t": "Rational exponent", "q": "If x &gt; 0 and x^(3/2) = 27, what is x?", "o": [], "s": "Raise both sides to the 2/3 power: x = 27^(2/3) = (∛27)² = 3² = 9."}, {"t": "Exponential growth", "q": "A town of 2,500 people grows 4% per year. To the nearest whole number, what is the population after 3 years?", "o": [], "s": "P(t) = 2,500(1.04)ᵗ. P(3) = 2,500 · 1.124864 ≈ 2,812."}, {"t": "Half-life", "q": "A 200-mg dose of a medicine halves every 6 hours. How much remains after 18 hours? Write the model.", "o": [], "s": "A(t) = 200(1/2)^(t/6). t = 18 → 200 · (1/2)³ = 25 mg."}, {"t": "Radical equation — extraneous root", "q": "What is the solution set of √(x + 7) = x − 5?", "o": [], "s": "Square: x + 7 = x² − 10x + 25 → x² − 11x + 18 = 0 → (x − 9)(x − 2) = 0. Check: x = 9 → √16 = 4 and 9 − 5 = 4 ✓. x = 2 → √9 = 3 but 2 − 5 = −3 ✗. Only x = 9."}, {"t": "Rational equation — no solution", "q": "Solve x/(x − 3) = 3/(x − 3) + 2.", "o": [], "s": "Multiply by (x − 3): x = 3 + 2(x − 3) → x = 2x − 3 → x = 3. But x = 3 makes the denominators zero. No solution."}, {"t": "Literal rational equation", "q": "The equation p = −q/(45r) relates the distinct nonzero numbers p, q and r. Which equation expresses q in terms of p and r?", "o": ["q = −45pr", "q = −45p/r", "q = −r/(45p)", "q = p + 45r"], "s": "Multiply both sides by 45r: 45pr = −q → q = −45pr. Answer: A."}, {"t": "Literal rational equation", "q": "The equation m = −n/(20p) relates the distinct nonzero numbers m, n and p. Which equation expresses n in terms of m and p?", "o": ["n = −20mp", "n = 20mp", "n = −m/(20p)", "n = −20p/m"], "s": "Multiply both sides by 20p: 20mp = −n → n = −20mp. Answer: A"}, {"t": "Isolate a variable in a fraction", "q": "The equation a = 3b/(4c) relates the nonzero numbers a, b and c. Which equation expresses b in terms of a and c?", "o": ["b = 3ac/4", "b = 4ac/3", "b = 4a/(3c)", "b = 12ac"], "s": "Multiply by 4c: 4ac = 3b → b = 4ac/3. Answer: B"}, {"t": "Radical equation, then a multiple", "q": "If 3√(5x) = 6, what is the value of 20x?", "o": [], "s": "√(5x) = 2 → 5x = 4 → 20x = 4 · 4 = 16. Shortcut: 20x = 4(5x)."}, {"t": "Radical equation, then a multiple", "q": "If 2√(3x) = 12, what is the value of 6x?", "o": [], "s": "√(3x) = 6 → 3x = 36, so 6x = 2(36) = 72. Answer: 72"}, {"t": "Isolate the radical first", "q": "If √(2x) + 5 = 9, what is the value of 10x?", "o": ["16", "40", "80", "160"], "s": "√(2x) = 4 → 2x = 16, so 10x = 5(16) = 80. Answer: C"}, {"t": "Equation of an exponential graph", "q": "A graph in the xy-plane rises from left to right, approaches the horizontal line y = 4 on the left side, and crosses the y-axis at (0, 5). Which equation could it be?", "o": ["y = 2ˣ + 4", "y = 2⁻ˣ + 4", "y = 2ˣ + 5", "y = 2⁻ˣ + 5"], "s": "Asymptote y = 4 → \"+ 4\" (eliminates C, D). Rising left to right → 2ˣ, not 2⁻ˣ. Check: 2⁰ + 4 = 5 ✓. Answer: A."}, {"t": "Equation of a rising exponential graph", "q": "A graph in the xy-plane rises from left to right, approaches the line y = −2 on the left side and crosses the y-axis at (0, 1). Which equation could define the graph?", "o": ["y = 3(2)ˣ − 2", "y = 3(0.5)ˣ − 2", "y = 2ˣ − 2", "y = 3(2)ˣ + 1"], "s": "A rising graph needs a base &gt; 1, and the asymptote y = −2 means − 2 is added. At x = 0: 3(1) − 2 = 1 ✓. Choice C gives −1 and choice B falls. Answer: A"}, {"t": "Equation of a falling exponential graph", "q": "A graph falls from left to right, approaches the line y = 6 on the right side and crosses the y-axis at (0, 10). Which equation could define the graph?", "o": ["y = 4(2)ˣ + 6", "y = 10(0.5)ˣ + 6", "y = 4(0.5)ˣ + 6", "y = 4(0.5)ˣ − 6"], "s": "A falling graph needs a base between 0 and 1, the asymptote is y = 6, and the y-intercept is 4 + 6 = 10. Choice B gives 16. Answer: C"}, {"t": "Growth factor from \"p% more\"", "q": "g(x) = abˣ with a, b &gt; 0. If g(c) = m and g(c + 1) is 35% more than m, what is b?", "o": ["0.35", "0.65", "1.35", "2.70"], "s": "g(c + 1)/g(c) = b, and \"35% more\" means × 1.35. b = 1.35. Answer: C."}, {"t": "Growth factor from \"p% more\"", "q": "The function g is defined by g(x) = abˣ, where a and b are positive constants. If g(c) = m and g(c + 1) is 22% more than m, what is the value of b?", "o": [], "s": "Increasing x by 1 multiplies g by b. 22% more means a factor of 1.22, so b = 1.22. Answer: 1.22"}, {"t": "Decay factor from \"p% less\"", "q": "The function h is defined by h(x) = abˣ, where a and b are positive constants. If h(c + 1) is 40% less than h(c), what is the value of b?", "o": ["0.4", "0.6", "1.4", "40"], "s": "40% less leaves 60% of the value: b = 1 − 0.40 = 0.6. Answer: B"}, {"t": "Simplify a rational expression", "q": "Which expression is equivalent to 3(x − 4)/(x − 4)², where x &gt; 4?", "o": ["3", "1/(x − 4)", "3/(x − 4)", "(3x − 12)/(x² + 16)"], "s": "Cancel one factor of (x − 4): 3/(x − 4). Answer: C. Trap D squares each term separately: (x − 4)² ≠ x² + 16."}, {"t": "Cancel a common factor", "q": "Which expression is equivalent to 5(x + 1)/(x + 1)², where x &gt; −1?", "o": ["5/(x + 1)", "5(x + 1)", "5", "1/(5(x + 1))"], "s": "Cancel one factor of (x + 1) from the numerator and the denominator. Answer: A"}, {"t": "Factor, then simplify", "q": "Which expression is equivalent to (x² − 9)/(2x + 6), where x &gt; 3?", "o": ["(x + 3)/2", "(x − 3)/2", "x − 3", "(x − 9)/2"], "s": "(x − 3)(x + 3)/(2(x + 3)) = (x − 3)/2. Answer: B"}, {"t": "Lower bound of an exponential function", "q": "f(x) = 5((1/3)ˣ + 6). For all x, f(x) &gt; k. What is the greatest possible value of k?", "o": ["0", "6", "30", "35"], "s": "f(x) = 5(1/3)ˣ + 30. Since (1/3)ˣ &gt; 0 but can get as close to 0 as you like, f(x) &gt; 30 and approaches 30. k = 30. Answer: C. Trap B forgets to distribute the 5."}, {"t": "Lower bound of an exponential function", "q": "The function f is defined by f(x) = 2((1/4)ˣ + 7). For all values of x, f(x) &gt; k. What is the greatest possible value of k?", "o": [], "s": "(1/4)ˣ is always positive and can get arbitrarily close to 0, so f(x) &gt; 2(0 + 7) = 14 and gets close to 14. Answer: 14"}, {"t": "Asymptote as the bound", "q": "The function f is defined by f(x) = 3(5ˣ) − 8. For all values of x, f(x) &gt; k. What is the greatest possible value of k?", "o": ["−8", "−5", "3", "0"], "s": "3(5ˣ) &gt; 0, so f(x) &gt; −8, and f gets arbitrarily close to −8 as x decreases. Answer: A"}, {"t": "\"Increases by p% every k days\"", "q": "A bacteria culture starts with 12 colonies. A model predicts the number increases by 80% every 7 days. Which equation gives the predicted number of colonies y after x days?", "o": ["y = 12(1.80)^(x/7)", "y = 12(0.80)^(x/7)", "y = 12(1.80)^(7x)", "y = 12(0.80)^(7x)"], "s": "Increase by 80% → factor 1.80; every 7 days → exponent x/7. Answer: A."}, {"t": "\"Increases by p% every k months\"", "q": "A population of 30 rabbits increases by 50% every 4 months. Which equation gives the predicted number of rabbits y after x months?", "o": ["y = 30(0.5)^(x/4)", "y = 30(1.5)^(4x)", "y = 30(1.5)^(x/4)", "y = 30(50)^(x/4)"], "s": "The growth factor is 1 + 0.50 = 1.5, applied once every 4 months, so the exponent is x/4. Answer: C"}, {"t": "Decay every k hours", "q": "A patient takes 200 milligrams of a medication. The amount in the body decreases by 25% every 6 hours. How many milligrams remain after 12 hours?", "o": [], "s": "y = 200(0.75)^(t/6). At t = 12: 200(0.75)² = 200(0.5625) = 112.5. Answer: 112.5"}], "mis": ["Forgetting to raise the coefficient to the power: (2x³)⁴ has 2⁴ = 16.", "Writing 15% decay as (0.15)ᵗ instead of (0.85)ᵗ, or \"increases by 150%\" as 1.5 instead of 2.5.", "Writing \"every 7 days\" as 7x instead of x/7.", "Skipping the check step in radical and rational equations."]}, {"id": "2.4", "title": "Function notation, composition and transformations", "intro": "f(a) means \"substitute a for x\"; f(x) = k asks \"for which x is the output k?\" Keeping these two directions apart is the foundation of this subtopic.", "sum": "<ul><li><b>Evaluate:<\/b> f(a) → input a. <b>Solve:<\/b> f(x) = k → output k.<\/li><li><b>Expressions with f(a):<\/b> replace f(a) with the formula in terms of a, then solve the resulting equation for a.<\/li><li><b>Reading a graph:<\/b> f(a) is the y-value at x = a; the x-values where f(x) = 0 are the x-intercepts.<\/li><li><b>Composition:<\/b> f(g(x)) → apply g first, then f. In general f(g(x)) ≠ g(f(x)).<\/li><li><b>Domain and range:<\/b> exclude x-values that make a denominator 0 or a square root negative.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Transformation<\/th><th>Effect<\/th><th>Point (a, b) moves to<\/th><\/tr><\/thead><tbody><tr><td>f(x) + k<\/td><td>Up k units<\/td><td>(a, b + k)<\/td><\/tr><tr><td>f(x − h)<\/td><td>Right h units<\/td><td>(a + h, b)<\/td><\/tr><tr><td>f(x + h)<\/td><td>Left h units<\/td><td>(a − h, b)<\/td><\/tr><tr><td>−f(x)<\/td><td>Reflect across the x-axis<\/td><td>(a, −b)<\/td><\/tr><tr><td>f(−x)<\/td><td>Reflect across the y-axis<\/td><td>(−a, b)<\/td><\/tr><tr><td>c·f(x)<\/td><td>Vertical stretch or shrink<\/td><td>(a, cb)<\/td><\/tr><\/tbody><\/table><\/div>", "ex": [{"t": "Evaluate", "q": "If f(x) = 3x² − 2x, what is f(−2)?", "o": [], "s": "3(4) − 2(−2) = 12 + 4 = 16. Always sub
