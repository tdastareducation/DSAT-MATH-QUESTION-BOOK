  const MODES=[["graph","📈 Graphing",GraphMode],["sci","🧮 Scientific",SciMode],["basic","➗ Basic",BasicMode],["matrix","▦ Matrix",MatrixMode],["geo","📐 Geometry",GeoMode],["3d","🧊 3D",ThreeDMode]];
  panel.innerHTML=`<div class="cph">${CALC_LOGO}<b>Calculator<span>+</span></b><span class="sp"></span><button class="cpw" title="Make the panel wider or narrower">⤢ Wider</button><button class="cpx" title="Close" aria-label="Close Calculator+">✕</button></div>
    <div class="cptabs" role="tablist">${MODES.map(([k,l],i)=>`<button data-m="${k}" role="tab" class="${i?"":"on"}">${l}</button>`).join("")}</div><div class="cpbody">${MODES.map(([k])=>`<div class="cpm" data-m="${k}" hidden></div>`).join("")}</div>`;
  const inst={};let mode="graph";
  function show(m){mode=m;panel.querySelectorAll(".cptabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));panel.querySelectorAll(".cpm").forEach(d=>d.hidden=d.dataset.m!==m);
    if(!inst[m]){const def=MODES.find(x=>x[0]===m);inst[m]=def[2](panel.querySelector(`.cpm[data-m="${m}"]`))}}
  panel.querySelector(".cptabs").onclick=e=>{const b=e.target.closest("[data-m]");if(b)show(b.dataset.m)};
  show("graph");
  return{show,reset(){Object.values(inst).forEach(x=>x.reset&&x.reset())},get mode(){return mode},inst,
    wideBtn:panel.querySelector(".cpw"),closeBtn:panel.querySelector(".cpx")};
}

/* ---------- solution page: squared paper + drawing tools + Calculator+ + Prev/Next ---------- */
const SOLP=(()=>{
 const ov=document.getElementById('solp'),sheet=document.getElementById('solsheet'),qbox=document.getElementById('solq'),abox=document.getElementById('sola');
 const ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18" opacity=".45"/><path d="M14 17l5-5-2-2-5 5-1 3z" stroke-width="2.2"/></svg>';
 let qi=-1,savedScroll=0,calc=null;
 const isOpen=()=>!ov.hidden;
 function addButton(){const x=SEQ[cur];const ok=x.k==='q';pageEl.classList.toggle('hasws',ok);if(!ok)return;
  const b=document.createElement('button');b.className='wsb';b.title='Solution page – solve this question on squared paper with Calculator+';b.setAttribute('aria-label','Open solution page');b.innerHTML=ICON;b.onclick=()=>open();pageEl.appendChild(b)}
 function fill(){const q=Q[qi],t=q.test,done=picks[qi]!==undefined,ids=qOf(t),k=ids.indexOf(qi);
  document.getElementById('solex').textContent=`${tLbl(t)} · Question ${q.tn} / ${TCOUNT[t]} · ${q.topic}`;
  const clk=document.getElementById('solClock');clk.hidden=true;
  document.getElementById('solPrev').disabled=k<=0;document.getElementById('solNext').disabled=k>=ids.length-1;
  const fb=document.getElementById('solFlag');fb.classList.toggle('on',!!flags[qi]);fb.textContent=flags[qi]?'⚑ Flagged':'⚐ Flag';
  qbox.innerHTML=`<div class="qh">${tLbl(t)} · Question ${q.tn}</div>`+(q.fig?`<div class="fig">${q.fig}</div>`:'')+`<div class="qtext">${q.q}</div>`;
  if(q.spr){abox.innerHTML=`<form class="solform" action="#" onsubmit="return false"><input class="solin" id="solIn" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="8" placeholder="Type your answer (e.g. 5/2)" ${done?'disabled':''} value="${done?esc(picks[qi]):''}">${done?'':'<button type="submit" class="solok">✔ Check</button>'}</form><div class="done">${done?(isOK(q,picks[qi])?'✔ Correct':'✘ Key: '+esc(fmtKey(q))):'Fraction or decimal · tap ✔ Check or the Done key on your keyboard.'}</div>`;
   const inp=abox.querySelector('input');abox.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const v=inp.value.trim();if(!v||isNaN(numVal(v))){inp.focus();return}inp.blur();if(qStart){times[qi]=(times[qi]||0)+(Date.now()-qStart);qStart=null}picks[qi]=v;save();updScore();fill()})}
  else{abox.innerHTML=q.o.map((o,j)=>`<button data-j="${j}" class="${done&&j===q.a?'ok':''} ${done&&picks[qi]===j&&j!==q.a?'bad sel':''}" ${done?'disabled':''}><span class="l">${L[j]}</span><span>${o}</span></button>`).join('')+(done?`<div class="done">${isOK(q,picks[qi])?'✔ Correct':'✘ The correct answer is '+L[q.a]} · the solution is open in the book.</div>`:'')}
  if(typeof math==='function'){math(qbox);math(abox)}
  if(q.spr)FRAC.dom(abox.querySelector('.done'));
  paintTimers();
 }
 function open(i){const x=SEQ[cur];if(i===undefined){if(x.k!=='q')return;i=x.i}qi=i;
  if(!isOpen()){savedScroll=scrollY;ov.hidden=false;document.body.classList.add('solopen')}
  if("speechSynthesis" in window)speechSynthesis.cancel();
  fill();document.getElementById('solscroll').scrollTop=0;
  WB.zoomUI();WB.surface(sheet,'S'+qi);WB.open();WB.tool('pen')}
 function nav(d){if(qi<0)return;const ids=qOf(Q[qi].test),k=ids.indexOf(qi)+d;if(k<0||k>=ids.length)return;
  const target=ids[k];go(posOfQ(target));if(calc)calc.reset();open(target)}
 function back(silent){if(qi<0||ov.hidden)return;qi=-1;
  ov.hidden=true;document.body.classList.remove('solopen');WB.zoomUI();WB.tool('cursor');WB.surface(null);
  if(!silent){go(cur,'next');setTimeout(()=>scrollTo(0,savedScroll),20)}}
 abox.addEventListener('click',e=>{const b=e.target.closest('button[data-j]');if(!b||b.disabled||qi<0||picks[qi]!==undefined)return;if(qStart){times[qi]=(times[qi]||0)+(Date.now()-qStart);qStart=null}picks[qi]=+b.dataset.j;save();updScore();fill()});
 document.getElementById('solback').addEventListener('click',()=>back());
 document.getElementById('solPrev').addEventListener('click',()=>nav(-1));
 document.getElementById('solNext').addEventListener('click',()=>nav(1));
 document.getElementById('solFlag').addEventListener('click',e=>{if(qi<0)return;toggleFlag(qi);e.currentTarget.classList.toggle('on',!!flags[qi]);e.currentTarget.textContent=flags[qi]?'⚑ Flagged':'⚐ Flag'});
 document.getElementById('solHome').addEventListener('click',()=>{if(qi<0)return;const t=Q[qi].test;back(true);go(posOfHome(t))});
 const stg=document.getElementById('snapTg');const stgUI=()=>{const on=WB.snap();stg.classList.toggle('off',!on);stg.querySelector('b').textContent=on?'ON':'OFF'};stg.addEventListener('click',()=>{WB.snap(!WB.snap());stgUI()});stgUI();
 /* Calculator+ (built into the book) */
 const pan=document.getElementById('dsPan'),btn=document.getElementById('dsBtn');
 function calcOn(on){if(on&&!calc){calc=CalcPlus(pan);calc.wideBtn.onclick=()=>{const w=pan.classList.toggle('wide');calc.wideBtn.textContent=w?'⤡ Narrower':'⤢ Wider';setTimeout(()=>WB.refresh(),60)};calc.closeBtn.onclick=()=>calcOn(false)}
  pan.hidden=!on;btn.setAttribute('aria-pressed',on);btn.classList.toggle('on',on);setTimeout(()=>WB.refresh(),60)}
 btn.addEventListener('click',()=>calcOn(pan.hidden));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden&&!document.body.classList.contains('drawing')&&!e.target.closest('.cpanel'))back()});
 return{addButton,open,back,nav,isOpen};
})();


const PAR=(()=>{const wrap=root=>{const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.includes('∥')&&!(n.parentElement&&n.parentElement.closest('.par,script,style,textarea'))?1:3});const L=[];while(tw.nextNode())L.push(tw.currentNode);
  L.forEach(n=>{const f=document.createDocumentFragment();n.nodeValue.split('∥').forEach((t,i)=>{if(i){const s=document.createElement('span');s.className='par';s.textContent='∥';f.append(s)}if(t)f.append(t)});n.replaceWith(f)})};
 wrap(document.body);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)wrap(n);else if(n.nodeType===3&&n.parentNode&&n.nodeValue.includes('∥'))wrap(n.parentNode)}))).observe(document.body,{childList:true,subtree:true});return{wrap}})();
/* ---------- contents menu (top-left ☰): every page of the book in one place ---------- */
const MENU=(()=>{
 const btn=document.getElementById('menuBtn');
 const ov=document.createElement('div');ov.className='mnov';ov.hidden=true;
 const pn=document.createElement('nav');pn.className='mnp';pn.setAttribute('aria-label','Book contents');pn.hidden=true;
 document.body.append(ov,pn);
 const st=i=>{const q=Q[i],p=picks[i];return p===undefined?'':!scored(q)?'void':isOK(q,p)?'ok':'bad'};
 function render(){const x=SEQ[cur],cT=curTest(),cU=cT?TESTS[cT-1].unit:null,all=statsOf(()=>true),nd=Object.keys(picks).length;
  let h=`<div class="mnh">${TD_LOGO}<div><b>Contents</b><small>${nd} / ${Q.length} answered${all.max?` · ✔ ${all.c} / ${all.max}`:""}</small></div><button class="mnx" aria-label="Close menu" title="Close (Esc)">✕</button></div><div class="mnb"><div class="mnth"><span>Background</span><div class="seg" role="group" aria-label="Background color"><button data-theme="light" class="${document.documentElement.dataset.theme!=='dark'?'on':''}">☀️ Light</button><button data-theme="dark" class="${document.documentElement.dataset.theme==='dark'?'on':''}">🌙 Dark</button></div></div>`;
  h+=`<button class="mni ${x.k==='cover'?'on':''}" data-go="0">🏠 Front cover</button><button class="mni ${x.k==='imprint'?'on':''}" data-go="${posOf('imprint')}">📇 Imprint</button>`;
  h+=`<details class="mng" ${x.k==='info'?'open':''}><summary>🧭 Part 0 · Exam guide</summary>`+GUIDE.map((g,n)=>`<button class="mni sub ${x.k==='info'&&x.n===n?'on':''}" data-go="${posOfInfo(n)}"><small>${g.tag}</small>${g.title}</button>`).join('')+`</details>`;
  UNITS.forEach(u=>{const inU=cU===u||((x.k==='unit'||x.k==='les')&&x.u===u);h+=`<details class="mng" ${inU?'open':''}><summary>📗 Unit ${u} · ${uName(u)}</summary>`;
   h+=`<button class="mni sub ${x.k==='unit'&&x.u===u?'on':''}" data-go="${posOfUnit(u)}"><small>UNIT ${u}</small>Unit opener</button>`+LUNIT(u).lessons.map((l,li)=>`<button class="mni sub ${x.k==='les'&&x.u===u&&x.li===li?'on':''}" data-go="${posOfLes(u,li)}"><small>LESSON ${l.id} · ${l.ex.length} examples</small>${l.title}</button>`).join('')+`<div class="mnsep">Tests</div>`;
   TESTS.filter(T=>T.unit===u).forEach(T=>{const t=T.id,s=tStats(t),d=submitted(t),a=answeredIn(t);
    const info=d?`${a} / ${TCOUNT[t]} answered · ✔ ${s.c}`:"not started";
    h+=`<div class="mnt ${cT===t?'on':''}"><button class="mni sub" data-go="${posOfHome(t)}">Test ${T.un}<small>${info}</small></button><button class="mnr" data-go="${posOfRes(t)}" title="Test ${T.un} evaluation" aria-label="Test ${T.un} evaluation">📊</button></div>`
     +(true?`<div class="mnq">`+qOf(t).map(i=>`<button class="${st(i)} ${flags[i]?'fl':''} ${x.k==='q'&&x.i===i?'here':''}" data-go="${posOfQ(i)}" title="Q${Q[i].tn} · ${Q[i].topic}${Q[i].spr?' · grid-in':''}">${Q[i].tn}</button>`).join('')+`</div>`:"");});
   h+=`</details>`;});
  h+=`<button class="mni ${x.k==='ana'?'on':''}" data-go="${posOf('ana')}">📄 Detailed analysis</button><button class="mni ${x.k==='results'?'on':''}" data-go="${posOf('results')}">🏁 Your results</button><button class="mni ${x.k==='back'?'on':''}" data-go="${TOTAL-1}">🔚 Back cover</button>`;
  h+=`<div class="mnleg"><i class="ok"></i>correct <i class="bad"></i>wrong <i></i>unanswered <i class="flk">⚑</i>flagged</div></div>`;
  pn.innerHTML=h}
 function open(){render();pn.hidden=false;ov.hidden=false;requestAnimationFrame(()=>pn.classList.add('open'));btn.setAttribute('aria-expanded','true');
  const t=pn.querySelector('.mnq .here,.mni.on');if(t)t.scrollIntoView({block:'center'})}
 function close(){pn.classList.remove('open');ov.hidden=true;btn.setAttribute('aria-expanded','false');setTimeout(()=>{if(!pn.classList.contains('open'))pn.hidden=true},260)}
 btn.addEventListener('click',()=>pn.hidden?open():close());ov.addEventListener('click',close);
 pn.addEventListener('click',e=>{if(e.target.closest('.mnx'))return close();const b=e.target.closest('[data-go]');if(b){close();go(+b.dataset.go)}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pn.hidden){close();return}
  if((e.key==='m'||e.key==='M')&&!e.ctrlKey&&!e.metaKey&&!e.target.matches('input,textarea,select')&&!document.body.classList.contains('solopen'))pn.hidden?open():close()});
 return{open,close};
})();

(()=>{const b=document.getElementById('themeBtn');const ui=()=>{const d=document.documentElement.dataset.theme==='dark';b.setAttribute('aria-checked',d);const sb=document.getElementById('solTheme');if(sb)sb.setAttribute('aria-checked',d);b.title=d?'Background: dark (tap for light)':'Background: light (tap for dark)';document.querySelectorAll('.mnth .seg button').forEach(x=>x.classList.toggle('on',x.dataset.theme===(d?'dark':'light')))};ui();
 window.setTheme=d=>{if(document.documentElement.dataset.theme===d){ui();return}document.documentElement.dataset.theme=d;try{localStorage.setItem('dsat-theme',d)}catch(e){}ui();if(SEQ[cur].k==='ana'||SEQ[cur].k==='res')go(cur)};
 b.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');{const sb=document.getElementById('solTheme');if(sb)sb.onclick=b.onclick}
 document.addEventListener('click',e=>{const t=e.target.closest('.mnth .seg button');if(t){e.stopPropagation();setTheme(t.dataset.theme)}},true);
 document.getElementById('tmr').onclick=()=>{timerHidden=!timerHidden;paintTimers()};})();
window.WB=WB;window.SOLP=SOLP;window.BGFX=BGFX;
window.addEventListener("DOMContentLoaded",()=>{ updScore(); go(cur); });
</script>
