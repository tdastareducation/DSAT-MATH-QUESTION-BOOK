from the sixty teens. Thirty of them prefer cats, so the probability is thirty over sixty, which is one half. The answer is A.", "topic": "Probability", "d": 2, "orig": 12, "test": 9, "o": ["$\\dfrac12$", "$\\dfrac59$", "$\\dfrac14$", "$\\dfrac{30}{54}$"], "a": 0}, {"q": "A recipe uses 3 cups of flour for 24 cookies. How many cups of flour are needed for 60 cookies?", "h": "Set up a proportion, or find how many batches of 24 make 60.", "s": "$\\dfrac{3}{24}=\\dfrac{x}{60} \\Rightarrow x=\\dfrac{3\\cdot 60}{24}=7.5$ cups ($60\\div 24=2.5$ batches, $3\\times 2.5=7.5$).", "v": "Sixty cookies is sixty divided by twenty four, which is two and a half batches. Two and a half times three cups is seven point five cups. The answer is seven point five.", "topic": "Ratios, rates & units", "d": 2, "orig": 13, "test": 9, "spr": true, "a": ["7.5", "15/2"]}, {"q": "The mean of 10 numbers is 12. If the number 30 is removed, what is the mean of the remaining 9 numbers?", "h": "Find the total first: mean × count.", "s": "Sum $=10\\times 12=120$. Remove 30: $120-30=90$, and $\\dfrac{90}{9}=10$.", "v": "Ten numbers with mean twelve add up to one hundred twenty. Removing thirty leaves ninety, spread over nine numbers. Ninety divided by nine is ten. The answer is B.", "topic": "Statistics", "d": 2, "orig": 14, "test": 9, "o": ["$9$", "$10$", "$11$", "$12$"], "a": 1}, {"q": "A town of 8,000 people grows 2.5% per year. To the nearest whole number, what is the population after 4 years?", "h": "Compound growth: multiply by 1.025 four times.", "s": "$8{,}000\\times 1.025^4\\approx 8{,}000\\times 1.10381\\approx 8{,}831$. (8,800 is simple, not compound, growth.)", "v": "Growing two and a half percent per year means multiplying by one point zero two five each year. After four years: eight thousand times one point zero two five to the fourth, which is about eight thousand eight hundred thirty one. Eight thousand eight hundred would ignore compounding. The answer is C.", "topic": "Percentages", "d": 3, "orig": 15, "test": 9, "o": ["$8{,}800$", "$8{,}200$", "$8{,}831$", "$8{,}400$"], "a": 2}, {"q": "A metal block with a volume of 250 cm³ has a mass of 1,975 g. What is the density of the metal, in g/cm³?", "h": "Density = mass ÷ volume.", "s": "$\\dfrac{1{,}975}{250}=7.9$ g/cm³.", "v": "Density is mass divided by volume. One thousand nine hundred seventy five divided by two hundred fifty is seven point nine grams per cubic centimeter. The answer is seven point nine.", "topic": "Ratios, rates & units", "d": 2, "orig": 16, "test": 9, "spr": true, "a": ["7.9"]}, {"q": "Of 200 randomly selected students at School X, 64 prefer online classes; the margin of error is ±6%. Which conclusion is most appropriate?", "h": "Find the sample percent, apply the margin of error, and generalize only to the population that was sampled.", "s": "$\\dfrac{64}{200}=32\\%$, and $32\\%\\pm 6\\%$ gives 26% to 38% — for students at School X only (the sample came from there).", "v": "Sixty four out of two hundred is thirty two percent. With a margin of error of six percent, the true value is likely between twenty six and thirty eight percent. Since the sample came from School X, the conclusion applies only to School X. The answer is A.", "topic": "Statistics", "d": 3, "orig": 17, "test": 9, "o": ["Between about 26% and 38% of all students at School X likely prefer online classes.", "Exactly 32% of all students in the country prefer online classes.", "Exactly 64 students at School X prefer online classes.", "32% of students at every school in the region prefer online classes."], "a": 0}, {"q": "A plant grows 2 cm every week. Which describes the relationship between its height and time?", "h": "Is the same AMOUNT added each week, or the same PERCENT?", "s": "A constant amount (+2 cm) each week is linear growth.", "v": "The plant adds the same amount, two centimeters, every week. A constant amount of change is linear, and the height is increasing, so it is linear growth. The answer is B.", "topic": "Data & scatterplots", "d": 1, "orig": 18, "test": 9, "o": ["Exponential growth", "Linear growth", "Linear decay", "Exponential decay"], "a": 1}, {"q": "Set A: 3, 5, 7, 9, 11. Set B: 1, 5, 7, 9, 13. Which statement is true?", "h": "Compute both means and medians. Then compare how far the values are from the center.", "s": "Both means are 7 and both medians are 7. B's extreme values (1 and 13) are farther from 7 than A's (3 and 11), so B has the greater standard deviation.", "v": "Both sets have mean seven and median seven. But set B has values one and thirteen, which are farther from seven than three and eleven in set A. More spread means a larger standard deviation, so B's is greater. The answer is C.", "topic": "Statistics", "d": 3, "orig": 19, "test": 9, "o": ["The mean of A is greater than the mean of B.", "The standard deviation of A is greater than that of B.", "The standard deviation of B is greater than that of A.", "The medians are different."], "a": 2}, {"q": "A store raised a price by 20%, and then a coupon lowered the new price by 20%. The final price was <span class=\"usd\">$<\/span>48. What was the original price, in dollars?", "h": "Up 20% is ×1.2 and down 20% is ×0.8. They don't cancel!", "s": "$1.2\\times 0.8=0.96$. $0.96p=48 \\Rightarrow p=50$.", "v": "Raising by twenty percent multiplies by one point two, and lowering by twenty percent multiplies by zero point eight. Together that is zero point nine six. So zero point nine six times the original price is forty eight, and the original price is fifty dollars. The answer is B.", "topic": "Percentages", "d": 3, "orig": 20, "test": 9, "o": ["$48$", "$50$", "$52$", "$57.60$"], "a": 1}, {"q": "A bag contains only red and blue marbles, and the probability of drawing red is $\\dfrac38$. After 6 red marbles are added, the probability becomes $\\dfrac12$. How many marbles were in the bag originally?", "h": "Let $n$ be the original total. Red marbles: $\\tfrac38 n$. Write the new probability as a fraction.", "s": "$\\dfrac{\\tfrac38 n+6}{n+6}=\\dfrac12 \\Rightarrow \\dfrac34 n+12=n+6 \\Rightarrow \\dfrac n4=6 \\Rightarrow n=24$.<br>Check: 9 red of 24; then 15 of 30 $=\\tfrac12$ ✓.", "v": "Let n be the original number of marbles. Then three eighths n are red. After adding six red, the probability is three eighths n plus six, over n plus six, which equals one half. Cross multiply: three fourths n plus twelve equals n plus six. So one fourth n is six, and n is twenty four. Check: nine red out of twenty four, then fifteen out of thirty, which is one half. The answer is twenty four.", "topic": "Probability", "d": 4, "orig": 21, "test": 9, "spr": true, "a": ["24"]}, {"q": "The line of best fit for a data set is $\\hat y=0.8x+4.5$. What is the residual of the data point $(10,\\ 15)$?", "h": "Residual = actual $y$ − predicted $\\hat y$.", "s": "$\\hat y=0.8(10)+4.5=12.5$. Residual $=15-12.5=2.5$.", "v": "The predicted value at x equals ten is zero point eight times ten plus four point five, which is twelve point five. The residual is actual minus predicted: fifteen minus twelve point five, which is two point five. The answer is A.", "topic": "Data & scatterplots", "d": 3, "orig": 22, "test": 9, "o": ["$2.5$", "$-2.5$", "$12.5$", "$15$"], "a": 0}, {"q": "45 is what percent of 180?", "h": "Part ÷ whole, then convert to a percent.", "s": "$\\dfrac{45}{180}=0.25=25\\%$.", "v": "Divide the part by the whole: forty five over one hundred eighty is zero point two five, which is twenty five percent. The answer is A.", "topic": "Percentages", "d": 1, "orig": 1, "test": 10, "o": ["$25\\%$", "$40\\%$", "$45\\%$", "$4\\%$"], "a": 0}, {"q": "If 3 notebooks cost <span class=\"usd\">$<\/span>7.50, how much do 8 notebooks cost, in dollars?", "h": "Find the price of one notebook first.", "s": "$7.50\\div 3=\\$2.50$ each. $8\\times 2.50=\\$20$.", "v": "One notebook costs seven fifty divided by three, which is two dollars fifty. Eight notebooks cost eight times two fifty, which is twenty dollars. The answer is B.", "topic": "Ratios, rates & units", "d": 1, "orig": 2, "test": 10, "o": ["$18$", "$20$", "$22.50$", "$24$"], "a": 1}, {"q": "What is the mode of the data set 4, 7, 7, 2, 9, 7, 4?", "h": "The mode is the value that appears most often.", "s": "7 appears three times — more than any other value. Mode $=7$.", "v": "The mode is the most frequent value. Seven appears three times, four appears twice, and the others once. The mode is seven. The answer is A.", "topic": "Statistics", "d": 1, "orig": 3, "test": 10, "o": ["$7$", "$4$", "$6$", "$9$"], "a": 0}, {"q": "How many minutes are in 2.5 hours?", "h": "1 hour = 60 minutes.", "s": "$2.5\\times 60=150$ minutes.", "v": "Each hour has sixty minutes, so two and a half hours is two point five times sixty, which is one hundred fifty minutes. The answer is C.", "topic": "Ratios, rates & units", "d": 1, "orig": 4, "test": 10, "o": ["$125$", "$250$", "$150$", "$90$"], "a": 2}, {"q": "During a test run, a model train moved at a speed of 153.0 inches per minute. What is this speed in feet per minute? (12 inches = 1 foot)", "h": "Inches → feet: divide by 12.", "s": "$\\dfrac{153.0\\text{ in}}{\\text{min}}\\times\\dfrac{1\\text{ ft}}{12\\text{ in}}=12.75$ ft/min.", "v": "To change inches to feet, divide by twelve. One hundred fifty three divided by twelve is twelve point seven five feet per minute. The answer is twelve point seven five.", "topic": "Ratios, rates & units", "d": 2, "orig": 5, "test": 10, "spr": true, "a": ["12.75", "51/4"]}, {"q": "A fair coin is tossed twice. What is the probability of getting tails both times?", "h": "Independent events: multiply the probabilities.", "s": "$\\dfrac12\\cdot\\dfrac12=\\dfrac14$. (Outcomes HH, HT, TH, TT — only TT works.)", "v": "Each toss gives tails with probability one half, and the tosses are independent, so multiply: one half times one half is one fourth. The answer is C.", "topic": "Probability", "d": 1, "orig": 6, "test": 10, "o": ["$\\dfrac12$", "$\\dfrac13$", "$\\dfrac14$", "$\\dfrac18$"], "a": 2}, {"q": "A <span class=\"usd\">$<\/span>120 jacket is on sale for 30% off. What is the sale price, in dollars?", "h": "30% off means you pay 70%.", "s": "$120\\times 0.70=\\$84$. (<span class=\"usd\">$<\/span>36 is the discount, not the price.)", "v": "Thirty percent off means you pay seventy percent. One hundred twenty times zero point seven is eighty four dollars. Thirty six dollars is the discount, a trap. The answer is B.", "topic": "Percentages", "d": 1, "orig": 7, "test": 10, "o": ["$36$", "$84$", "$90$", "$96$"], "a": 1}, {"q": "Which situation is modeled by exponential growth?", "h": "Exponential means a constant PERCENT change; linear means a constant AMOUNT.", "s": "A 3% increase each year is a constant percent, so exponential growth. The others change by fixed amounts (linear).", "v": "Exponential change happens by the same percent each period. A population increasing three percent each year is exponential growth. The other choices change by fixed amounts, which is linear. The answer is A.", "topic": "Data & scatterplots", "d": 2, "orig": 8, "test": 10, "o": ["A population increases by 3% each year.", "An account gains <span class=\"usd\">$<\/span>50 each month.", "A car loses <span class=\"usd\">$<\/span>1,200 in value each year.", "A tank drains 5 liters per minute."], "a": 0}, {"q": "A student's mean score on 6 tests is 85. The first five scores are 80, 90, 78, 88 and 86. What is the sixth score?", "h": "Total of all 6 scores = mean × 6.", "s": "Total $=6\\times 85=510$. Sixth $=510-(80+90+78+88+86)=510-422=88$.", "v": "Six tests with mean eighty five add up to five hundred ten. The first five add up to four hundred twenty two. Five hundred ten minus four hundred twenty two is eighty eight. The answer is eighty eight.", "topic": "Statistics", "d": 2, "orig": 9, "test": 10, "spr": true, "a": ["88"]}, {"q": "A model car is built at a 1 : 50 scale. The real car is 4.5 meters long. How long is the model, in centimeters?", "h": "Convert meters to centimeters, then divide by 50.", "s": "$4.5$ m $=450$ cm; $450\\div 50=9$ cm.", "v": "Four point five meters is four hundred fifty centimeters. The model is one fiftieth of that: four hundred fifty divided by fifty is nine centimeters. The answer is A.", "topic": "Ratios, rates & units", "d": 2, "orig": 10, "test": 10, "o": ["$9$", "$90$", "$0.9$", "$22.5$"], "a": 0}, {"q": "A printer prints 24 pages per minute. How many seconds does it take to print 60 pages?", "h": "Find the time in minutes first, then convert to seconds.", "s": "$60\\div 24=2.5$ minutes $=2.5\\times 60=150$ seconds.", "v": "Sixty pages at twenty four pages per minute takes two and a half minutes. Two and a half minutes is one hundred fifty seconds. The answer is C.", "topic": "Ratios, rates & units", "d": 2, "orig": 11, "test": 10, "o": ["$60$", "$100$", "$150$", "$240$"], "a": 2}, {"q": "A scatterplot shows 12 data points that rise from left to right. The line of best fit drawn through the points passes through $(0,\\ 3)$ and $(10,\\ 9)$. Which is closest to the slope of the line of best fit?", "h": "Use the two points on the line. Rising data means a positive slope.", "s": "$m=\\dfrac{9-3}{10-0}=0.6$.", "v": "The slope is nine minus three over ten minus zero, which is six tenths. The data rise, so a positive slope makes sense. The answer is B.", "topic": "Data & scatterplots", "d": 2, "orig": 12, "test": 10, "o": ["$-0.6$", "$0.6$", "$6$", "$1.67$"], "a": 1}, {"q": "If 40% of a number is 28, what is the number?", "h": "$0.40n=28$.", "s": "$n=\\dfrac{28}{0.4}=70$.", "v": "Forty percent of n is twenty eight, so zero point four n equals twenty eight. Divide: n is seventy. The answer is seventy.", "topic": "Percentages", "d": 2, "orig": 13, "test": 10, "spr": true, "a": ["70"]}, {"q": "250 customers were asked how they shopped and whether they were satisfied.<table class=\"dt\"><tr><th><\/th><th>Satisfied<\/th><th>Not satisfied<\/th><th>Total<\/th><\/tr><tr><th>Online<\/th><td>90<\/td><td>30<\/td><td>120<\/td><\/tr><tr><th>In store<\/th><td>100<\/td><td>30<\/td><td>130<\/td><\/tr><tr><th>Total<\/th><td>190<\/td><td>60<\/td><td>250<\/td><\/tr><\/table>A customer who was not satisfied is selected at random. What is the probability that the customer shopped online?", "h": "The customer comes from the \"Not satisfied\" column only.", "s": "Of the 60 not-satisfied customers, 30 shopped online: $\\dfrac{30}{60}=\\dfrac12$.", "v": "We choose only among the sixty customers who were not satisfied. Thirty of them shopped online. Thirty over sixty is one half. The answer is B.", "topic": "Probability", "d": 2, "orig": 14, "test": 10, "o": ["$\\dfrac{30}{250}$", "$\\dfrac12$", "$\\dfrac14$", "$\\dfrac{3}{13}$"], "a": 1}, {"q": "250 customers were asked how they shopped and whether they were satisfied.<table class=\"dt\"><tr><th><\/th><th>Satisfied<\/th><th>Not satisfied<\/th><th>Total<\/th><\/tr><tr><th>Online<\/th><td>90<\/td><td>30<\/td><td>120<\/td><\/tr><tr><th>In store<\/th><td>100<\/td><td>30<\/td><td>130<\/td><\/tr><tr><th>Total<\/th><td>190<\/td><td>60<\/td><td>250<\/td><\/tr><\/table>About what percent of in-store customers were satisfied?", "h": "The whole is the In-store row total.", "s": "$\\dfrac{100}{130}\\approx 0.769=76.9\\%$.", "v": "There are one hundred thirty in store customers, and one hundred of them were satisfied. One hundred over one hundred thirty is about seventy six point nine percent. The answer is C.", "topic": "Percentages", "d": 2, "orig": 15, "test": 10, "o": ["$40\\%$", "$52.6\\%$", "$76.9\\%$", "$23.1\\%$"], "a": 2}, {"q": "A car worth <span class=\"usd\">$<\/span>25,000 loses 12% of its value each year. What is its value, in dollars, after 1 year?", "h": "Losing 12% means keeping 88%.", "s": "$25{,}000\\times 0.88=\\$22{,}000$. (Enter 22000 without commas.)", "v": "Losing twelve percent means keeping eighty eight percent. Twenty five thousand times zero point eight eight is twenty two thousand dollars. The answer is twenty two thousand.", "topic": "Percentages", "d": 2, "orig": 16, "test": 10, "spr": true, "a": ["22000"]}, {"q": "In the data set 1, 3, 3, 6, 8, 10, $x$, the value of $x$ is greater than 10. If $x$ is increased, which measure changes?", "h": "Where is $x$ in the sorted list? Which value is the median?", "s": "$x$ stays the largest value, so the median (4th of 7 values) stays 6. But the sum grows, so the mean changes. Mean only.", "v": "Since x is bigger than ten, it stays at the end of the sorted list, and the middle value, the fourth one, stays six. So the median does not change. Increasing x increases the sum, so the mean does change. The answer is A.", "topic": "Statistics", "d": 3, "orig": 17, "test": 10, "o": ["The mean only", "The median only", "Both the mean and the median", "Neither"], "a": 0}, {"q": "100 volunteers were randomly assigned to two groups: one used a new sleep app and the other did not. The app group slept significantly longer. Which conclusion is most appropriate?", "h": "Random ASSIGNMENT allows cause and effect. Random SELECTION from a population is needed to generalize widely.", "s": "Random assignment → we may conclude causation. The volunteers were not randomly selected from all people, so the result applies only to people similar to these volunteers.", "v": "Because the volunteers were randomly assigned to groups, we can conclude that the app causes longer sleep. But the volunteers were not a random sample of everyone, so we can only apply this to people similar to them. The answer is A.", "topic": "Statistics", "d": 3, "orig": 18, "test": 10, "o": ["The app causes longer sleep for people similar to these volunteers.", "The app causes longer sleep for all people.", "No conclusion can be drawn.", "There is only an association; cause and effect cannot be concluded."], "a": 0}, {"q": "At a company, 60% of employees work in the office, and 25% of office workers bike to work. What percent of all employees are office workers who bike to work?", "h": "\"25% of the 60%\": multiply the decimals.", "s": "$0.60\\times 0.25=0.15=15\\%$.", "v": "Twenty five percent of sixty percent is zero point two five times zero point six, which is zero point one five, or fifteen percent. The answer is A.", "topic": "Percentages", "d": 3, "orig": 19, "test": 10, "o": ["$15\\%$", "$25\\%$", "$35\\%$", "$85\\%$"], "a": 0}, {"q": "How many liters of water must be added to 40 liters of a 30% salt solution to make a 20% salt solution?", "h": "The amount of salt does not change when you add water.", "s": "Salt $=0.30\\times 40=12$ L. $12=0.20(40+w) \\Rightarrow 40+w=60 \\Rightarrow w=20$ L.", "v": "The solution contains thirty percent of forty, which is twelve liters of salt. Adding water does not change the salt. For twelve liters to be twenty percent, the total must be sixty liters. So we add twenty liters of water. The answer is B.", "topic": "Percentages", "d": 4, "orig": 20, "test": 10, "o": ["$10$", "$20$", "$30$", "$40$"], "a": 1}, {"q": "The mean of 8 numbers is 15. When two of the numbers are removed, the mean of the remaining 6 numbers is 14. What is the mean of the two numbers that were removed?", "h": "Work with totals: sum = mean × count.", "s": "Total of 8: $8\\times 15=120$. Total of 6: $6\\times 14=84$. Removed sum $=36$, so their mean is $36\\div 2=18$.", "v": "Eight numbers with mean fifteen add up to one hundred twenty. Six numbers with mean fourteen add up to eighty four. The two removed numbers add up to thirty six, so their mean is eighteen. The answer is eighteen.", "topic": "Statistics", "d": 4, "orig": 21, "test": 10, "spr": true, "a": ["18"]}, {"q": "A price is increased by 10%, and then the new price is increased by another 10%. What is the total percent increase?", "h": "Multiply the growth factors: $1.10\\times 1.10$.", "s": "$1.1\\times 1.1=1.21$ → a 21% increase. (The second 10% is taken of a larger price.)", "v": "Each increase multiplies the price by one point one. One point one times one point one is one point two one, which is a twenty one percent increase. It is more than twenty percent because the second increase applies to the larger price. The answer is C.", "topic": "Percentages", "d": 3, "orig": 22, "test": 10, "o": ["$20\\%$", "$22\\%$", "$21\\%$", "$10.5\\%$"], "a": 2}, {"q": "How is 0.35 written as a percent?", "h": "Multiply a decimal by 100 to get a percent.", "s": "$0.35\\times 100=35\\%$.", "v": "To write a decimal as a percent, multiply by one hundred. Zero point three five times one hundred is thirty five percent. The answer is B.", "topic": "Percentages", "d": 1, "orig": 1, "test": 11, "o": ["$3.5\\%$", "$35\\%$", "$0.35\\%$", "$350\\%$"], "a": 1}, {"q": "12 is 30% of what number?", "h": "$0.30n=12$.", "s": "$n=\\dfrac{12}{0.3}=40$.", "v": "Thirty percent of n is twelve, so zero point three n equals twelve. Dividing, n is forty. The answer is C.", "topic": "Percentages", "d": 1, "orig": 2, "test": 11, "o": ["$3.6$", "$36$", "$40$", "$400$"], "a": 2}, {"q": "A runner covers 10 km in 50 minutes. What is the average speed, in km/h?", "h": "Convert 50 minutes to hours first: $\\tfrac{50}{60}$ h.", "s": "50 min $=\\dfrac56$ h. Speed $=10\\div\\dfrac56=12$ km/h.", "v": "Fifty minutes is five sixths of an hour. Ten kilometers divided by five sixths of an hour is twelve kilometers per hour. The answer is A.", "topic": "Ratios, rates & units", "d": 2, "orig": 3, "test": 11, "o": ["$12$", "$5$", "$10$", "$20$"], "a": 0}, {"q": "What is the range of the data set 15, 22, 8, 31, 19?", "h": "Range = largest value − smallest value.", "s": "$31-8=23$.", "v": "The range is the largest value minus the smallest. Thirty one minus eight is twenty three. The answer is B.", "topic": "Statistics", "d": 1, "orig": 4, "test": 11, "o": ["$19$", "$23$", "$31$", "$16$"], "a": 1}, {"q": "Six workers, all working at the same rate, finish a job in 10 days. How many days would 15 workers take?", "h": "Find the total work in worker-days.", "s": "Job $=6\\times 10=60$ worker-days. $60\\div 15=4$ days.", "v": "The job takes six workers times ten days, which is sixty worker days. With fifteen workers it takes sixty divided by fifteen, which is four days. More workers means fewer days. The answer is four.", "topic": "Ratios, rates & units", "d": 2, "orig": 5, "test": 11, "spr": true, "a": ["4"]}, {"q": "A bag holds 4 red balls and 6 blue balls. What is the probability that a randomly drawn ball is blue?", "h": "Favorable ÷ total. How many balls are there in all?", "s": "$\\dfrac{6}{10}=\\dfrac35$.", "v": "There are ten balls and six are blue. Six over ten simplifies to three fifths. The answer is A.", "topic": "Probability", "d": 1, "orig": 6, "test": 11, "o": ["$\\dfrac35$", "$\\dfrac25$", "$\\dfrac23$", "$\\dfrac16$"], "a": 0}, {"q": "If 1 gallon is about 3.785 liters, about how many liters are in 20 gallons?", "h": "Multiply the number of gallons by 3.785.", "s": "$20\\times 3.785=75.7$ liters.", "v": "Each gallon is about three point seven eight five liters. Twenty times that is seventy five point seven liters. The answer is C.", "topic": "Ratios, rates & units", "d": 1, "orig": 7, "test": 11, "o": ["$5.3$", "$23.8$", "$75.7$", "$378.5$"], "a": 2}, {"q": "A monthly salary of <span class=\"usd\">$<\/span>3,000 is raised by 4%. What is the new salary, in dollars?", "h": "Multiply by 1.04.", "s": "$3{,}000\\times 1.04=\\$3{,}120$.", "v": "Raising by four percent means multiplying by one point zero four. Three thousand times one point zero four is three thousand one hundred twenty dollars. The answer is B.", "topic": "Percentages", "d": 1, "orig": 8, "test": 11, "o": ["$3{,}004$", "$3{,}120$", "$3{,}040$", "$3{,}400$"], "a": 1}, {"q": "The probability of an event is 0.35. What is the probability that the event does not occur? (Enter a decimal.)", "h": "P(not A) $=1-$ P(A).", "s": "$1-0.35=0.65$.", "v": "The probability that an event does not happen is one minus the probability that it does. One minus zero point three five is zero point six five. The answer is zero point six five.", "topic": "Probability", "d": 1, "orig": 9, "test": 11, "spr": true, "a": ["0.65", "13/20"]}, {"q": "The line of best fit for practice time ($x$, weeks) and typing speed ($y$, words per minute) is $\\hat y=3.2x+12$. What does 12 represent?", "h": "12 is the $y$-intercept: the predicted $y$ when $x=0$.", "s": "At $x=0$ weeks of practice, the predicted speed is 12 words per minute. (3.2 is the weekly increase.)", "v": "Twelve is the y intercept, the predicted value when x is zero. So it is the predicted typing speed with zero weeks of practice. Three point two is the weekly increase. The answer is A.", "topic": "Data & scatterplots", "d": 1, "orig": 10, "test": 11, "o": ["The predicted typing speed before any practice", "The predicted weekly increase in speed", "The speed after 12 weeks", "The total practice time"], "a": 0}, {"q": "Survey ratings from 20 students:<table class=\"dt\"><tr><th>Rating<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr><tr><th>Number of students<\/th><td>2<\/td><td>5<\/td><td>6<\/td><td>4<\/td><td>3<\/td><\/tr><\/table>What is the median rating?", "h": "With 20 values, the median is the average of the 10th and 11th values. Use running totals.", "s": "Running totals: rating 1 → 2, rating 2 → 7, rating 3 → 13. So the 10th and 11th values are both 3. Median $=3$.", "v": "With twenty ratings, the median is the average of the tenth and eleventh values. Counting up: two students rated one, which brings us to two. Five rated two, bringing us to seven. Six rated three, bringing us to thirteen. So the tenth and eleventh values are both three. The answer is C.", "topic": "Statistics", "d": 2, "orig": 11, "test": 11, "o": ["$2$", "$2.5$", "$3$", "$3.5$"], "a": 2}, {"q": "Survey ratings from 20 students:<table class=\"dt\"><tr><th>Rating<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr><tr><th>Number of students<\/th><td>2<\/td><td>5<\/td><td>6<\/td><td>4<\/td><td>3<\/td><\/tr><\/table>What is the mean rating?", "h": "Multiply each rating by its count, add, then divide by 20.", "s": "$\\dfrac{1\\cdot2+2\\cdot5+3\\cdot6+4\\cdot4+5\\cdot3}{20}=\\dfrac{2+10+18+16+15}{20}=\\dfrac{61}{20}=3.05$.", "v": "Multiply each rating by the number of students: two, ten, eighteen, sixteen and fifteen. Their sum is sixty one. Divide by twenty students: sixty one over twenty is three point zero five. The answer is B.", "topic": "Statistics", "d": 3, "orig": 12, "test": 11, "o": ["$3$", "$3.05$", "$3.2$", "$4$"], "a": 1}, {"q": "A cylindrical water tank is 9 feet tall and holds 1,782 cubic feet of water. What is the volume of the tank, in cubic yards? (1 yard = 3 feet)", "h": "1 cubic yard $=3\\times3\\times3=27$ cubic feet.", "s": "$1$ yd³ $=27$ ft³, so $1{,}782\\div 27=66$ cubic yards. (The height is extra information.)", "v": "A cubic yard is three feet by three feet by three feet, which is twenty seven cubic feet. So divide one thousand seven hundred eighty two by twenty seven to get sixty six cubic yards. The height of nine feet is not needed. The answer is sixty six.", "topic": "Ratios, rates & units", "d": 3, "orig": 13, "test": 11, "spr": true, "a": ["66"]}, {"q": "After a 25% discount an item costs <span class=\"usd\">$<\/span>45. What was the original price, in dollars?", "h": "After 25% off, you pay 75% of the original: $0.75p=45$.", "s": "$0.75p=45 \\Rightarrow p=60$. (Adding 25% to <span class=\"usd\">$<\/span>45 gives the wrong answer 56.25.)", "v": "After a twenty five percent discount, the price is seventy five percent of the original. So zero point seven five p equals forty five, and p is sixty dollars. Adding twenty five percent to forty five is a trap. The answer is B.", "topic": "Percentages", "d": 2, "orig": 14, "test": 11, "o": ["$56.25$", "$60$", "$70$", "$33.75$"], "a": 1}, {"q": "200 patients were randomly assigned to two groups: one received drug A and the other a placebo.<table class=\"dt\"><tr><th><\/th><th>Drug A<\/th><th>Placebo<\/th><th>Total<\/th><\/tr><tr><th>Recovered<\/th><td>66<\/td><td>40<\/td><td>106<\/td><\/tr><tr><th>Did not recover<\/th><td>34<\/td><td>60<\/td><td>94<\/td><\/tr><tr><th>Total<\/th><td>100<\/td><td>100<\/td><td>200<\/td><\/tr><\/table>A patient who recovered is selected at random. About what is the probability the patient received drug A?", "h": "The patient comes from the \"Recovered\" row only (106 patients).", "s": "$\\dfrac{66}{106}\\approx 0.623$. (0.66 would be \"a drug-A patient recovered\".)", "v": "We choose among the one hundred six patients who recovered. Sixty six of them received drug A. Sixty six divided by one hundred six is about zero point six two three. The answer is C.", "topic": "Probability", "d": 3, "orig": 15, "test": 11, "o": ["$0.66$", "$0.33$", "$0.623$", "$0.53$"], "a": 2}, {"q": "200 patients were randomly assigned to two groups: one received drug A and the other a placebo.<table class=\"dt\"><tr><th><\/th><th>Drug A<\/th><th>Placebo<\/th><th>Total<\/th><\/tr><tr><th>Recovered<\/th><td>66<\/td><td>40<\/td><td>106<\/td><\/tr><tr><th>Did not recover<\/th><td>34<\/td><td>60<\/td><td>94<\/td><\/tr><tr><th>Total<\/th><td>100<\/td><td>100<\/td><td>200<\/td><\/tr><\/table>What fraction of the placebo patients recovered? (Enter a decimal.)", "h": "The whole is the Placebo column total.", "s": "$\\dfrac{40}{100}=0.4$.", "v": "There were one hundred placebo patients and forty of them recovered. Forty over one hundred is zero point four. The answer is zero point four.", "topic": "Probability", "d": 2, "orig": 16, "test": 11, "spr": true, "a": ["0.4", "2/5"]}, {"q": "Which sample is most appropriate for estimating the average screen time of teenagers in a city?", "h": "Look for a RANDOM sample drawn from the WHOLE population of interest.", "s": "Only choice A selects teens at random from the whole city. The others are biased (gaming club, volunteers, one mall).", "v": "A good sample is chosen at random from the whole population. Choosing three hundred teens at random from the enrollment lists of all city high schools does that. A gaming club, people answering an ad, or one mall would all be biased. The answer is A.", "topic": "Statistics", "d": 2, "orig": 17, "test": 11, "o": ["300 teens chosen at random from the enrollment lists of all high schools in the city", "Members of a gaming club", "Teens who answer an online ad", "Teens interviewed at one shopping mall on a Saturday"], "a": 0}, {"q": "Data sets X and Y have the same mean; X has a standard deviation of 2 and Y has a standard deviation of 8. Which statement is true?", "h": "Standard deviation measures spread around the mean.", "s": "A larger standard deviation means the values are farther from the mean, so Y (SD 8) is more spread out.", "v": "Standard deviation measures how spread out the values are from the mean. Y has the larger standard deviation, eight, so its values are spread farther from the mean. The answer is B.", "topic": "Statistics", "d": 2, "orig": 18, "test": 11, "o": ["The values in X are more spread out.", "The values in Y are spread farther from the mean.", "X has a larger mean.", "Y has a larger median."], "a": 1}, {"q": "The positive number $p$ is 2,500% of the sum of the positive numbers $q$ and $r$, and $q$ is 50% of $r$. What percent of $q$ is $p$?", "h": "2,500% $=25$. Write $r$ in terms of $q$.", "s": "$q=0.5r \\Rightarrow r=2q$. $p=25(q+r)=25(3q)=75q=7{,}500\\%$ of $q$.", "v": "Two thousand five hundred percent means twenty five times. Since q is half of r, r is two q. So p equals twenty five times q plus two q, which is twenty five times three q, or seventy five q. Seventy five times is seven thousand five hundred percent. The answer is B.", "topic": "Percentages", "d": 4, "orig": 19, "test": 11, "o": ["$75\\%$", "$7{,}500\\%$", "$3{,}750\\%$", "$5{,}000\\%$"], "a": 1}, {"q": "In a class, the ratio of students who passed to students who failed is 7 : 2. If 6 of the students who failed had passed instead, the ratio would be 17 : 1. How many students are in the class?", "h": "Let passed $=7k$ and failed $=2k$. Then move 6 students from \"failed\" to \"passed\".", "s": "$\\dfrac{7k+6}{2k-6}=17 \\Rightarrow 7k+6=34k-102 \\Rightarrow 27k=108 \\Rightarrow k=4$. Total $=9k=36$.<br>Check: 28 : 8 → 34 : 2 $=17:1$ ✓.", "v": "Let the passed students be seven k and the failed ones two k. If six more pass, we get seven k plus six over two k minus six equals seventeen. Then seven k plus six equals thirty four k minus one hundred two, so twenty seven k is one hundred eight and k is four. The class has nine k, which is thirty six students. The answer is C.", "topic": "Ratios, rates & units", "d": 4, "orig": 20, "test": 11, "o": ["$27$", "$45$", "$36$", "$54$"], "a": 2}, {"q": "Class A (20 students) has a mean score of 72, and class B (30 students) has a mean score of 82. What is the combined mean of the two classes?", "h": "Combined mean = total of all scores ÷ total students. Don't just average 72 and 82.", "s": "$\\dfrac{20\\cdot 72+30\\cdot 82}{50}=\\dfrac{1{,}440+2{,}460}{50}=\\dfrac{3{,}900}{50}=78$.", "v": "Class A's scores add up to twenty times seventy two, which is one thousand four hundred forty. Class B's add up to thirty times eighty two, which is two thousand four hundred sixty. Together that is three thousand nine hundred, over fifty students, which is seventy eight. The answer is seventy eight.", "topic": "Statistics", "d": 3, "orig": 21, "test": 11, "spr": true, "a": ["78"]}, {"q": "The heights, in centimeters, of 9 plants in an experiment were 20, 22, 24, 25, 27, 27, 27, 30 and 52. The height 52 cm is removed to create a data set of 8 heights. Which statements must be true?<br>I. The mean of the new data set is less than the mean of the original data set.<br>II. The median of the new data set is less than the median of the original data set.", "h": "52 is far above the mean. For the median, find the middle value(s) before and after.", "s": "I: removing a value above the mean lowers the mean — true.<br>II: original median = 5th value = 27. New median = average of 4th and 5th of 8 values $=\\dfrac{25+27}{2}=26\\lt 27$ — true. Both.", "v": "Statement one: fifty two is far above the mean, so removing it lowers the mean. True. Statement two: the original median is the fifth of nine values, twenty seven. After removing fifty two, there are eight values, and the median is the average of the fourth and fifth, twenty five and twenty seven, which is twenty six. That is less than twenty seven. True. The answer is C.", "topic": "Statistics", "d": 5, "orig": 22, "test": 11, "o": ["I only", "II only", "I and II", "Neither I nor II"], "a": 2}, {"q": "Two angles are supplementary, and one measures 65°. What is the measure of the other?", "h": "Supplementary angles add up to 180°.", "s": "$180^\\circ-65^\\circ=115^\\circ$. (25° would be the complement.)", "v": "Supplementary angles add up to one hundred eighty degrees. One hundred eighty minus sixty five is one hundred fifteen degrees. The answer is B.", "topic": "Lines, angles & triangles", "d": 1, "orig": 1, "test": 12, "o": ["$25^\\circ$", "$115^\\circ$", "$125^\\circ$", "$295^\\circ$"], "a": 1}, {"q": "A right triangle has legs of length 2.8 and 4.5. The hypotenuse has length $x$. Between which two consecutive integers is $x$?", "h": "Pythagorean theorem: $x^2=a^2+b^2$.", "s": "$x^2=2.8^2+4.5^2=7.84+20.25=28.09 \\Rightarrow x=5.3$, between 5 and 6.", "v": "By the Pythagorean theorem, x squared is two point eight squared plus four point five squared, which is seven point eight four plus twenty point two five, or twenty eight point zero nine. The square root is five point three, which is between five and six. Twenty eight and twenty nine is the trap: that is x squared. The answer is C.", "topic": "Right triangles & trigonometry", "d": 2, "orig": 2, "test": 12, "o": ["2 and 3", "7 and 8", "5 and 6", "28 and 29"], "a": 2}, {"q": "What is the area of a circle with radius 5?", "h": "$A=\\pi r^2$.", "s": "$A=\\pi(5^2)=25\\pi$. ($10\\pi$ is the circumference.)", "v": "The area of a circle is pi r squared. Five squared is twenty five, so the area is twenty five pi. Ten pi would be the circumference. The answer is A.", "topic": "Circles", "d": 1, "orig": 3, "test": 12, "o": ["$25\\pi$", "$10\\pi$", "$5\\pi$", "$100\\pi$"], "a": 0}, {"q": "In triangle JKL, the measure of $\\angle J$ is 53° and the measure of $\\angle K$ is 71°. What is the measure of $\\angle L$?", "h": "The angles of a triangle add up to 180°.", "s": "$180^\\circ-53^\\circ-71^\\circ=56^\\circ$.", "v": "The three angles of a triangle add to one hundred eighty degrees. One hundred eighty minus fifty three minus seventy one is fifty six degrees. The answer is B.", "topic": "Lines, angles & triangles", "d": 1, "orig": 4, "test": 12, "o": ["$46^\\circ$", "$56^\\circ$", "$124^\\circ$", "$236^\\circ$"], "a": 1}, {"q": "What is the volume, in cm³, of a rectangular prism measuring 4 cm by 5 cm by 6 cm?", "h": "$V=\\ell\\cdot w\\cdot h$.", "s": "$V=4\\cdot 5\\cdot 6=120$ cm³.", "v": "The volume of a rectangular prism is length times width times height. Four times five times six is one hundred twenty cubic centimeters. The answer is one hundred twenty.", "topic": "Area & volume", "d": 1, "orig": 5, "test": 12, "spr": true, "a": ["120"]}, {"q": "Two lines intersect. One pair of vertical angles measures $(2x+15)^\\circ$ and $55^\\circ$. What is the value of $x$?", "h": "Vertical angles are equal.", "s": "$2x+15=55 \\Rightarrow 2x=40 \\Rightarrow x=20$.", "v": "Vertical angles are equal, so two x plus fifteen equals fifty five. Then two x is forty, and x is twenty. The answer is A.", "topic": "Lines, angles & triangles", "d": 1, "orig": 6, "test": 12, "o": ["$20$", "$35$", "$55$", "$70$"], "a": 0}, {"q": "The measure of angle M is 60°. What is the measure of angle M in radians?", "h": "Multiply degrees by $\\dfrac{\\pi}{180}$.", "s": "$60\\cdot\\dfrac{\\pi}{180}=\\dfrac{\\pi}{3}$.", "v": "To convert degrees to radians, multiply by pi over one hundred eighty. Sixty times pi over one hundred eighty is one third pi. The answer is B.", "topic": "Circles", "d": 2, "orig": 7, "test": 12, "o": ["$\\dfrac16\\pi$", "$\\dfrac13\\pi$", "$\\dfrac12\\pi$", "$\\dfrac23\\pi$"], "a": 1}, {"q": "What are the center and radius of the circle $(x-1)^2+(y+3)^2=49$?", "h": "$(x-h)^2+(y-k)^2=r^2$ has center $(h,\\ k)$ and radius $r$ — not $r^2$.", "s": "$h=1$, $k=-3$, $r=\\sqrt{49}=7$. Center $(1,\\ -3)$, radius 7.", "v": "In the form x minus h squared plus y minus k squared equals r squared, the center is h, k. Here h is one and k is negative three. The radius is the square root of forty nine, which is seven. The answer is A.", "topic": "Circles", "d": 2, "orig": 8, "test": 12, "o": ["$(1,\\ -3)$; 7", "$(-1,\\ 3)$; 7", "$(1,\\ -3)$; 49", "$(-1,\\ 3)$; 49"], "a": 0}, {"q": "The hypotenuse of a 45-45-90 triangle is $8\\sqrt2$. What is the length of one leg?", "h": "In a 45-45-90 triangle, hypotenuse $=$ leg $\\times\\sqrt2$.", "s": "leg $=\\dfrac{8\\sqrt2}{\\sqrt2}=8$.", "v": "In a forty five forty five ninety triangle, the hypotenuse is the leg times root two. So the leg is eight root two divided by root two, which is eight. The answer is eight.", "topic": "Right triangles & trigonometry", "d": 2, "orig": 9, "test": 12, "spr": true, "a": ["8"]}, {"q": "What is the volume of a cylinder with radius 2 and height 5?", "h": "$V=\\pi r^2h$.", "s": "$V=\\pi\\cdot 2^2\\cdot 5=20\\pi$.", "v": "The volume of a cylinder is pi r squared h. Two squared is four, times five is twenty, so the volume is twenty pi. The answer is B.", "topic": "Area & volume", "d": 1, "orig": 10, "test": 12, "o": ["$10\\pi$", "$20\\pi$", "$40\\pi$", "$4\\pi$"], "a": 1}, {"q": "Two similar triangles have a scale factor of $1:3$. The smaller triangle's perimeter is 12. What is the larger triangle's perimeter?", "h": "Perimeters scale by the same factor as side lengths (areas scale by its square).", "s": "$12\\times 3=36$. (108 would use the area factor 9.)", "v": "Perimeter is a length, so it scales by the same factor, three. Twelve times three is thirty six. The answer is C.", "topic": "Lines, angles & triangles", "d": 2, "orig": 11, "test": 12, "o": ["$4$", "$24$", "$36$", "$108$"], "a": 2}, {"q": "In a right triangle, acute angle $x$ has $\\cos x=0.6$. What is $\\sin(90^\\circ-x)$?", "h": "Complementary angles: $\\sin(90^\\circ-x)=\\cos x$.", "s": "$\\sin(90^\\circ-x)=\\cos x=0.6$.", "v": "The sine of an angle equals the cosine of its complement. So sine of ninety degrees minus x equals cosine x, which is zero point six. The answer is B.", "topic": "Right triangles & trigonometry", "d": 2, "orig": 12, "test": 12, "o": ["$0.4$", "$0.6$", "$0.8$", "$1.6$"], "a": 1}, {"q": "In a circle of radius 12, a 60° central angle subtends an arc of length $k\\pi$. What is the value of $k$?", "h": "Arc length $=\\dfrac{\\theta}{360}\\cdot 2\\pi r$.", "s": "$\\dfrac{60}{360}\\cdot 2\\pi(12)=\\dfrac16\\cdot 24\\pi=4\\pi \\Rightarrow k=4$.", "v": "The circumference is two pi times twelve, which is twenty four pi. Sixty degrees is one sixth of the circle, so the arc is one sixth of twenty four pi, which is four pi. So k is four. The answer is four.", "topic": "Circles", "d": 2, "orig": 13, "test": 12, "spr": true, "a": ["4"]}, {"q": "The vertex angle of an isosceles triangle is 40°. What is the measure of each base angle?", "h": "The two base angles are equal and share what is left of 180°.", "s": "$\\dfrac{180^\\circ-40^\\circ}{2}=70^\\circ$.", "v": "The two base angles are equal. Together they make one hundred eighty minus forty, which is one hundred forty degrees. Each one is seventy degrees. The answer is C.", "topic": "Lines, angles & triangles", "d": 2, "orig": 14, "test": 12, "o": ["$40^\\circ$", "$50^\\circ$", "$70^\\circ$", "$140^\\circ$"], "a": 2}, {"q": "What is the area of a square whose diagonal is 10?", "h": "Side $=\\dfrac{d}{\\sqrt2}$, or use Area $=\\dfrac{d^2}{2}$.", "s": "Area $=\\dfrac{d^2}{2}=\\dfrac{100}{2}=50$. (Side $=5\\sqrt2$, and $(5\\sqrt2)^2=50$.)", "v": "The side of the square is ten over root two, which is five root two. Squaring gives fifty. A quick formula: the area of a square is its diagonal squared over two, one hundred over two, which is fifty. The answer is A.", "topic": "Area & volume", "d": 3, "orig": 15, "test": 12, "o": ["$50$", "$100$", "$25$", "$10\\sqrt2$"], "a": 0}, {"q": "What is the volume of a cone with base radius 3 and height 4?", "h": "$V=\\dfrac13\\pi r^2h$.", "s": "$V=\\dfrac13\\pi\\cdot 9\\cdot 4=12\\pi$.", "v": "The volume of a cone is one third pi r squared h. Three squared is nine, times four is thirty six, and one third of that is twelve. So the volume is twelve pi. The answer is B.", "topic": "Area & volume", "d": 2, "orig": 16, "test": 12, "o": ["$36\\pi$", "$12\\pi$", "$4\\pi$", "$48\\pi$"], "a": 1}, {"q": "A circle with center $(1,\\ 2)$ passes through $(4,\\ 6)$. What is its radius?", "h": "The radius is the distance from the center to the point.", "s": "$r=\\sqrt{(4-1)^2+(6-2)^2}=\\sqrt{9+16}=5$.", "v": "The radius is the distance from the center to the point. The horizontal change is three and the vertical change is four. The square root of nine plus sixteen is five. The answer is C.", "topic": "Circles", "d": 2, "orig": 17, "test": 12, "o": ["$3$", "$4$", "$5$", "$25$"], "a": 2}, {"q": "Two parallel lines are cut by a transversal. The same-side interior angles measure $(4x+20)^\\circ$ and $(2x+40)^\\circ$. What is the value of $x$?", "h": "Same-side interior angles are supplementary (they add to 180°).", "s": "$(4x+20)+(2x+40)=180 \\Rightarrow 6x+60=180 \\Rightarrow x=20$.", "v": "Same side interior angles add to one hundred eighty degrees. Four x plus twenty plus two x plus forty is six x plus sixty, which equals one hundred eighty. So six x is one hundred twenty, and x is twenty. The answer is twenty.", "topic": "Lines, angles & triangles", "d": 3, "orig": 18, "test": 12, "spr": true, "a": ["20"]}, {"q": "A ramp rises 3 feet over a horizontal distance of 12 feet. If $\\theta$ is the angle the ramp makes with the ground, what is $\\tan\\theta$?", "h": "$\\tan\\theta=\\dfrac{\\text{opposite}}{\\text{adjacent}}$.", "s": "Opposite $=3$ (rise), adjacent $=12$ (run): $\\tan\\theta=\\dfrac{3}{12}=\\dfrac14$.", "v": "Tangent is opposite over adjacent. The rise, three, is opposite the angle, and the horizontal distance, twelve, is adjacent. Three over twelve is one fourth. The answer is A.", "topic": "Right triangles & trigonometry", "d": 2, "orig": 19, "test": 12, "o": ["$\\dfrac14$", "$4$", "$\\dfrac{3}{\\sqrt{153}}$", "$\\dfrac{12}{\\sqrt{153}}$"], "a": 0}, {"q": "What is the radius of the circle $x^2+y^2+4x-10y=-20$?", "h": "Complete the square for $x$ and for $y$ — add the same numbers to the right side.", "s": "$(x^2+4x+4)+(y^2-10y+25)=-20+4+25 \\Rightarrow (x+2)^2+(y-5)^2=9 \\Rightarrow r=3$.", "v": "Complete the square. For x, add four. For y, add twenty five. Add the same to the right side: negative twenty plus four plus twenty five is nine. So x plus two squared plus y minus five squared equals nine, and the radius is the square root of nine, which is three. The answer is C.", "topic": "Circles", "d": 4, "orig": 20, "test": 12, "o": ["$9$", "$\\sqrt{20}$", "$3$", "$7$"], "a": 2}, {"q": "A sphere has a volume of $288\\pi$ cm³. What is its diameter, in cm?", "h": "$V=\\dfrac43\\pi r^3$. Solve for $r$, then double it.", "s": "$\\dfrac43\\pi r^3=288\\pi \\Rightarrow r^3=216 \\Rightarrow r=6$. Diameter $=12$ cm.", "v": "The volume of a sphere is four thirds pi r cubed. Set it equal to two hundred eighty eight pi: r cubed is two hundred eighty eight times three fourths, which is two hundred sixteen. So r is six, and the diameter is twelve centimeters. The answer is twelve.", "topic": "Area & volume", "d": 3, "orig": 21, "test": 12, "spr": true, "a": ["12"]}, {"q": "In triangle ABC, angle C is a right angle, $\\sin A=\\dfrac{5}{13}$ and $AB=26$. What is the length of $AC$?", "h": "$AB$ is the hypotenuse. $\\sin A=\\dfrac{BC}{AB}$. Then use Pythagoras for $AC$.", "s": "$BC=26\\cdot\\dfrac{5}{13}=10$. $AC=\\sqrt{26^2-10^2}=\\sqrt{576}=24$. (A 5-12-13 triangle scaled by 2.)", "v": "Angle C is the right angle, so AB is the hypotenuse. Sine A is opposite over hypotenuse, so BC is twenty six times five thirteenths, which is ten. Then AC is the square root of twenty six squared minus ten squared, which is the square root of five hundred seventy six, or twenty four. It is a five twelve thirteen triangle doubled. The answer is C.", "topic": "Right triangles & trigonometry", "d": 4, "orig": 22, "test": 12, "o": ["$10$", "$12$", "$24$", "$13$"], "a": 2}, {"q": "What is the complement of a 35° angle?", "h": "Complementary angles add up to 90°.", "s": "$90^\\circ-35^\\circ=55^\\circ$. (145° is the supplement.)", "v": "Complementary angles add to ninety degrees. Ninety minus thirty five is fifty five degrees. The answer is A.", "topic": "Lines, angles & triangles", "d": 1, "orig": 1, "test": 13, "o": ["$55^\\circ$", "$145^\\circ$", "$65^\\circ$", "$35^\\circ$"], "a": 0}, {"q": "What is the area of a rectangle with sides 7 and 4?", "h": "Area = length × width.", "s": "$7\\times 4=28$. (22 is the perimeter.)", "v": "The area of a rectangle is length times width. Seven times four is twenty eight. Twenty two would be the perimeter. The answer is C.", "topic": "Area & volume", "d": 1, "orig": 2, "test": 13, "o": ["$11$", "$22$", "$28$", "$56$"], "a": 2}, {"q": "What is the circumference of a circle with diameter 10?", "h": "$C=\\pi d$.", "s": "$C=\\pi\\cdot 10=10\\pi$.", "v": "The circumference is pi times the diameter. Pi times ten is ten pi. The answer is B.", "topic": "Circles", "d": 1, "orig": 3, "test": 13, "o": ["$5\\pi$", "$10\\pi$", "$25\\pi$", "$100\\pi$"], "a": 1}, {"q": "What is the measure of each interior angle of an equilateral triangle?", "h": "Three equal angles share 180°.", "s": "$180^\\circ\\div 3=60^\\circ$.", "v": "An equilateral triangle has three equal angles that add to one hundred eighty degrees. Each one is sixty degrees. The answer is A.", "topic": "Lines, angles & triangles", "d": 1, "orig": 4, "test": 13, "o": ["$60^\\circ$", "$45^\\circ$", "$90^\\circ$", "$180^\\circ$"], "a": 0}, {"q": "The hypotenuse of a right triangle is 13 and one leg is 5. What is the length of the other leg?", "h": "$b=\\sqrt{c^2-a^2}$.", "s": "$\\sqrt{13^2-5^2}=\\sqrt{169-25}=\\sqrt{144}=12$.", "v": "Use the Pythagorean theorem. Thirteen squared minus five squared is one hundred sixty nine minus twenty five, which is one hundred forty four. The square root is twelve. The answer is twelve.", "topic": "Right triangles & trigonometry", "d": 1, "orig": 5, "test": 13, "spr": true, "a": ["12"]}, {"q": "What is $\\tan 45^\\circ$?", "h": "In a 45-45-90 triangle the two legs are equal.", "s": "Opposite = adjacent in a 45-45-90 triangle, so $\\tan 45^\\circ=1$.", "v": "In a forty five forty five ninety triangle, the opposite and adjacent legs are equal. So tangent of forty five degrees is one. The answer is C.", "topic": "Right triangles & trigonometry", "d": 1, "orig": 6, "test": 13, "o": ["$0$", "$\\dfrac12$", "$1$", "$\\sqrt2$"], "a": 2}, {"q": "An exterior angle of a triangle measures 140°, and one remote interior angle measures 70°. What is the other remote interior angle?", "h": "An exterior angle equals the sum of the two remote interior angles.", "s": "$140^\\circ-70^\\circ=70^\\circ$.", "v": "An exterior angle of a triangle equals the sum of the two remote interior angles. So the other angle is one hundred forty minus seventy, which is seventy degrees. The answer is B.", "topic": "Lines, angles & triangles", "d": 2, "orig": 7, "test": 13, "o": ["$40^\\circ$", "$70^\\circ$", "$110^\\circ$", "$140^\\circ$"], "a": 1}, {"q": "What is the center of the circle $(x+4)^2+(y-1)^2=25$?", "h": "The center $(h,\\ k)$ comes from $(x-h)$ and $(y-k)$. Flip the signs inside.", "s": "$(x+4)=(x-(-4)) \\Rightarrow h=-4$; $(y-1) \\Rightarrow k=1$. Center $(-4,\\ 1)$.", "v": "x plus four is x minus negative four, so h is negative four. y minus one gives k equals one. The center is negative four, one. The answer is C.", "topic": "Circles", "d": 1, "orig": 8, "test": 13, "o": ["$(4,\\ -1)$", "$(4,\\ 1)$", "$(-4,\\ 1)$", "$(-4,\\ -1)$"], "a": 2}, {"q": "In the $xy$-plane, the graph of $(x-2)^2+(y+4)^2=81$ is a circle. The point $(11,\\ c)$, where $c$ is a constant, lies on this circle. What is the value of $c$?", "h": "Substitute $x=11$ and solve for $c$.", "s": "$(11-2)^2+(c+4)^2=81 \\Rightarrow 81+(c+4)^2=81 \\Rightarrow (c+4)^2=0 \\Rightarrow c=-4$.", "v": "Put eleven in for x. Eleven minus two is nine, and nine squared is eighty one. So eighty one plus c plus four squared equals eighty one, meaning c plus four squared is zero. So c is negative four. The point is the rightmost point of the circle. The answer is negative four.", "topic": "Circles", "d": 3, "orig": 9, "test": 13, "spr": true, "a": ["-4"]}, {"q": "The short leg of a 30-60-90 triangle is 4. What is the hypotenuse?", "h": "Sides of a 30-60-90 triangle: $x,\\ x\\sqrt3,\\ 2x$.", "s": "Hypotenuse $=2\\times 4=8$. ($4\\sqrt3$ is the long leg.)", "v": "In a thirty sixty ninety triangle, the hypotenuse is twice the short leg. Two times four is eight. Four root three is the long leg. The answer is B.", "topic": "Right triangles & trigonometry", "d": 2, "orig": 10, "test": 13, "o": ["$4\\sqrt3$", "$8$", "$4\\sqrt2$", "$12$"], "a": 1}, {"q": "What is the area of a 90° sector of a circle with radius 10?", "h": "A 90° sector is one quarter of the circle.", "s": "$\\dfrac{90}{360}\\cdot\\pi(10)^2=\\dfrac14\\cdot 100\\pi=25\\pi$.", "v": "Ninety degrees is one quarter of the full circle. The full area is pi times ten squared, which is one hundred pi. One quarter of that is twenty five pi. The answer is A.", "topic": "Circles", "d": 2, "orig": 11, "test": 13, "o": ["$25\\pi$", "$50\\pi$", "$100\\pi$", "$5\\pi$"], "a": 0}, {"q": "If $0\\lt x\\lt 90$ and $\\cos x^\\circ=\\sin 35^\\circ$, what is $x$?", "h": "$\\cos x^\\circ=\\sin(90^\\circ-x^\\circ)$.", "s": "$\\sin 35^\\circ=\\cos(90^\\circ-35^\\circ)=\\cos 55^\\circ$, so $x=55$.", "v": "The sine of an angle equals the cosine of its complement. Sine of thirty five degrees equals cosine of fifty five degrees, so x is fifty five. The answer is B.", "topic": "Right triangles & trigonometry", "d": 2, "orig": 12, "test": 13, "o": ["$35$", "$55$", "$65$", "$145$"], "a": 1}, {"q": "A triangle with sides 6, 8 and 10 is similar to a triangle whose longest side is 25. What is the shortest side of the larger triangle?", "h": "Find the scale factor from the longest sides.", "s": "Scale factor $=\\dfrac{25}{10}=2.5$. Shortest side $=6\\times 2.5=15$.", "v": "The longest sides are ten and twenty five, so the scale factor is two point five. The shortest side, six, becomes six times two point five, which is fifteen. The answer is fifteen.", "topic": "Lines, angles & triangles", "d": 2, "orig": 13, "test": 13, "spr": true, "a": ["15"]}, {"q": "An inscribed angle in a circle measures 35°. What is the central angle that subtends the same arc?", "h": "A central angle is twice an inscribed angle on the same arc.", "s": "$2\\times 35^\\circ=70^\\circ$.", "v": "A central angle is twice any inscribed angle that intercepts the same arc. Two times thirty five is seventy degrees. The answer is C.", "topic": "Circles", "d": 2, "orig": 14, "test": 13, "o": ["$17.5^\\circ$", "$35^\\circ$", "$70^\\circ$", "$145^\\circ$"], "a": 2}, {"q": "The height of a right circular cylinder is 9 centimeters, and the circumference of its base is 80 centimeters. Which expression represents the total surface area, in square centimeters, of the cylinder?", "h": "Total surface area = lateral area (circumference × height) + TWO circular bases. Find $r$ from $2\\pi r=80$.", "s": "$2\\pi r=80 \\Rightarrow r=\\dfrac{40}{\\pi}$. Lateral area $=80\\cdot 9$; two bases $=2\\pi\\left(\\dfrac{40}{\\pi}\\right)^2$. Total $=(9)(80)+2\\pi\\left(\\dfrac{40}{\\pi}\\right)^2$.", "v": "The side of the cylinder unrolls into a rectangle, circumference times height, which is nine times eighty. From two pi r equals eighty, the radius is forty over pi. There are two circular bases, each with area pi times forty over pi squared. So the total is nine times eighty plus two pi times forty over pi squared. Choice D forgets one base, and choice B is the volume. The answer is C.", "topic": "Area & volume", "d": 4, "orig": 15, "test": 13, "o": ["$(9)(80)$", "$\\pi\\left(\\dfrac{40}{\\pi}\\right)^2(9)$", "$(9)(80)+2\\pi\\left(\\dfrac{40}{\\pi}\\right)^2$", "$(9)(80)+\\pi\\left(\\dfrac{40}{\\pi}\\right)^2$"], "a": 2}, {"q": "What is the area of a triangle with base 12 and height 7?", "h": "$A=\\dfrac12bh$.", "s": "$\\dfrac12(12)(7)=42$.", "v": "The area of a triangle is one half base times height. One half of twelve times seven is forty two. The answer is B.", "topic": "Area & volume", "d": 1, "orig": 16, "test": 13, "o": ["$84$", "$42$", "$19$", "$21$"], "a": 1}, {"q": "A right triangle has a hypotenuse of 10 and an acute angle of 40°. To the nearest hundredth, what is the length of the side opposite the 40° angle?", "h": "$\\sin 40^\\circ=\\dfrac{\\text{opposite}}{\\text{hypotenuse}}$. Calculator in degree mode.", "s": "Opposite $=10\\sin 40^\\circ\\approx 10(0.6428)=6.43$. (7.66 is the adjacent side, $10\\cos 40^\\circ$.)", "v": "Sine is opposite over hypotenuse, so the opposite side is ten times sine forty degrees. Sine forty degrees is about zero point six four two eight, so the side is about six point four three. Seven point six six would be the adjacent side. The answer is A.", "topic": "Right triangles & trigonometry", "d": 3, "orig": 17, "test": 13, "o": ["$6.43$", "$7.66$", "$8.39$", "$11.92$"], "a": 0}, {"q": "In a circle of radius 4, an arc of length 6 subtends a central angle of how many radians?", "h": "Radian measure $\\theta=\\dfrac{s}{r}$ (arc length ÷ radius).", "s": "$\\theta=\\dfrac sr=\\dfrac64=1.5$ radians.", "v": "In radians, the angle equals arc length divided by radius. Six divided by four is one point five radians. The answer is one point five.", "topic": "Circles", "d": 3, "orig": 18, "test": 13, "spr": true, "a": ["1.5", "3/2"]}, {"q": "Where is the point $(2,\\ -1)$ relative to the circle $x^2+y^2=4$?", "h": "Compare $x^2+y^2$ for the point with $r^2=4$.", "s": "$2^2+(-1)^2=5\\gt 4$, so the point is outside the circle.", "v": "For the point two, negative one, x squared plus y squared is four plus one, which is five. That is more than four, the radius squared, so the point is farther from the center than the radius. It is outside. The answer is C.", "topic": "Circles", "d": 3, "orig": 19, "test": 13, "o": ["Inside", "On the circle", "Outside", "At the center"], "a": 2}, {"q": "Two similar cylinders have radii in the ratio $2:5$. The smaller cylinder has volume $16\\pi$. What is the volume of the larger cylinder?", "h": "For similar solids, volumes scale by the CUBE of the length ratio.", "s": "Volume ratio $=\\left(\\dfrac52\\right)^3=\\dfrac{125}{8}$. $16\\pi\\cdot\\dfrac{125}{8}=250\\pi$.", "v": "Similar solids have volumes in the ratio of the cube of their lengths. Five halves cubed is one hundred twenty five eighths. Sixteen pi times one hundred twenty five over eight is two hundred fifty pi. The answer is B.", "topic": "Area & volume", "d": 4, "orig": 20, "test": 13, "o": ["$40\\pi$", "$250\\pi$", "$100\\pi$", "$400\\pi$"], "a": 1}, {"q": "In triangle ABC, D is on $\\overline{AB}$ and E is on $\\overline{AC}$ with $DE \\parallel BC$. If $AD=x$, $DB=6$, $AE=4$ and $EC=8$, what is the value of $x$?", "h": "A line parallel to one side divides the other two sides proportionally: $\\dfrac{AD}{DB}=\\dfrac{AE}{EC}$.", "s": "$\\dfrac x6=\\dfrac48 \\Rightarrow x=3$.", "v": "Because D E is parallel to B C, it cuts the two sides in the same ratio. So x over six equals four over eight, which is one half. Then x is three. The answer is three.", "topic": "Lines, angles & triangles", "d": 3, "orig": 21, "test": 13, "spr": true, "a": ["3"]}, {"q": "A circle with center $(3,\\ -2)$ is tangent to the $x$-axis. What is its equation?", "h": "Tangent to the $x$-axis means the radius equals the distance from the center to the $x$-axis: $|y|$.", "s": "The center is 2 units below the $x$-axis, so $r=2$ and $r^2=4$: $(x-3)^2+(y+2)^2=4$.", "v": "A circle tangent to the x axis just touches it, so the radius is the distance from the center to the axis. The center's y coordinate is negative two, so the radius is two and r squared is four. The center three, negative two gives x minus three squared plus y plus two squared. The answer is A.", "topic": "Circles", "d": 4, "orig": 22, "test": 13, "o": ["$(x-3)^2+(y+2)^2=4$", "$(x-3)^2+(y+2)^2=9$", "$(x+3)^2+(y-2)^2=4$", "$(x-3)^2+(y+2)^2=2$"], "a": 0}, {"q": "What is the supplement of a 108° angle?", "h": "Supplementary angles add up to 180°.", "s": "$180^\\circ-108^\\circ=72^\\circ$.", "v": "Supplementary angles add to one hundred eighty degrees. One hundred eighty minus one hundred eight is seventy two degrees. The answer is A.", "topic": "Lines, angles & triangles", "d": 1, "orig": 1, "test": 14, "o": ["$72^\\circ$", "$18^\\circ$", "$82^\\circ$", "$252^\\circ$"], "a": 0}, {"q": "What is the area of a triangle with sides 3, 4 and 5?", "h": "$3^2+4^2=5^2$, so it is a right triangle. The legs are the base and the height.", "s": "3-4-5 is a right triangle with legs 3 and 4: $A=\\dfrac12(3)(4)=6$.", "v": "Three squared plus four squared equals five squared, so this is a right triangle with legs three and four. The area is one half times three times four, which is six. The answer is B.", "topic": "Area & volume", "d": 1, "orig": 2, "test": 14, "o": ["$12$", "$6$", "$7.5$", "$60$"], "a": 1}, {"q": "What is the circumference of a circle with radius 7?", "h": "$C=2\\pi r$.", "s": "$C=2\\pi(7)=14\\pi$. ($49\\pi$ is the area.)", "v": "Circumference is two pi r. Two times seven is fourteen, so the circumference is fourteen pi. Forty nine pi would be the area. The answer is C.", "topic": "Circles", "d": 1, "orig": 3, "test": 14, "o": ["$49\\pi$", "$7\\pi$", "$14\\pi$", "$28\\pi$"], "a": 2}, {"q": "A square has a perimeter of 36. What is its area?", "h": "Find the side first: perimeter ÷ 4.", "s": "Side $=36\\div 4=9$; area $=9^2=81$.", "v": "A square has four equal sides, so each side is thirty six divided by four, which is nine. The area is nine squared, eighty one. The answer is B.", "topic": "Area & volume", "d": 1, "orig": 4, "test": 14, "o": ["$36$", "$81$", "$144$", "$9$"], "a": 1}, {"q": "Three angles of a quadrilateral measure 90°, 85° and 110°. What is the measure, in degrees, of the fourth angle?", "h": "The angles of a quadrilateral add up to 360°.", "s": "$360-90-85-110=75$°.", "v": "The angles of a quadrilateral add to three hundred sixty degrees. Three hundred sixty minus ninety minus eighty five minus one hundred ten is seventy five. The answer is seventy five.", "topic": "Lines, angles & triangles", "d": 2, "orig": 5, "test": 14, "spr": true, "a": ["75"]}, {"q": "What is $\\cos 60^\\circ$?", "h": "In a 30-60-90 triangle with sides $1,\\ \\sqrt3,\\ 2$, the side adjacent to 60° is 1.", "s": "Adjacent to 60° is 1, hypotenuse is 2: $\\cos 60^\\circ=\\dfrac12$.", "v": "In a thirty sixty ninety triangle with sides one, root three and two, the side next to the sixty degree angle is one and the hypotenuse is two. So cosine of sixty degrees is one half. The answer is A.", "topic": "Right triangles & trigonometry", "d": 1, "orig": 6, "test": 14, "o": ["$\\dfrac12$", "$\\dfrac{\\sqrt3}{2}$", "$\\sqrt3$", "$0$"], "a": 0}, {"q": "What is the volume of a rectangular prism measuring 2 by 3 by 10?", "h": "Multiply the three dimensions.", "s": "$2\\cdot 3\\cdot 10=60$.", "v": "Volume is length times width times height. Two times three times ten is sixty. The answer is C.", "topic": "Area & volume", "d": 1, "orig": 7, "test": 14, "o": ["$15$", "$30$", "$60$", "$120$"], "a": 2}, {"q": "What is the radius of the circle $x^2+y^2=36$?", "h": "$x^2+y^2=r^2$.", "s": "$r^2=36 \\Rightarrow r=6$.", "v": "In x squared plus y squared equals r squared, r squared is thirty six, so the radius is six. The answer is A.", "topic": "Circles", "d": 1, "orig": 8, "test": 14, "o": ["$6$", "$36$", "$18$", "$\\sqrt6$"], "a": 0}, {"q": "The angles of a triangle measure $x$, $2x$ and $3x$ degrees. What is the measure, in degrees, of the largest angle?", "h": "The three angles add to 180°. Find $x$, then the largest angle is $3x$.", "s": "$x+2x+3x=180 \\Rightarrow 6x=180 \\Rightarrow x=30$. Largest angle $=3x=90°$.", "v": "The angles add to one hundred eighty, so six x equals one hundred eighty and x is thirty. The largest angle is three x, which is ninety degrees. Careful: the question asks for the largest angle, not x. The answer is ninety.", "topic": "Lines, angles & triangles", "d": 2, "orig": 9, "test": 14, "spr": true, "a": ["90"]}, {"q": "A right triangle has legs 1 and $\\sqrt3$. What is the measure of its smallest angle?", "h": "Recognize the 30-60-90 pattern $1,\\ \\sqrt3,\\ 2$. The smallest angle is opposite the shortest side.", "s": "Sides $1,\\ \\sqrt3,\\ 2$ form a 30-60-90 triangle. The smallest angle is opposite the leg 1: $30^\\circ$.", "v": "Legs one and root three give a hypotenuse of two, which is a thirty sixty ninety triangle. The smallest angle is opposite the shortest side, one, so it is thirty degrees. The answer is B.", "topic": "Right triangles & trigonometry", "d": 2, "orig": 10, "test": 14, "o": ["$45^\\circ$", "$30^\\circ$", "$60^\\circ$", "$90^\\circ$"], "a": 1}, {"q": "A circle has circumference $18\\pi$. What is its area?", "h": "Use $2\\pi r=18\\pi$ to find $r$ first.", "s": "$2\\pi r=18\\pi \\Rightarrow r=9$. $A=\\pi\\cdot 9^2=81\\pi$.", "v": "From two pi r equals eighteen pi, the radius is nine. The area is pi times nine squared, which is eighty one pi. The answer is D.", "topic": "Circles", "d": 2, "orig": 11, "test": 14, "o": ["$9\\pi$", "$18\\pi$", "$36\\pi$", "$81\\pi$"], "a": 3}, {"q": "In triangle FGH, point P lies on $\\overline{FG}$ and point Q lies on $\\overline{FH}$ so that $\\overline{PQ}$ is parallel to $\\overline{GH}$. $PQ=18$ and $GH=30$. Let $FP=a$, $PG=b$, $FQ=c$ and $QH=d$. If $\\dfrac ab=k$ and $\\dfrac cd=k$, what is the value of $k$?", "h": "Triangles FPQ and FGH are similar with ratio $\\tfrac{18}{30}=\\tfrac35$ — but that compares $FP$ with the WHOLE side $FG$.", "s": "$\\dfrac{FP}{FG}=\\dfrac{18}{30}=\\dfrac35$. So $FP=3t$, $FG=5t$, and $PG=2t$. Then $k=\\dfrac ab=\\dfrac{3t}{2t}=\\dfrac32$.", "v": "Since P Q is parallel to G H, triangle F P Q is similar to triangle F G H, with ratio eighteen to thirty, or three fifths. That means F P is three parts and the whole side F G is five parts, so P G is two parts. The ratio a over b is three over two. Three fifths is the trap. The answer is B.", "topic": "Lines, angles & triangles", "d": 4, "orig": 12, "test": 14, "o": ["$\\dfrac35$", "$\\dfrac32$", "$\\dfrac23$", "$\\dfrac53$"], "a": 1}, {"q": "A right square pyramid has a total surface area of $64+16\\sqrt{41}$ square centimeters, which includes a base area of 64 square centimeters. What is the height, in centimeters, of the pyramid?", "h": "Base side $=8$. The lateral area is 4 triangles of area $\\tfrac12\\cdot 8\\cdot \\ell$ (slant height $\\ell$). Then use a right triangle with the half-side 4.", "s": "Base side $=\\sqrt{64}=8$. Lateral area $=4\\cdot\\dfrac12\\cdot 8\\cdot\\ell=16\\ell=16\\sqrt{41} \\Rightarrow \\ell=\\sqrt{41}$.<br>Height: $h=\\sqrt{\\ell^2-4^2}=\\sqrt{41-16}=5$ cm.", "v": "The base area is sixty four, so each base side is eight. The four triangular faces each have area one half times eight times the slant height, so together sixteen times the slant height. That equals sixteen root forty one, so the slant height is root forty one. The height, the slant height and half the base side, four, form a right triangle. The height is the square root of forty one minus sixteen, which is five. The answer is five.", "topic": "Area & volume", "d": 5, "orig": 13, "test": 14, "spr": true, "a": ["5"]}, {"q": "In a circle of radius 9, what is the length of the arc subtended by a central angle of $\\dfrac{\\pi}{3}$ radians?", "h": "With radians, arc length $s=r\\theta$.", "s": "$s=9\\cdot\\dfrac{\\pi}{3}=3\\pi$.", "v": "In radians, arc length is radius times angle. Nine times pi over three is three pi. The answer is A.", "topic": "Circles", "d": 2, "orig": 14, "test": 14, "o": ["$3\\pi$", "$6\\pi$", "$9\\pi$", "$\\dfrac{\\pi}{3}$"], "a": 0}, {"q": "In a right triangle, acute angle $\\theta$ has $\\tan\\theta=\\dfrac34$. What is $\\sin\\theta$?", "h": "Opposite 3, adjacent 4. Find the hypotenuse.", "s": "Opposite 3, adjacent 4, hypotenuse 5: $\\sin\\theta=\\dfrac35$.", "v": "Tangent three fourths means the opposite side is three and the adjacent side is four. The hypotenuse is five. Sine is opposite over hypotenuse, three fifths. The answer is C.", "topic": "Right triangles & trigonometry", "d": 3, "orig": 15, "test": 14, "o": ["$\\dfrac34$", "$\\dfrac45$", "$\\dfrac35$", "$\\dfrac53$"], "a": 2}, {"q": "What is the volume of a sphere with radius 3?", "h": "$V=\\dfrac43\\pi r^3$.", "s": "$\\dfrac43\\pi\\cdot 27=36\\pi$.", "v": "The volume of a sphere is four thirds pi r cubed. Three cubed is twenty seven, and four thirds of twenty seven is thirty six. So the volume is thirty six pi. The answer is A.", "topic": "Area & volume", "d": 2, "orig": 16, "test": 14, "o": ["$36\\pi$", "$12\\pi$", "$27\\pi$", "$108\\pi$"], "a": 0}, {"q": "A pyramid has a square base with side length 6 and a height of 10. What is its volume?", "h": "$V=\\dfrac13\\cdot(\\text{base area})\\cdot h$.", "s": "$\\dfrac13\\cdot 36\\cdot 10=120$. (360 forgets the $\\tfrac13$.)", "v": "The base area is six squared, thirty six. The volume of a pyramid is one third times base area times height: one third of thirty six times ten, which is one hundred twenty. The answer is B.", "topic": "Area & volume", "d": 2, "orig": 17, "test": 14, "o": ["$360$", "$120$", "$180$", "$60$"], "a": 1}, {"q": "What is the radius of the circle $x^2-8x+y^2+2y=8$?", "h": "Complete the square: add 16 for $x$ and 1 for $y$ to both sides.", "s": "$(x-4)^2+(y+1)^2=8+16+1=25 \\Rightarrow r=5$.", "v": "Complete the square. Half of negative eight is negative four, and its square is sixteen. Half of two is one, and its square is one. Adding to the right side: eight plus sixteen plus one is twenty five. So the radius is the square root of twenty five, which is five. The answer is five.", "topic": "Circles", "d": 3, "orig": 18, "test": 14, "spr": true, "a": ["5"]}, {"q": "Which point lies on the circle centered at the origin with radius 5?", "h": "A point is on the circle if $x^2+y^2=25$.", "s": "$3^2+(-4)^2=9+16=25$ ✓. The others give 32, 13 and 50.", "v": "A point lies on the circle when x squared plus y squared equals twenty five. For three, negative four: nine plus sixteen is twenty five. That works. The answer is A.", "topic": "Circles", "d": 2, "orig": 19, "test": 14, "o": ["$(3,\\ -4)$", "$(4,\\ 4)$", "$(2,\\ 3)$", "$(5,\\ 5)$"], "a": 0}, {"q": "In triangle PQR, the measure of angle P is 90°. Point S lies on $\\overline{QR}$, and $\\overline{PS}$ is perpendicular to $\\overline{QR}$. The length of $SQ$ is 210 and the length of $SP$ is 280. What is the value of $\\tan R$?", "h": "The altitude to the hypotenuse makes similar triangles. Angle R equals angle QPS.", "s": "In right triangle PQR, the altitude PS makes $\\angle QPS=\\angle R$ (both are complements of $\\angle Q$).<br>$\\tan R=\\tan\\angle QPS=\\dfrac{SQ}{SP}=\\dfrac{210}{280}=\\dfrac34$.", "v": "The altitude P S splits the right triangle into two triangles similar to it. Angle Q P S equals angle R, because both are complements of angle Q. In right triangle Q S P, the tangent of angle Q P S is the opposite side, S Q, over the adjacent side, S P. Two hundred function numVal(s){
  s=String(s).trim().replace(/[−–]/g,"-").replace(/\s+/g,"");
  if(/^-?(\d+\.?\d*|\.\d+)\/-?(\d+\.?\d*|\.\d+)$/.test(s)){ const [a,b]=s.split("/").map(Number); return b?a/b:NaN; }
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return NaN;
}
function sprOK(q,p){
  const v=numVal(p); if(isNaN(v)) return false;
  const dec=(String(p).split(".")[1]||"").replace(/\D/g,"");
  return q.a.some(k=>{ const t=numVal(k); return Math.abs(v-t)<1e-9 || (dec.length>=3 && Math.abs(v-t)<0.001); });
}

function statsOf(filter){
  let c=0,w=0,b=0,max=0,n=0;
  Q.forEach((q,i)=>{ if(!filter(q)||!submitted(q.test)) return; n++; if(scored(q)) max++;
    const p=picks[i]; if(p===undefined) b++; else if(isOK(q,p)) c++; else if(scored(q)) w++; });
  return {c,w,b,max,n,pct:max?Math.round(c/max*100):0};
}

function paintTimers(){

  chip.hidden=!show; if(show){ const left=T_(t).left; chip.classList.toggle("warn",left<=5*60000); chip.classList.toggle("mini",timerHidden);

}

function speak(text, btn){
  if (!("speechSynthesis" in window)) { alert("Speech is not supported in this browser."); return; }
  if (speechSynthesis.speaking && btn.classList.contains("speaking")) { speechSynthesis.cancel(); return; }
  speechSynthesis.cancel();
  document.querySelectorAll(".speaking").forEach(b=>{b.classList.remove("speaking");b.innerHTML="🔊 Listen";});
  const u = new SpeechSynthesisUtterance(text);

}

   ${weak.length?`<p class="rnote">📌 Review first: ${weak.map(x=>`<b>${x.k}</b> ${lesLink(x.k)}`).join(" · ")}</p>`:""}
   <h3 class="rh3">By topic</h3><div class="tw"><table class="etab"><tbody>${tl.map(x=>`<tr><td><b>${x.k}</b></td><td>${x.c} / ${x.n}</td><td>${x.p}%${bar(x.p,x.p>=75?"strong":x.p>=50?"mid":"weak")}</td><td>${lesLink(x.k)}</td></tr>`).join("")}</tbody></table></div>

  const typeRow=(lbl,f)=>{const ids=Q.map((q,i)=>i).filter(i=>submitted(Q[i].test)&&scored(Q[i])&&f(Q[i]));if(!ids.length)return"";const c=ids.filter(i=>isOK(Q[i],picks[i])).length,p=Math.round(c/ids.length*100);return`<tr><td>${lbl}</td><td>${c} / ${ids.length}</td><td>${p}%${bar(p)}</td></tr>`};

  const nd=TESTS.filter(T=>!submitted(T.id)).map(T=>tShort(T.id)); if(done.length&&nd.length) recs.push(`Tests not started yet: ${nd.join(", ")}.`);
  const v=verdict(all.pct), now=new Date();
  pageEl.innerHTML=`<div class="anahead"><div class="brandrow">${TD_LOGO}<span>TD A*</span></div>

   <div class="rtag">${BOOK.anaTitle}</div><h2>Detailed Result Analysis</h2><p class="rnote">${now.toLocaleDateString("en-GB")} · ${done.length} of ${NT} tests started</p>
   <h3>1 · Overall result</h3>
   <div class="ov"><div class="ring" style="--p:${all.pct}"><div><b>${all.pct}%</b><span>${all.c} / ${all.max}</span></div></div>
     <div class="ovt"><div class="ovv">${done.length?v[0]+" "+v[1]:"—"}</div><div>${done.length?v[2]:""}</div>
       <div class="chips"><span class="c ok">✔ Correct ${all.c}</span><span class="c bad">✘ Wrong ${all.w}</span><span class="c blank">– Blank ${all.b}</span><span class="c blank">⏱ ${fmtT(tTime(q=>submitted(q.test)))}</span></div></div></div>
   <h3>2 · Results by unit</h3><div class="tw"><table><thead><tr><th>Unit</th><th>Tests</th><th>✔</th><th>✘</th><th>Blank</th><th>Success</th><th>Status</th></tr></thead><tbody>${unitRows}</tbody></table></div>
   <h3>3 · Results by test</h3><div class="tw"><table><thead><tr><th>Test</th><th>Score</th><th>Success</th><th>Time</th><th>⚑</th></tr></thead><tbody>${testRows}</tbody></table></div>

  }
  function solve(A,b){const n=b.length,M=A.map((r,i)=>r.concat([b[i]]));for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;if(Math.abs(M[p][c])<1e-15)return null;[M[p],M[c]]=[M[c],M[p]];

  /* ---- drawing ---- */
  function draw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(drawNow)}
  function drawNow(){
    const{cx,W,H}=fitCanvas(cv);if(!V)home();

      for(let X=0;X<=W;X+=1){let y;try{y=f(wx(X))}catch(e){y=NaN}const Y=sy(y);if(!isFinite(Y)||Math.abs(Y)>1e6){pen=false;continue}

    const plotXfn=(g,col,dash)=>{cx.strokeStyle=col;cx.lineWidth=2.5;cx.setLineDash(dash?[7,5]:[]);cx.beginPath();let pen=false;
      for(let Y=0;Y<=H;Y+=1){let x;try{x=g(wy(Y))}catch(e){x=NaN}const X=sx(x);if(!isFinite(X)||Math.abs(X)>1e6){pen=false;continue}if(pen)cx.lineTo(X,Y);else cx.moveTo(X,Y);pen=true}cx.stroke();cx.setLineDash([])};
    const plotImp=(Fn,col,dash)=>{const cs=5,nx=Math.ceil(W/cs)+1,ny=Math.ceil(H/cs)+1,val=new Float64Array(nx*ny);
      for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){let v;try{v=Fn(wx(i*cs),wy(j*cs))}catch(e){v=NaN}val[j*nx+i]=v}
      cx.strokeStyle=col;cx.lineWidth=2.5;cx.setLineDash(dash?[7,5]:[]);cx.beginPath();
      const L=(a,b,pa,pb)=>{const t=a/(a-b);return[pa[0]+(pb[0]-pa[0])*t,pa[1]+(pb[1]-pa[1])*t]};
      for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){const a=val[j*nx+i],b=val[j*nx+i+1],c=val[(j+1)*nx+i+1],d=val[(j+1)*nx+i];if(![a,b,c,d].every(isFinite))continue;
        const P=[[i*cs,j*cs],[(i+1)*cs,j*cs],[(i+1)*cs,(j+1)*cs],[i*cs,(j+1)*cs]],v=[a,b,c,d],E=[];

        if(E.length===2){cx.moveTo(E[0][0],E[0][1]);cx.lineTo(E[1][0],E[1][1])}else if(E.length===4){cx.moveTo(E[0][0],E[0][1]);cx.lineTo(E[1][0],E[1][1]);cx.moveTo(E[2][0],E[2][1]);cx.lineTo(E[3][0],E[3][1])}}
      cx.stroke();cx.setLineDash([])};
    const dot=(x,y,col,r=4.5,hollow)=>{const X=sx(x),Y=sy(y);if(!isFinite(X)||!isFinite(Y))return;cx.beginPath();cx.arc(X,Y,r,0,7);if(hollow){cx.fillStyle=dark?"#1b1e26":"#fff";cx.fill();cx.strokeStyle=col;cx.lineWidth=2;cx.stroke()}else{cx.fillStyle=col;cx.fill()}};

        a.bounds.forEach(b=>{if(b.fn)plotFn(b.fn,c,b.strict);else if(b.xfn)plotXfn(b.xfn,c,b.strict);else plotImp(b.F,c,b.strict)})}});
    rows.forEach(r=>{if(!r.a||r.hidden)return;const c=r.color,a=r.a,w=sel===r?3.5:2.5;

  const curveFn=r=>{const a=r.a;if(!a)return null;if(a.kind==="fn"||a.kind==="reg")return a.f;if(a.kind==="fdef"&&a.params.length===1&&a.params[0]==="x"){const f=F[a.name];return x=>CE.evaluate(f.body,{deg:false,global:G,fns:F,vars:{x}})}return null};
  function pois(r){

    const zeroOf=(g,push)=>{let pa=V.x0,ga=g(pa);for(let i=1;i<=N;i++){const b=V.x0+i*dx,gb=g(b);if(isFinite(ga)&&isFinite(gb)){if(ga===0)push(pa);else if((ga<0)!==(gb<0)&&Math.abs(ga-gb)<(V.y1-V.y0)*2){const z=bis(g,pa,b);if(isFinite(z))push(z)}}pa=b;ga=gb}};

  }

  /* trace + POI clicks */

        const f=curveFn(o);if(f){let yv;try{yv=f(x)}catch(e){}if(isFinite(yv)&&Math.abs(syy(yv)-Y)<10){sel=o;rows.forEach(z=>z.el&&z.el.classList.toggle("sel",z===sel));trace=[x,yv,o.color,f];cv.setPointerCapture(e.pointerId);showTip(x,yv,"",X,syy(yv));draw();return true}}}

    up:()=>{}});
