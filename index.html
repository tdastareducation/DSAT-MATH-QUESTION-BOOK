stitute a negative input in parentheses."}, {"t": "Composition", "q": "If f(x) = 2x + 1 and g(x) = x² − 3, what are f(g(2)) and g(f(2))?", "o": [], "s": "g(2) = 1 → f(1) = 3. f(2) = 5 → g(5) = 22. The order matters."}, {"t": "Solve for the input", "q": "If f(x) = (x + 5)/(x − 1) and f(a) = 3, what is a?", "o": [], "s": "a + 5 = 3(a − 1) → a + 5 = 3a − 3 → a = 4."}, {"t": "Translation", "q": "The parabola y = f(x) has vertex (1, −4). If g(x) = f(x − 3) + 2, what is the vertex of g?", "o": [], "s": "3 right, 2 up → (4, −2)."}, {"t": "Reflection + translation", "q": "The graph of y = f(x) passes through (2, 5). Which point is on the graph of g(x) = −f(x) + 1?", "o": [], "s": "(2, −5) → up 1 → (2, −4)."}, {"t": "Changing the input variable", "q": "For all x, f(2x) = 6x + 7. What is f(5)?", "o": [], "s": "Let u = 2x, so 6x = 3u → f(u) = 3u + 7. f(5) = 22. (Shortcut: 2x = 5 → x = 2.5 → 6(2.5) + 7 = 22.)"}, {"t": "An equation built from f(a)", "q": "The function f is defined by f(x) = 5x − 9. If f(a) + 3 = 2a, what is the value of a?", "o": ["−2", "1", "2", "4"], "s": "f(a) = 5a − 9, so 5a − 9 + 3 = 2a → 5a − 6 = 2a → 3a = 6 → a = 2. Answer: C. Trap: solving f(a) = 2a and forgetting the + 3."}, {"t": "An equation built from f(a)", "q": "The function f is defined by f(x) = 4x + 7. If f(a) − 5 = 6a, what is the value of a?", "o": [], "s": "4a + 7 − 5 = 6a → 4a + 2 = 6a → a = 1. Answer: 1"}, {"t": "A multiple of g(a)", "q": "The function g is defined by g(x) = 3x − 8. If 2g(a) = a + 4, what is the value of a?", "o": ["2", "4", "8", "12"], "s": "2(3a − 8) = a + 4 → 6a − 16 = a + 4 → 5a = 20 → a = 4. Answer: B"}], "mis": ["Treating f(x − 3) as a shift to the left (it shifts right).", "Confusing −x² with (−x)² when evaluating f(−2): 3(−2)² = 12, not −12.", "Applying f first in f(g(x)).", "Ignoring the extra term next to f(a) when setting up the equation."]}, {"id": "2.5", "title": "Nonlinear systems of equations", "intro": "In a nonlinear system, substitution usually produces a quadratic equation; the number of solutions is set by that quadratic's discriminant.", "sum": "<ul><li><b>Method:<\/b> set the y-expressions equal (or substitute) → one-variable equation → solve → find y for each x.<\/li><li><b>Graph view:<\/b> solutions are the intersection points. A line and a parabola meet in 0, 1 or 2 points.<\/li><li><b>Tangency:<\/b> \"exactly one solution\" means Δ = 0 for the resulting quadratic.<\/li><li><b>Desmos:<\/b> enter both equations and click the intersections; use a slider for an unknown constant.<\/li><\/ul>", "ex": [{"t": "Parabola and line", "q": "Solve the system y = x² − 4 and y = 2x − 1.", "o": [], "s": "x² − 4 = 2x − 1 → x² − 2x − 3 = 0 → (x − 3)(x + 1) = 0. (3, 5) and (−1, −3)."}, {"t": "Tangency", "q": "The system y = x² + 3 and y = kx has exactly one solution. What is the positive value of k?", "o": [], "s": "x² − kx + 3 = 0 → Δ = k² − 12 = 0 → k = ±√12. Positive value: k = 2√3 ≈ 3.464."}, {"t": "Circle and line", "q": "Solve the system x² + y² = 25 and y = x + 1.", "o": [], "s": "x² + (x + 1)² = 25 → 2x² + 2x − 24 = 0 → x² + x − 12 = 0 → x = 3 or x = −4. (3, 4) and (−4, −3)."}, {"t": "Number of solutions", "q": "How many real solutions does the system y = −x² + 2 and y = 5 have?", "o": [], "s": "−x² + 2 = 5 → x² = −3 → no real solution. The parabola's highest point is y = 2, below y = 5. 0 solutions."}, {"t": "Rational and linear", "q": "What is the sum of the x-coordinates of the solutions to y = 6/x and y = x + 1?", "o": [], "s": "6/x = x + 1 → x² + x − 6 = 0 → x = 2 or x = −3. Sum −1 (or use −b/a = −1)."}], "mis": ["Finding the x-values and forgetting the y-values.", "Writing Δ &gt; 0 for \"exactly one solution\".", "Expanding (x + 1)² as x² + 1."]}]}, {"u": 3, "name": "Problem-Solving and Data Analysis", "share": "~15%", "desc": "This unit tests reading real-world data, setting up ratios and proportions, and making statistical judgments. It supplies 5–7 of the 40 scored questions, and most questions include a table, a graph or a short scenario.", "lessons": [{"id": "3.1", "title": "Ratios, rates, proportions and units", "intro": "Every ratio question rests on one idea: the relationship between two quantities is constant. Writing units as fractions and canceling them prevents most errors.", "sum": "<ul><li><b>Ratio a : b<\/b> → the parts are ak and bk, and the total is (a + b)k.<\/li><li><b>Direct proportion:<\/b> y = kx. a/b = c/d → cross-multiply.<\/li><li><b>Inverse proportion:<\/b> xy = k (more workers → less time).<\/li><li><b>Unit conversion (dimensional analysis):<\/b> multiply by fractions equal to 1 that cancel the unit you do not want.<\/li><li><b>Square and cubic units:<\/b> 1 m = 100 cm ⇒ 1 m² = 10,000 cm² and 1 m³ = 1,000,000 cm³. Likewise 1 yd = 3 ft ⇒ 1 yd² = 9 ft² and 1 yd³ = 27 ft³.<\/li><li><b>Rates:<\/b> distance = speed × time; density = mass / volume; population density = people / area.<\/li><li><b>Extra information:<\/b> conversion questions sometimes give a dimension (such as a depth) you do not need. Use only what the units require.<\/li><\/ul>", "ex": [{"t": "Ratio", "q": "In a class of 40 students, the ratio of boys to girls is 3 : 5. How many girls are there?", "o": [], "s": "3k + 5k = 40 → k = 5 → girls = 5k = 25."}, {"t": "Direct proportion", "q": "If 4 kg of apples cost <span class=\"usd\">$<\/span>14, how much do 10 kg cost?", "o": [], "s": "14/4 = x/10 → x = <span class=\"usd\">$<\/span>35."}, {"t": "Speed conversion", "q": "What is 72 km/h in m/s?", "o": [], "s": "72 km/h × (1,000 m)/(1 km) × (1 h)/(3,600 s) = 72,000/3,600 = 20 m/s."}, {"t": "Multi-step units", "q": "A car travels 30 miles per gallon and gas costs <span class=\"usd\">$<\/span>3.60 per gallon. What is the fuel cost of a 450-mile trip?", "o": [], "s": "450 / 30 = 15 gallons → 15 × 3.60 = <span class=\"usd\">$<\/span>54."}, {"t": "Scale", "q": "On a map, 1 cm represents 2.5 km. Two towns are 7.4 cm apart on the map. How far apart are they?", "o": [], "s": "7.4 × 2.5 = 18.5 km."}, {"t": "Square units", "q": "How many cm² are in 3.5 m²?", "o": [], "s": "1 m² = 100 × 100 = 10,000 cm² → 3.5 × 10,000 = 35,000 cm². (Writing 350 cm² is the most common mistake.)"}, {"t": "Ratio of side lengths", "q": "The ratio of the side length of square P to the side length of square Q is 3 to 12. Square P has a side length of 17 centimeters. What is the side length, in centimeters, of square Q?", "o": [], "s": "3/12 = 17/q → q = 17 × 4 = 68. Trap: 4.25, from inverting the ratio."}, {"t": "Ratio of side lengths", "q": "The ratio of the side length of square A to the side length of square B is 4 to 9. Square B has a side length of 27 centimeters. What is the side length, in centimeters, of square A?", "o": [], "s": "4/9 = s/27 → s = 4 × 3 = 12. Answer: 12"}, {"t": "Ratio of radii", "q": "The ratio of the radius of circle X to the radius of circle Y is 5 to 2. The radius of circle Y is 14 inches. What is the radius, in inches, of circle X?", "o": ["5.6", "28", "35", "70"], "s": "5/2 = r/14 → r = 35. Choice A comes from setting up the ratio backwards. Answer: C"}, {"t": "Rate conversion", "q": "A conveyor belt moves at 87.0 inches per minute. What is this speed in feet per minute? (12 inches = 1 foot)", "o": [], "s": "87.0 ÷ 12 = 7.25 feet per minute. Dividing makes sense: feet are bigger units, so the number gets smaller."}, {"t": "Inches per hour to feet per hour", "q": "A snail moves at a speed of 66.0 inches per hour. What is this speed in feet per hour? (12 inches = 1 foot)", "o": [], "s": "66.0 ÷ 12 = 5.5 feet per hour. Answer: 5.5"}, {"t": "Per minute to per hour", "q": "A faucet flows at a rate of 3.5 gallons per minute. What is this rate in gallons per hour?", "o": ["0.058", "63.5", "175", "210"], "s": "1 hour = 60 minutes: 3.5 × 60 = 210 gallons per hour. Answer: D"}, {"t": "Cubic conversion with extra data", "q": "A swimming pool is 6 feet deep and holds 2,430 cubic feet of water. What is its volume in cubic yards? (1 yard = 3 feet)", "o": [], "s": "1 yd³ = 3³ = 27 ft³ → 2,430 ÷ 27 = 90 cubic yards. The depth is not needed. Trap: 810, from dividing by 3 instead of 27."}, {"t": "Cubic feet to cubic yards", "q": "A sandbox is 2 feet deep and holds 54 cubic feet of sand. What is the volume of the sand, in cubic yards? (1 yard = 3 feet)", "o": [], "s": "1 yd³ = 27 ft³. 54/27 = 2. The depth is extra information. Answer: 2"}, {"t": "Ignore the extra measurement", "q": "A storage room is 9 feet tall and has a volume of 3,240 cubic feet. What is its volume in cubic yards? (1 yard = 3 feet)", "o": ["120", "360", "1,080", "40"], "s": "Divide by 27, not by 3: 3,240/27 = 120. Choice C divides by 3 only. Answer: A"}], "mis": ["Finding the total instead of the part asked for in a ratio question.", "Forgetting to square or cube the conversion factor for area or volume.", "Converting hours to minutes by dividing by 100 instead of 60.", "Inverting a ratio (\"A to B\" means A/B)."]}, {"id": "3.2", "title": "Percentages", "intro": "The key to fast percent work is the multiplier: a p% increase means multiplying by (1 + p/100), and a p% decrease means multiplying by (1 − p/100).", "sum": "<div class=\"tw\"><table><thead><tr><th>Question type<\/th><th>Formula<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>p% of A<\/td><td>(p/100) · A<\/td><td>30% of 250 = 75<\/td><\/tr><tr><td>B is what percent of A?<\/td><td>(B/A) · 100<\/td><td>12 is 15% of 80<\/td><\/tr><tr><td>Percent change<\/td><td>(new − old)/old · 100<\/td><td>40 → 52: 30% increase<\/td><\/tr><tr><td>p% increase<\/td><td>A · (1 + p/100)<\/td><td>200 increased by 8% = 216<\/td><\/tr><tr><td>p% decrease<\/td><td>A · (1 − p/100)<\/td><td>200 decreased by 8% = 184<\/td><\/tr><tr><td>Successive changes<\/td><td>Multiply the multipliers<\/td><td>+25% then −20% → 1.25 × 0.8 = 1<\/td><\/tr><tr><td>Reverse percent<\/td><td>New ÷ multiplier<\/td><td>68 after a 15% discount → 68/0.85 = 80<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Percentage points ≠ percent:<\/b> going from 20% to 25% is 5 percentage points but a 25% increase.<\/li><li>\"The new value is 130% of the old value\" = a 30% increase.<\/li><li><b>Percent chains:<\/b> write every quantity in terms of one variable (\"b is 89% of c\" → b = 0.89c), then divide.<\/li><\/ul>", "ex": [{"t": "Basic", "q": "A student missed 12 of 80 questions. What percent did the student miss?", "o": [], "s": "12/80 = 0.15 → 15%."}, {"t": "Successive changes", "q": "An <span class=\"usd\">$<\/span>80 item is marked up 25% and then discounted 20%. What is the final price?", "o": [], "s": "80 × 1.25 × 0.80 = <span class=\"usd\">$<\/span>80. The two percents apply to different bases, so \"+5%\" is wrong."}, {"t": "Percent change", "q": "Daily visitors to a website rose from 40,000 to 52,000. What was the percent increase?", "o": [], "s": "(52 − 40)/40 = 0.30 → 30%."}, {"t": "Reverse percent", "q": "After a 15% discount an item sells for <span class=\"usd\">$<\/span>68. What was the original price?", "o": [], "s": "0.85x = 68 → x = <span class=\"usd\">$<\/span>80. (Adding 15% of 68 to get <span class=\"usd\">$<\/span>78.20 is the classic trap.)"}, {"t": "Percent of a percent", "q": "At a school, 60% of students are girls and 25% of the girls are in the chess club. What percent of all students are girls in the chess club?", "o": [], "s": "0.60 × 0.25 = 0.15 → 15%."}, {"t": "Percent-of-a-sum chain", "q": "The positive number x is 1,350% of the sum of the positive numbers y and z, and y is 80% of z. What percent of y is x?", "o": ["30.38%", "1,687.5%", "2,430%", "3,037.5%"], "s": "y = 0.8z → z = 1.25y, so y + z = 2.25y. x = 13.5 × 2.25y = 30.375y → 3,037.5%. Answer: D. Trap C gives x as a percent of z (13.5 × 1.8 = 24.3); trap A forgets to convert the multiplier back to a percent."}, {"t": "Percent of a sum, in terms of one variable", "q": "The positive number a is 600% of the sum of the positive numbers b and c, and b is 50% of c. What percent of b is a?", "o": ["900%", "1,200%", "1,800%", "300%"], "s": "c = 2b, so b + c = 3b and a = 6(3b) = 18b = 1,800% of b. Answer: C"}, {"t": "Chain of percents", "q": "The positive number p is 250% of the sum of the positive numbers q and r, and r is 25% of q. p is what percent of q?", "o": [], "s": "r = 0.25q, so q + r = 1.25q and p = 2.5(1.25q) = 3.125q = 312.5% of q. Answer: 312.5"}], "mis": ["Dividing by the new value in a percent change; divide by the old value.", "Adding successive percents.", "In a reverse-percent question, adding the discount percent to the new price.", "In a percent chain, answering relative to the wrong base."]}, {"id": "3.3", "title": "One- and two-variable data, scatterplots", "intro": "Scatterplot questions ask about three things: the direction and form of the association, the meaning of the slope and intercept of the line of best fit, and the gap between a model and an actual value (the residual).", "sum": "<ul><li><b>Direction:<\/b> points rising to the right → positive; falling → negative; no pattern → no association.<\/li><li><b>Form:<\/b> linear (constant difference) or exponential (constant ratio, the curve steepens or flattens).<\/li><li><b>Line of best fit ŷ = mx + b:<\/b> m = the predicted change in y for a 1-unit increase in x; b = the predicted y when x = 0.<\/li><li><b>Estimating the slope from a graph:<\/b> pick two points on the line (not data points) that sit on grid intersections, then compute rise/run.<\/li><li><b>Residual = actual − predicted.<\/b> A positive residual means the point is above the line.<\/li><li><b>Extrapolation:<\/b> predictions far outside the data range are unreliable.<\/li><li><b>Correlation is not causation:<\/b> an association in observational data does not prove that one variable causes the other.<\/li><li><b>Desmos:<\/b> enter the data in a table and type y₁ ~ mx₁ + b to get m and b.<\/li><\/ul>", "ex": [{"t": "Slope meaning and prediction", "q": "For a class, the line of best fit relating hours studied (x) and test score (y) is ŷ = 2.4x + 15. What does 2.4 mean, and what is the predicted score for 10 hours?", "o": [], "s": "Each additional hour of study is associated with a predicted 2.4-point increase. ŷ(10) = 24 + 15 = 39."}, {"t": "Residual", "q": "Using the same model, a student who studied 12 hours scored 50. What is the residual?", "o": [], "s": "Predicted = 2.4(12) + 15 = 43.8. Residual = 50 − 43.8 = 6.2 (the point is 6.2 above the line)."}, {"t": "Type of association", "q": "<table class=\"dt\"><tr><th>x<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr><tr><th>y<\/th><td>20<\/td><td>17<\/td><td>15<\/td><td>11<\/td><td>8<\/td><\/tr><\/table>Which best describes the data?", "o": ["Positive linear", "Negative linear", "Positive exponential", "No association"], "s": "As x increases, y drops by about 3 each step → B) negative, roughly linear."}, {"t": "Linear or exponential?", "q": "<table class=\"dt\"><tr><th>Year<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th>Value<\/th><td>100<\/td><td>150<\/td><td>225<\/td><td>337.5<\/td><\/tr><\/table>Which model fits?", "o": [], "s": "The differences (50, 75, 112.5) are not constant; the ratios 150/100 = 225/150 = 1.5 are → exponential: y = 100(1.5)ˣ, a 50% increase per year."}, {"t": "Slope of a line of best fit from a graph", "q": "A scatterplot shows 10 data points with a downward trend. The line of best fit drawn through them passes through (0, 12) and (8, 2). Which is closest to the slope of the line of best fit?", "o": ["−8", "−1.25", "1.25", "8"], "s": "Slope = (2 − 12)/(8 − 0) = −10/8 = −1.25. Answer: B. The trend falls, which rules out C and D; A confuses the run with the slope."}, {"t": "Slope of an upward line of best fit", "q": "A scatterplot shows 15 data points with an upward trend. The line of best fit passes through (0, 4) and (5, 19). Which is closest to the slope of the line of best fit?", "o": ["0.33", "3", "3.8", "15"], "s": "Slope = (19 − 4)/(5 − 0) = 15/5 = 3. Answer: B"}, {"t": "Slope of a downward line of best fit", "q": "The line of best fit for a scatterplot with a downward trend passes through (2, 30) and (12, 10). What is the slope of the line of best fit?", "o": [], "s": "(10 − 30)/(12 − 2) = −20/10 = −2. Answer: −2"}], "mis": ["Interpreting the slope as an exact increase instead of a predicted or average one.", "Computing the residual as predicted − actual (wrong sign).", "Reading slope from two scattered data points instead of from the line.", "Drawing a cause-and-effect conclusion from a scatterplot."]}, {"id": "3.4", "title": "Probability and conditional probability", "intro": "Most SAT probability questions come from a two-way table; the whole job is choosing the right group for the denominator.", "sum": "<ul><li><b>P(event)<\/b> = (favorable outcomes)/(all outcomes). 0 ≤ P ≤ 1.<\/li><li><b>Complement:<\/b> P(not A) = 1 − P(A).<\/li><li><b>Conditional probability P(A | B):<\/b> \"given that B happened\" → the denominator is only the B group.<\/li><li><b>\"A member is selected at random\"<\/b> with no condition → the denominator is the grand total.<\/li><li><b>Independent events:<\/b> P(A and B) = P(A) · P(B). Without replacement, the second probability changes.<\/li><li><b>Expected count:<\/b> total × probability.<\/li><\/ul><p><b>Table for Examples 1–3:<\/b> 200 students were asked whether they play a sport.<\/p><div class=\"tw\"><table><thead><tr><th>—<\/th><th>Plays a sport<\/th><th>Does not<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>Boys<\/td><td>45<\/td><td>35<\/td><td>80<\/td><\/tr><tr><td>Girls<\/td><td>30<\/td><td>90<\/td><td>120<\/td><\/tr><tr><td>Total<\/td><td>75<\/td><td>125<\/td><td>200<\/td><\/tr><\/tbody><\/table><\/div>", "ex": [{"t": "Simple probability", "q": "What is the probability that a randomly selected student plays a sport?", "o": [], "s": "75/200 = 0.375."}, {"t": "Conditional — choose the right column", "q": "A student who plays a sport is selected at random. What is the probability the student is a girl?", "o": [], "s": "Denominator = students who play a sport (75). Numerator = girls who play (30). 30/75 = 0.4."}, {"t": "Conditional — the other direction", "q": "A girl is selected at random. What is the probability she plays a sport?", "o": [], "s": "Denominator = girls (120). 30/120 = 0.25. Same numerator as Example 2, different denominator: P(Girl | Sport) ≠ P(Sport | Girl)."}, {"t": "Without replacement", "q": "A bag has 5 red, 3 blue and 2 green marbles. Two are drawn without replacement. What is the probability both are red?", "o": [], "s": "(5/10) · (4/9) = 20/90 = 2/9."}, {"t": "Expected count", "q": "If the table's proportion holds for a school of 1,200 students, about how many play a sport?", "o": [], "s": "1,200 × 0.375 = 450."}, {"t": "Overall probability from a table", "q": "The table summarizes the members of a hiking club by age and by the side of the river where they live.<table class=\"dt\"><tr><th>—<\/th><td>East side<\/td><td>West side<\/td><td>Total<\/td><\/tr><tr><th>Under 30 years old<\/th><td>22<\/td><td>18<\/td><td>40<\/td><\/tr><tr><th>30 years old or older<\/th><td>35<\/td><td>45<\/td><td>80<\/td><\/tr><tr><th>Total<\/th><td>57<\/td><td>63<\/td><td>120<\/td><\/tr><\/table>If a member is selected at random, what is the probability that the member is at least 30 years old?", "o": ["35/120", "45/120", "80/120", "40/120"], "s": "No condition is given, so the denominator is all 120 members. \"At least 30\" = the whole 30-or-older row = 80. 80/120. Answer: C. Traps A and B use only one cell of the row."}, {"t": "Overall probability from a table", "q": "The table summarizes the lunch choices of 120 students.<table class=\"dt\"><tr><th>—<\/th><td>Hot lunch<\/td><td>Packed lunch<\/td><td>Total<\/td><\/tr><tr><th>9th grade<\/th><td>42<\/td><td>18<\/td><td>60<\/td><\/tr><tr><th>10th grade<\/th><td>35<\/td><td>25<\/td><td>60<\/td><\/tr><tr><th>Total<\/th><td>77<\/td><td>43<\/td><td>120<\/td><\/tr><\/table>If a student is selected at random, what is the probability that the student chose a packed lunch?", "o": ["18/60", "43/120", "25/43", "77/120"], "s": "No condition is given, so use the column total over the grand total: 43/120. Answer: B"}, {"t": "\"And\" probability from a table", "q": "The table summarizes the lunch choices of 120 students.<table class=\"dt\"><tr><th>—<\/th><td>Hot lunch<\/td><td>Packed lunch<\/td><td>Total<\/td><\/tr><tr><th>9th grade<\/th><td>42<\/td><td>18<\/td><td>60<\/td><\/tr><tr><th>10th grade<\/th><td>35<\/td><td>25<\/td><td>60<\/td><\/tr><tr><th>Total<\/th><td>77<\/td><td>43<\/td><td>120<\/td><\/tr><\/table>If a student is selected at random, what is the probability that the student is in 10th grade and chose a packed lunch?", "o": ["25/60", "25/43", "5/24", "43/120"], "s": "\"And\" with no condition uses the single cell over the grand total: 25/120 = 5/24. Choices A and B are conditional probabilities. Answer: C"}], "mis": ["Using the grand total (200) as the denominator for a conditional probability.", "Mixing up \"girl and plays a sport\" (30/200) with \"girl, given plays a sport\" (30/75).", "Using a single cell when the question describes a whole row or column.", "Forgetting that the denominator drops by 1 when drawing without replacement."]}, {"id": "3.5", "title": "Statistics and inference (mean, median, standard deviation)", "intro": "The SAT never asks you to compute a standard deviation; it asks you to compare spread. Mean, median and the rules for generalizing from a sample appear often.", "sum": "<div class=\"tw\"><table><thead><tr><th>Measure<\/th><th>Definition<\/th><th>Affected by outliers?<\/th><\/tr><\/thead><tbody><tr><td>Mean<\/td><td>Sum / count<\/td><td>Strongly<\/td><\/tr><tr><td>Median<\/td><td>Middle of the ordered data<\/td><td>Slightly<\/td><\/tr><tr><td>Mode<\/td><td>Most frequent value<\/td><td>No<\/td><\/tr><tr><td>Range<\/td><td>Maximum − minimum<\/td><td>Strongly<\/td><\/tr><tr><td>Standard deviation<\/td><td>Typical distance from the mean<\/td><td>Strongly<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Sum = mean × count<\/b> — the key to missing-value questions.<\/li><li><b>Removing the largest value<\/b> always lowers the mean. The median moves down or stays the same — check the middle values before saying it \"must\" decrease.<\/li><li><b>Standard deviation:<\/b> small when values cluster near the mean, large when spread out. Adding the same number to every value does not change it.<\/li><li><b>Histograms:<\/b> each bar is a count in an interval; find the median by counting to the middle position.<\/li><li><b>Sample → population:<\/b> results generalize only to the population the sample was randomly selected from.<\/li><li><b>Cause and effect:<\/b> only from experiments where subjects are randomly assigned to groups.<\/li><li><b>Margin of error:<\/b> estimate ± margin = plausible interval. Larger samples give smaller margins.<\/li><\/ul>", "ex": [{"t": "Missing value", "q": "The mean of 5 numbers is 18. When a sixth number is added, the mean becomes 20. What number was added?", "o": [], "s": "First sum 5 × 18 = 90. New sum 6 × 20 = 120. Added number = 30."}, {"t": "Outlier", "q": "Data: 12, 15, 15, 18, 20, 90. How do the mean and median change if 90 is removed?", "o": [], "s": "Before: mean 170/6 ≈ 28.3; median (15 + 18)/2 = 16.5. After: mean 80/5 = 16; median 15. The mean drops by about 12.3; the median drops by only 1.5."}, {"t": "Comparing standard deviation", "q": "Set A: 10, 10, 10, 10. Set B: 4, 8, 12, 16. Which has the greater standard deviation?", "o": [], "s": "Both have mean 10. Every A value equals the mean (SD = 0); B is spread out → B."}, {"t": "Margin of error", "q": "In a random sample of 400 voters, 52% support a candidate, with a margin of error of ±4%. Which conclusion is most appropriate?", "o": ["A majority of all voters definitely supports the candidate.", "The true support among all voters is plausibly between 48% and 56%.", "Support is exactly 52%.", "No conclusion is possible because the sample is small."], "s": "52 ± 4 → 48%–56%. The interval includes values below 50%, so a majority is not certain. Answer: B."}, {"t": "Study design", "q": "The sleep hours of 500 randomly selected high school students in one city were measured. To which group can the results be generalized?", "o": [], "s": "Only to high school students in that city. Not to students nationwide or other age groups, and since it is observational, no cause-and-effect claim."}, {"t": "Removing the largest value", "q": "The daily rainfall, in millimeters, at a station over 9 days was: 12, 14, 15, 15, 15, 16, 18, 19, 41. The value 41 is removed to create a data set of 8 values. Which statements must be true? I. The mean of the new data set is less than the mean of the original. II. The median of the new data set is less than the median of the original.", "o": ["I only", "II only", "I and II", "Neither I nor II"], "s": "Removing the maximum lowers the mean (I ✓). Original median = 5th value = 15. New median = average of the 4th and 5th values = (15 + 15)/2 = 15 — unchanged, so II is false. Answer: A. Removing a high value can leave the median unchanged when the middle values repeat."}, {"t": "Removing a low outlier", "q": "The test scores of 7 students were 30, 70, 72, 75, 78, 80 and 81. The score 30 is removed. Which statements must be true? I. The mean increases. II. The median increases.", "o": ["I only", "II only", "I and II", "Neither I nor II"], "s": "Removing a value far below the mean raises the mean. The median moves from 75 (the 4th of 7) to (75 + 78)/2 = 76.5. Both increase. Answer: C"}, {"t": "Mean changes, median does not", "q": "A data set is 4, 6, 7, 7, 7, 8, 25. The value 25 is removed. Which statement is true?", "o": ["The mean decreases and the median stays the same.", "The mean and the median both decrease.", "The mean stays the same and the median decreases.", "Neither the mean nor the median changes."], "s": "The mean drops from 64/7 ≈ 9.14 to 39/6 = 6.5. The median is 7 before (4th of 7) and 7 after (average of 7 and 7). Answer: A"}], "mis": ["Finding the median without ordering the data.", "Assuming the median must change whenever an extreme value is removed.", "Treating a margin-of-error interval as an exact result.", "Drawing cause-and-effect conclusions from an observational study."]}]}, {"u": 4, "name": "Geometry and Trigonometry", "share": "~15%", "desc": "Geometry supplies 5–7 of the 40 scored questions. Most formulas are on the reference sheet, so the real skill is seeing which formula and which relationship to use. Figures in this book are described in words; sketch each one on scratch paper before solving.", "lessons": [{"id": "4.1", "title": "Lines, angles and triangles", "intro": "Nearly every question in this subtopic uses four facts: a straight angle is 180°, a triangle's angles sum to 180°, the angle pairs formed by parallel lines, and the constant ratio of similar triangles.", "sum": "<ul><li><b>Vertical angles<\/b> are equal; <b>complementary<\/b> angles sum to 90°; <b>supplementary<\/b> angles sum to 180°.<\/li><li><b>Parallel lines cut by a transversal:<\/b> corresponding and alternate interior angles are equal; same-side interior angles sum to 180°.<\/li><li><b>Triangles:<\/b> interior angles sum to 180°; an exterior angle equals the sum of the two remote interior angles.<\/li><li><b>Isosceles triangle:<\/b> angles opposite equal sides are equal. <b>Equilateral:<\/b> every angle is 60°.<\/li><li><b>Triangle inequality:<\/b> |a − b| &lt; c &lt; a + b.<\/li><li><b>Similarity (AA):<\/b> with scale factor k, sides and perimeters scale by k, areas by k², volumes by k³.<\/li><li><b>A segment parallel to one side of a triangle<\/b> creates a smaller similar triangle. If the parallel segment has length m and the full side has length n, every small-triangle side is m/n of the matching large-triangle side, and the pieces it cuts on each side are in the ratio m : (n − m).<\/li><li><b>Congruence:<\/b> SSS, SAS, ASA, AAS (and HL for right triangles).<\/li><\/ul>", "ex": [{"t": "Parallel lines", "q": "Parallel lines ℓ and m are cut by a transversal. Two alternate interior angles measure (3x + 10)° and (5x − 30)°. What is the measure of each angle?", "o": [], "s": "3x + 10 = 5x − 30 → x = 20 → 3(20) + 10 = 70°."}, {"t": "Angle sum", "q": "A triangle's angles are in the ratio 2 : 3 : 4. What is the largest angle?", "o": [], "s": "9k = 180 → k = 20 → 4k = 80°."}, {"t": "Exterior angle", "q": "An exterior angle of a triangle is 125°, and one remote interior angle is 50°. What is the other remote interior angle?", "o": [], "s": "125 = 50 + x → x = 75°."}, {"t": "Similar triangles", "q": "In triangle ABC, D is on AB and E is on AC with DE ∥ BC. If AD = 4, DB = 6 and DE = 5, what is BC?", "o": [], "s": "ADE ~ ABC (AA). AD/AB = DE/BC → 4/10 = 5/BC → BC = 12.5. (AB = 4 + 6 = 10; using DB is the classic mistake.)"}, {"t": "Area ratio", "q": "Two similar triangles have sides in the ratio 2 : 3. The smaller has area 20 cm². What is the area of the larger?", "o": [], "s": "Area ratio (3/2)² = 9/4 → 20 × 9/4 = 45 cm²."}, {"t": "Triangle inequality", "q": "Two sides of a triangle are 5 and 9. If the third side is an integer, how many values are possible?", "o": [], "s": "4 &lt; c &lt; 14 → c = 5, 6, …, 13 → 9 values."}, {"t": "Third angle", "q": "In triangle PQR, the measure of ∠P is 64° and the measure of ∠Q is 49°. What is the measure of ∠R?", "o": ["67°", "113°", "116°", "247°"], "s": "180 − 64 − 49 = 67°. Answer: A. Trap B is 64 + 49; trap D adds instead of subtracting from 360°."}, {"t": "Third angle of a triangle", "q": "In triangle XYZ, the measure of ∠X is 38° and the measure of ∠Y is 97°. What is the measure of ∠Z?", "o": ["45°", "55°", "135°", "225°"], "s": "180 − 38 − 97 = 45°. Answer: A"}, {"t": "Angles given in terms of x", "q": "In triangle ABC, the measure of ∠A is x°, the measure of ∠B is 2x° and the measure of ∠C is 72°. What is the value of x?", "o": [], "s": "x + 2x + 72 = 180 → 3x = 108 → x = 36. Answer: 36"}, {"t": "Parallel segment, ratio of pieces", "q": "In triangle ABC, point D lies on side AB and point E lies on side AC so that DE is parallel to BC. DE = 24 and BC = 42. Let AD = p, DB = q, AE = r and EC = s. If p/q = k and r/s = k, what is k?", "o": ["4/7", "3/4", "4/3", "7/4"], "s": "Triangles ADE and ABC are similar with ratio 24/42 = 4/7, so AD/AB = 4/7: p/(p + q) = 4/7 → 7p = 4p + 4q → p/q = 4/3. Answer: C. Trap A uses the whole-to-whole ratio instead of piece-to-piece."}, {"t": "Parallel segment, ratio of the pieces", "q": "In triangle ABC, D lies on AB and E lies on AC so that DE ∥ BC. DE = 15 and BC = 40. Let AD = p and DB = q. If p/q = k, what is the value of k?", "o": ["3/8", "3/5", "5/3", "8/3"], "s": "Triangle ADE ~ triangle ABC, so AD/AB = 15/40 = 3/8. If AD = 3t, then AB = 8t and DB = 5t, so k = 3/5. Choice A is AD/AB, not AD/DB. Answer: B"}, {"t": "Find the parallel side", "q": "In triangle ABC, D lies on AB and E lies on AC so that DE ∥ BC. AD = 6, DB = 9 and DE = 8. What is the length of BC?", "o": [], "s": "AB = 6 + 9 = 15. BC/DE = AB/AD → BC = 8 × 15/6 = 20. Answer: 20"}], "mis": ["In similarity, mixing up a piece (DB) with the whole side (AB).", "Using the side ratio for areas (forgetting to square).", "Treating same-side interior angles as equal (they sum to 180°)."]}, {"id": "4.2", "title": "Right triangles and trigonometry", "intro": "In right-triangle questions, first check for a special triangle (a Pythagorean triple, 30-60-90 or 45-45-90); otherwise use SOH-CAH-TOA.", "sum": "<p><b>Pythagorean theorem:<\/b> a² + b² = c² · <b>sin θ<\/b> = opposite / hypotenuse · <b>cos θ<\/b> = adjacent / hypotenuse · <b>tan θ<\/b> = opposite / adjacent<\/p><div class=\"tw\"><table><thead><tr><th>Special triangle<\/th><th>Side ratios<\/th><\/tr><\/thead><tbody><tr><td>45-45-90<\/td><td>x : x : x√2<\/td><\/tr><tr><td>30-60-90<\/td><td>x (opposite 30°) : x√3 (opposite 60°) : 2x (hypotenuse)<\/td><\/tr><tr><td>Pythagorean triples<\/td><td>3-4-5, 5-12-13, 8-15-17, 7-24-25 and their multiples<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Complementary identity:<\/b> sin x° = cos(90 − x)°. A favorite SAT question.<\/li><li><b>Similar right triangles<\/b> share the same sine, cosine and tangent for the same angle.<\/li><li><b>Altitude to the hypotenuse:<\/b> in right triangle ABC with the right angle at A, the altitude AD to BC creates two smaller triangles similar to ABC. So ∠BAD = ∠C and ∠CAD = ∠B, and tan B = AD/BD.<\/li><li><b>Radians:<\/b> 180° = π radians → multiply degrees by π/180. Know 30° = π/6, 45° = π/4, 60° = π/3, 90° = π/2.<\/li><li><b>Bounding a root:<\/b> for \"between which two integers\", compare with perfect squares (36 &lt; 40 &lt; 49 → 6 &lt; √40 &lt; 7).<\/li><li><b>Desmos angle mode:<\/b> in degree mode sin(30) = 0.5; switch modes for radian questions.<\/li><\/ul>", "ex": [{"t": "Pythagorean theorem", "q": "A right triangle has legs 9 and 12. What is the hypotenuse?", "o": [], "s": "3 × the 3-4-5 triple → 15. (Check: 81 + 144 = 225.)"}, {"t": "30-60-90", "q": "The hypotenuse of a 30-60-90 triangle is 10. What is the longer leg?", "o": [], "s": "Short leg 10/2 = 5, long leg 5√3 ≈ 8.66."}, {"t": "Trig ratio", "q": "In right triangle ABC, angle C is the right angle, AC = 8, BC = 15 and AB = 17. What is sin A?", "o": [], "s": "Opposite A is BC = 15; hypotenuse 17 → sin A = 15/17. (This equals cos B.)"}, {"t": "Complementary angles", "q": "If 0 &lt; x &lt; 90 and sin x° = cos 20°, what is x?", "o": [], "s": "x + 20 = 90 → x = 70."}, {"t": "Real world", "q": "A 20-ft ladder leans against a wall at a 60° angle with the ground. How high up the wall does it reach?", "o": [], "s": "The height is opposite 60° → 20 · sin 60° = 20 · (√3/2) = 10√3 ≈ 17.3 ft."}, {"t": "Radians", "q": "How many radians is 135°?", "o": [], "s": "135 × π/180 = 3π/4."}, {"t": "Between two integers", "q": "A right triangle has legs of length 3.6 and 5.2. The hypotenuse has length x. Between which two consecutive integers is x?", "o": ["5 and 6", "6 and 7", "8 and 9", "39 and 40"], "s": "x² = 12.96 + 27.04 = 40 → x = √40. Since 36 &lt; 40 &lt; 49, 6 &lt; x &lt; 7. Answer: B. Trap D bounds x², not x; trap C adds the legs."}, {"t": "Hypotenuse between two integers", "q": "A right triangle has legs of length 4.1 and 6.3. The hypotenuse has length x. Between which two consecutive integers is x?", "o": ["6 and 7", "7 and 8", "10 and 11", "56 and 57"], "s": "x² = 16.81 + 39.69 = 56.5. Since 49 &lt; 56.5 &lt; 64, x is between 7 and 8. Choice C adds the legs instead. Answer: B"}, {"t": "Missing leg between two integers", "q": "A right triangle has a hypotenuse of length 9.4 and one leg of length 5.5. The other leg has length y. Between which two consecutive integers is y?", "o": ["3 and 4", "10 and 11", "7 and 8", "58 and 59"], "s": "y² = 88.36 − 30.25 = 58.11. Since 49 &lt; 58.11 &lt; 64, y is between 7 and 8. Answer: C"}, {"t": "Degrees to radians", "q": "The measure of angle T is 45°. What is its measure in radians?", "o": ["(1/8)π", "(1/4)π", "(1/3)π", "(1/2)π"], "s": "45 × π/180 = π/4. Answer: B."}, {"t": "Degrees to radians", "q": "The measure of angle W is 150°. What is the measure of angle W in radians?", "o": ["(5/6)π", "(6/5)π", "(5/12)π", "(2/3)π"], "s": "150 × π/180 = 5π/6. Answer: A"}, {"t": "Radians to degrees", "q": "An angle measures 3π/4 radians. What is its measure in degrees?", "o": [], "s": "(3π/4) × (180/π) = 135. Answer: 135"}, {"t": "Altitude to the hypotenuse", "q": "In triangle ABC, angle A measures 90°. Point D lies on BC, and AD is perpendicular to BC. DB = 360 and DA = 150. What is tan C?", "o": ["5/12", "5/13", "12/13", "12/5"], "s": "In right triangle ADB, tan B = DA/DB = 150/360 = 5/12. Angles B and C are complementary, so tan C = 1/(tan B) = 12/5. Answer: D. Trap A gives tan B."}, {"t": "Altitude to the hypotenuse, find tan C", "q": "In triangle ABC, angle A measures 90°. Point D lies on BC, and AD is perpendicular to BC. DB = 160 and DA = 120. What is the value of tan C?", "o": ["3/4", "4/3", "3/5", "4/5"], "s": "The altitude creates similar triangles, so ∠C = ∠BAD. tan(∠BAD) = BD/AD = 160/120 = 4/3. Answer: B"}, {"t": "Geometric mean of the hypotenuse pieces", "q": "In right triangle ABC with the right angle at A, altitude AD meets BC at D. DB = 9 and DC = 16. What is the length of AD?", "o": [], "s": "AD² = DB · DC = 9 · 16 = 144 → AD = 12. Answer: 12"}], "mis": ["Putting √3 on the short leg of a 30-60-90 triangle.", "Choosing \"opposite\" and \"adjacent\" without checking which angle they refer to.", "Answering for the wrong angle in an altitude-to-hypotenuse figure.", "Entering degree values while the calculator is in radian mode."]}, {"id": "4.3", "title": "Circles", "intro": "Circle questions come in two types: the equation of a circle in the coordinate plane, and arc and sector calculations. In both, the key is the fraction of the full circle (360° or 2π).", "sum": "<p><b>Circle:<\/b> (x − h)² + (y − k)² = r² · <b>Arc<\/b> = (θ/360) · 2πr · <b>Sector area<\/b> = (θ/360) · πr²<\/p><ul><li><b>Center (h, k), radius r.<\/b> (x + 2)² → h = −2.<\/li><li><b>Completing the square:<\/b> x² + bx → (x + b/2)² − (b/2)². Converts the general equation to center-radius form.<\/li><li><b>A point on the circle<\/b> satisfies the equation exactly: substitute its coordinates and solve for the unknown.<\/li><li><b>In radians:<\/b> arc s = rθ, sector area = (1/2)r²θ.<\/li><li><b>Inscribed angle<\/b> = half the central angle that subtends the same arc. An angle inscribed in a semicircle is 90°.<\/li><li><b>A tangent<\/b> is perpendicular to the radius at the point of tangency → usually a right triangle.<\/li><li><b>A point is inside the circle<\/b> if (x − h)² + (y − k)² &lt; r², on it if equal.<\/li><\/ul>", "ex": [{"t": "Write the equation", "q": "What is the equation of the circle with center (−2, 5) and radius 4?", "o": [], "s": "(x + 2)² + (y − 5)² = 16."}, {"t": "Complete the square", "q": "What is the radius of x² + y² − 6x + 8y = 11?", "o": [], "s": "(x² − 6x + 9) + (y² + 8y + 16) = 11 + 9 + 16 → (x − 3)² + (y + 4)² = 36. Center (3, −4), r = 6. (Forgetting to add to the right side gives r = √11, the most common error.)"}, {"t": "Arc length", "q": "A circle has radius 9. What is the length of the arc subtended by an 80° central angle?", "o": [], "s": "(80/360) · 2π · 9 = (2/9) · 18π = 4π."}, {"t": "Sector", "q": "A circle has radius 6. What is the area of a 120° sector?", "o": [], "s": "(120/360) · π · 36 = 12π."}, {"t": "Inscribed angle", "q": "A central angle measures 110°. What is the inscribed angle that subtends the same arc?", "o": [], "s": "110/2 = 55°."}, {"t": "Tangent", "q": "A tangent segment from an external point P to a circle of radius 5 has length 12. How far is P from the center?", "o": [], "s": "Tangent ⟂ radius → right triangle: 5² + 12² = d² → d = 13."}, {"t": "Point on a circle", "q": "In the xy-plane, the graph of (x + 3)² + (y − 5)² = 49 is a circle. The point (4, c), where c is a constant, lies on this circle. What is the value of c?", "o": [], "s": "(4 + 3)² + (c − 5)² = 49 → 49 + (c − 5)² = 49 → (c − 5)² = 0 → c = 5. The point is directly to the right of the center, exactly one radius (7) away. Spotting that x-distance = radius gives the answer immediately."}, {"t": "Point on a circle, positive coordinate", "q": "In the xy-plane, the graph of (x − 1)² + (y + 2)² = 25 is a circle. The point (4, c), where c is a positive constant, lies on the circle. What is the value of c?", "o": [], "s": "9 + (c + 2)² = 25 → (c + 2)² = 16 → c + 2 = ±4 → c = 2 or −6. Since c &gt; 0, c = 2. Answer: 2"}, {"t": "Point on a circle, two possibilities", "q": "In the xy-plane, the graph of (x + 2)² + (y − 3)² = 36 is a circle. The point (k, 3) lies on the circle. Which of the following could be the value of k?", "o": ["−8", "6", "−4", "8"], "s": "(k + 2)² + 0 = 36 → k + 2 = ±6 → k = 4 or k = −8. Answer: A"}], "mis": ["Reading r instead of r² from the equation (= 16 means r = 4).", "Not adding the completing-the-square constants to the other side.", "Mixing up the arc-length and sector-area formulas.", "Sign errors with the center: (x + 3)² means h = −3."]}, {"id": "4.4", "title": "Area and volume", "intro": "Nearly every area and volume formula is on the reference sheet; the SAT focuses on scaling (how area and volume change when dimensions change), composite figures and working backward from an area or volume to a length.", "sum": "<div class=\"tw\"><table><thead><tr><th>Figure<\/th><th>Area or volume<\/th><\/tr><\/thead><tbody><tr><td>Rectangle<\/td><td>A = ℓw<\/td><\/tr><tr><td>Triangle<\/td><td>A = (1/2)bh<\/td><\/tr><tr><td>Circle<\/td><td>A = πr², circumference = 2πr<\/td><\/tr><tr><td>Rectangular prism<\/td><td>V = ℓwh<\/td><\/tr><tr><td>Cylinder<\/td><td>V = πr²h<\/td><\/tr><tr><td>Sphere<\/td><td>V = (4/3)πr³<\/td><\/tr><tr><td>Cone<\/td><td>V = (1/3)πr²h<\/td><\/tr><tr><td>Pyramid<\/td><td>V = (1/3)ℓwh<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Scaling:<\/b> if every length is multiplied by k, area is multiplied by k² and volume by k³. If only one dimension changes, only that factor applies.<\/li><li><b>Composite figures:<\/b> split into pieces, then add or subtract.<\/li><li><b>Surface area:<\/b> the sum of all face areas (cube: 6s²; rectangular prism: 2(ℓw + ℓh + wh)). Not on the reference sheet: cylinder total surface area = 2πrh + 2πr² = (circumference × height) + 2πr²; sphere surface area = 4πr².<\/li><li><b>From circumference to radius:<\/b> r = C/(2π).<\/li><li><b>Square pyramid:<\/b> lateral area = 4 · (1/2) · s · ℓ = 2sℓ, where ℓ is the slant height. Height h, half-side s/2 and slant height form a right triangle: ℓ² = h² + (s/2)².<\/li><\/ul>", "ex": [{"t": "Scaling area", "q": "A rectangle's length is doubled and its width is tripled. By what factor does its area change?", "o": [], "s": "2 × 3 = 6 times."}, {"t": "Cylinder", "q": "What is the volume of a cylinder with radius 3 cm and height 10 cm?", "o": [], "s": "π · 9 · 10 = 90π ≈ 282.7 cm³."}, {"t": "Cone", "q": "What is the volume of a cone with base radius 6 and height 8?", "o": [], "s": "(1/3) · π · 36 · 8 = 96π."}, {"t": "Radius from volume", "q": "A sphere has volume 36π cm³. What is its radius?", "o": [], "s": "(4/3)πr³ = 36π → r³ = 27 → r = 3."}, {"t": "Composite figure", "q": "A semicircle is attached to the 6-unit side of a 10 × 6 rectangle, with that side as its diameter. What is the total area?", "o": [], "s": "60 + (1/2)π(3)² = 60 + 4.5π ≈ 74.1."}, {"t": "Scaling volume", "q": "A cube's edge is tripled. By what factor does its volume change?", "o": [], "s": "3³ = 27 times."}, {"t": "Cylinder surface area from circumference", "q": "A right circular cylinder has a height of 15 inches, and the circumference of its base is 120 inches. Which expression gives the total surface area, in square inches?", "o": ["(15)(120) + 2π(60/π)²", "(15)(120) + π(60/π)²", "π(60/π)²(15)", "(15)(120)"], "s": "r = 120/(2π) = 60/π. Lateral area = circumference × height = (15)(120). Two bases = 2πr² = 2π(60/π)². Answer: A. Trap B counts one base; trap C is the volume; trap D is only the lateral area."}, {"t": "Cylinder surface area from the circumference", "q": "A right circular cylinder has a height of 10 centimeters, and the circumference of its base is 60 centimeters. Which expression represents the total surface area, in square centimeters, of the cylinder?", "o": ["(10)(60)", "(10)(60) + π(30/π)²", "(10)(60) + 2π(30/π)²", "2π(30/π)²(10)"], "s": "Lateral area = height × circumference = (10)(60). r = 60/(2π) = 30/π, and there are two bases: 2π(30/π)². Answer: C"}, {"t": "Total surface area as kπ", "q": "A right circular cylinder has radius 4 and height 7. Its total surface area is kπ. What is the value of k?", "o": [], "s": "2πr² + 2πrh = 2π(16) + 2π(4)(7) = 32π + 56π = 88π. Answer: 88"}, {"t": "Pyramid height from surface area", "q": "A right square pyramid has a total surface area of 36 + 12√73 square inches, which includes a base area of 36 square inches. What is the height, in inches, of the pyramid?", "o": [], "s": "Base side s = 6. Lateral area = 2sℓ = 12ℓ = 12√73 → slant height ℓ = √73. Right triangle: ℓ² = h² + (s/2)² → 73 = h² + 9 → h² = 64 → h = 8."}, {"t": "Pyramid height from surface area", "q": "A right square pyramid has a total surface area of 100 + 20√29 square inches, which includes a base area of 100 square inches. What is the height, in inches, of the pyramid?", "o": [], "s": "The base side is 10. Lateral area = 4 · (1/2)(10)(ℓ) = 20ℓ = 20√29 → ℓ = √29. h = √(ℓ² − 5²) = √(29 − 25) = 2. Answer: 2"}, {"t": "Surface area from height and base", "q": "A right square pyramid has a base side length of 6 and a height of 4. What is its total surface area?", "o": ["84", "96", "120", "144"], "s": "Slant height = √(4² + 3²) = 5. Total = 36 + 4 · (1/2)(6)(5) = 36 + 60 = 96. Answer: B"}], "mis": ["Forgetting the 1/3 in cone and pyramid volumes.", "Using the diameter in place of the radius.", "Thinking a tripled edge triples the volume.", "Confusing the slant height of a pyramid with its height."]}]}];

const READER=(()=>{
  const SUP={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"negative ","⁺":"plus ","ˣ":"x","ᵗ":"t","ⁿ":"n","ᵐ":"m"};

  function speakable(t){

       .replace(/(ft|cm|m|in|yd)³/g,(m,u)=>" cubic "+({ft:"feet",cm:"centimeters",m:"meters",in:"inches",yd:"yards"}[u])+" ")
       .replace(/km\/h/g," kilometers per hour").replace(/m\/s\b/g," meters per second").replace(/g\/cm/g," grams per cubic centimeter ");
    t=t.replace(/\$\s?(\d[\d,]*(?:\.\d+)?)/g,"$1 dollars").replace(/(\d),(\d{3})/g,"$1$2").replace(/(\d),(\d{3})/g,"$1$2");
    t=t.replace(/(\d)\s?–\s?(\d)/g,"$1 to $2").replace(/[–—]/g,", ");
    t=t.replace(/\^\(([^)]+)\)/g," to the power $1 ");
    t=t.replace(/ⁿ√/g," n-th root of ").replace(/(\d)\(/g,"$1 times (").replace(/\)\(/g,") times (");
    t=t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺ˣᵗⁿᵐ]+/g,r=>{ if(r==="²") return " squared "; if(r==="³") return " cubed "; const s=[...r].map(c=>SUP[c]).join(""); return ORD[s]?` to the ${ORD[s]} `:` to the ${s} `; });
    t=t.replace(/[₀₁₂₃]/g,c=>" sub "+SUB[c]+" ");
    t=t.replace(/~\s?(\d)/g,"about $1").replace(/ ~ /g," is similar to ");
    t=t.replace(/(\w|\))\s?·\s?(\w|\()/g,"$1 times $2").replace(/·/g,", ");
    t=t.replace(/\s\/\s/g,", ").replace(/\//g," over ");
    t=t.replace(/(\w) \| (\w)/g,"$1 given $2");
    const M={"≠":" is not equal to ","≤":" is less than or equal to ","≥":" is greater than or equal to ","<":" is less than ",">":" is greater than ","→":", so ","⇒":", so ","⇔":" exactly when ","×":" times ","÷":" divided by ","±":" plus or minus ","−":" minus ","≈":" approximately ","√":" square root of ","∛":" cube root of ","π":" pi ","θ":" theta ","Δ":" delta ","°":" degrees ","∠":" angle ","∥":" parallel to ","⟂":" perpendicular to ","ŷ":" y hat ","ℓ":" l ","%":" percent ","=":" equals ","+":" plus ","✓":", check. ","✔":", check. ","✗":", fails. ","☐":"","…":" and so on ","\"":"","❌":""};
    t=t.replace(/[≠≤≥<>→⇒⇔×÷±−≈√∛πθΔ°∠∥⟂ŷℓ%=+✓✔✗☐…"❌]/g,c=>M[c]);
    t=t.replace(/ - /g," minus ").replace(/(\d)-(\d)/g,"$1 $2");

  }
  function textOf(el){
    if(el.tagName==="TR") return [...el.children].map(c=>textOf(c).trim()).filter(Boolean).join(", ")+".";
    const c=el.cloneNode(true); c.querySelectorAll(".katex-mathml,.noprint,button").forEach(x=>x.remove());
    c.querySelectorAll(".fr").forEach(f=>{const n=f.querySelector(".nu"),d=f.querySelector(".de");f.replaceWith(` (${n.innerText}) over (${d.innerText}) `)});c.querySelectorAll(".fx").forEach(x=>x.replaceWith(` to the power ${x.innerText} `)); return c.innerText;
  }
  function blocks(root,sel){ const all=[...root.querySelectorAll(sel)]; return all.filter(e=>!all.some(o=>o!==e&&o.contains(e))&&textOf(e).trim()); }
  let run=0, btn=null, label="", key=null, pos=0;
  const RESUME={};                       /* where each reading stopped: "page:button" → block index */
  const keyOf=b=>cur+":"+(b.id||("ex"+((b.closest(".ex")||{}).dataset||{}).k));
  function hideAsk(){ const q=document.getElementById("rdAsk"); if(q) q.remove(); }
  function stop(){ run++; if("speechSynthesis" in window) speechSynthesis.cancel(); hideAsk();
    if(key!==null){ if(pos>0) RESUME[key]=pos; else delete RESUME[key]; key=null; }
    document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading")); if(btn){ btn.classList.remove("speaking"); btn.textContent=label; btn=null; } }
  function play(list,b,lbl,from){
    if(!("speechSynthesis" in window)){ alert("Speech is not supported in this browser."); return; }
    stop(); const me=++run; btn=b; label=lbl; key=keyOf(b); b.classList.add("speaking"); b.textContent="⏹ Stop";
    let i=from||0;
    const next=()=>{ if(me!==run) return; document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
      if(i>=list.length){ pos=0; stop(); return; }
      pos=i; const el=list[i++]; el.classList.add("reading"); const r=el.getBoundingClientRect(); if(r.top<70||r.bottom>innerHeight-110) el.scrollIntoView({block:"center",behavior:"smooth"});
      const u=new SpeechSynthesisUtterance(speakable(textOf(el))); u.lang="en-US"; u.rate=.92; if(typeof voice!=="undefined"&&voice) u.voice=voice;

  /* pressing Listen again after stopping half-way: ask "continue" or "start over" */
  function ask(list,b,lbl,at){
    hideAsk();
    const d=document.createElement("div"); d.id="rdAsk"; d.className="rdask"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Continue listening or start over");
    d.innerHTML=`<div class="rdq">You stopped at part ${at+1} of ${list.length}.</div><button class="btn rdc">▶ Continue where I left off</button><button class="btn alt rdr">↺ Start over</button>`;
    document.body.appendChild(d);
    const r=b.getBoundingClientRect(), w=d.offsetWidth;
    d.style.top=(scrollY+r.bottom+8)+"px"; d.style.left=Math.max(8,Math.min(scrollX+r.right-w,scrollX+innerWidth-w-8))+"px";
    list[at].classList.add("reading","rdpeek");
    const clean=()=>{ list[at].classList.remove("reading","rdpeek"); document.removeEventListener("pointerdown",out,true); document.removeEventListener("keydown",esc,true); };
    const out=e=>{ if(!d.contains(e.target)&&e.target!==b){ clean(); d.remove(); } };
    const esc=e=>{ if(e.key==="Escape"){ e.stopPropagation(); clean(); d.remove(); } };
    d.querySelector(".rdc").onclick=()=>{ clean(); play(list,b,lbl,at); };
    d.querySelector(".rdr").onclick=()=>{ clean(); delete RESUME[keyOf(b)]; play(list,b,lbl,0); };
    setTimeout(()=>{ document.addEventListener("pointerdown",out,true); document.addEventListener("keydown",esc,true); },0);
    d.querySelector(".rdc").focus();
  }
  function toggle(list,b,lbl){
    if(btn===b){ stop(); return; }
    const at=RESUME[keyOf(b)];
    if(at>0 && at<list.length) ask(list,b,lbl,at); else play(list,b,lbl,0);
  }
  return {toggle,stop,blocks,speakable};
})();

const DATA = {"Q": [{"q": "If $5x-8=27$, what is the value of $x$?", "h": "Undo the subtraction first, then undo the multiplication.", "s": "$5x-8=27 \\Rightarrow 5x=35 \\Rightarrow x=7$.", "v": "Add eight to both sides to get five x equals thirty five. Divide by five, and x equals seven. The answer is C.", "topic": "Linear equations", "d": 1, "orig": 1, "test": 1, "o": ["$3$", "$5$", "$7$", "$9$"], "a": 2}, {"q": "If $f(x)=4x-3$, what is $f(5)$?", "h": "Replace every $x$ in the rule with $5$.", "s": "$f(5)=4(5)-3=20-3=17$.", "v": "Put five in place of x. Four times five is twenty, and twenty minus three is seventeen. The answer is A.", "topic": "Linear functions", "d": 1, "orig": 2, "test": 1, "o": ["$17$", "$20$", "$23$", "$12$"], "a": 0}, {"q": "Which ordered pair is the solution to the system $y=x+2$ and $y=3x-4$?", "h": "Both equations give $y$, so set the right sides equal.", "s": "$x+2=3x-4 \\Rightarrow 6=2x \\Rightarrow x=3$, so $y=3+2=5$. The solution is $(3,\\ 5)$.", "v": "Both equations equal y, so x plus two equals three x minus four. That gives two x equals six, so x is three. Then y is three plus two, which is five. The point is three, five. The answer is A.", "topic": "Systems of linear equations", "d": 1, "orig": 3, "test": 1, "o": ["$(3,\\ 5)$", "$(2,\\ 4)$", "$(5,\\ 7)$", "$(1,\\ 3)$"], "a": 0}, {"q": "A gym charges a <span class=\"usd\">$<\/span>25 sign-up fee and <span class=\"usd\">$<\/span>18 per month. Which expression gives the total cost, in dollars, for $m$ months?", "h": "Which amount is paid once, and which amount is paid every month?", "s": "The <span class=\"usd\">$<\/span>25 fee is paid once; <span class=\"usd\">$<\/span>18 is paid each of the $m$ months. Total $=18m+25$.", "v": "The twenty five dollar fee is paid only once. Eighteen dollars is paid every month, so for m months that is eighteen m. The total is eighteen m plus twenty five. The answer is A.", "topic": "Linear equations", "d": 1, "orig": 4, "test": 1, "o": ["$18m+25$", "$25m+18$", "$43m$", "$18(m+25)$"], "a": 0}, {"q": "What is the slope of the line through $(-1,\\ 4)$ and $(3,\\ -8)$?", "h": "Slope $=\\dfrac{y_2-y_1}{x_2-x_1}$.", "s": "$m=\\dfrac{-8-4}{3-(-1)}=\\dfrac{-12}{4}=-3$.", "v": "Slope is change in y over change in x. The change in y is negative eight minus four, which is negative twelve. The change in x is three minus negative one, which is four. Negative twelve over four is negative three. The answer is D.", "topic": "Linear functions", "d": 1, "orig": 5, "test": 1, "o": ["$\\dfrac13$", "$-\\dfrac13$", "$3$", "$-3$"], "a": 3}, {"q": "The equation $96=2x+2y$ gives the perimeter, in inches, of a rectangular picture frame with length $x$ inches and width $y$ inches. The width of the frame is 17 inches. What is its length, in inches?", "h": "Substitute $y=17$ and solve for $x$.", "s": "$96=2x+2(17)=2x+34 \\Rightarrow 2x=62 \\Rightarrow x=31$ inches.", "v": "Put seventeen in for y. Two times seventeen is thirty four, so ninety six equals two x plus thirty four. Then two x is sixty two, and x is thirty one inches. The answer is thirty one.", "topic": "Linear equations", "d": 1, "orig": 6, "test": 1, "spr": true, "a": ["31"]}, {"q": "Which of the following is the solution set of $-4x+9\\gt 1$?", "h": "When you divide both sides by a negative number, the inequality sign flips.", "s": "$-4x\\gt -8$. Dividing by $-4$ flips the sign: $x\\lt 2$.", "v": "Subtract nine from both sides to get negative four x is greater than negative eight. Dividing by negative four flips the inequality, so x is less than two. The answer is B.", "topic": "Linear inequalities", "d": 2, "orig": 7, "test": 1, "o": ["$x\\gt 2$", "$x\\lt 2$", "$x\\gt -2$", "$x\\lt -2$"], "a": 1}, {"q": "At which point does the line $3x+2y=12$ cross the $x$-axis?", "h": "On the $x$-axis, $y=0$.", "s": "Set $y=0$: $3x=12 \\Rightarrow x=4$. The line crosses the $x$-axis at $(4,\\ 0)$.", "v": "Every point on the x axis has y equal to zero. Then three x equals twelve, so x is four. The point is four, zero. The answer is B.", "topic": "Linear functions", "d": 1, "orig": 8, "test": 1, "o": ["$(0,\\ 6)$", "$(4,\\ 0)$", "$(6,\\ 0)$", "$(0,\\ 4)$"], "a": 1}, {"q": "If $5x+12=37$, what is the value of $5x-12$?", "h": "You do not need $x$. How does $5x-12$ compare with $5x+12$?", "s": "$5x=25$, so $5x-12=25-12=13$.<br>Shortcut: $5x-12$ is 24 less than $5x+12$, and $37-24=13$.", "v": "Subtract twelve to get five x equals twenty five. Then five x minus twelve is twenty five minus twelve, which is thirteen. The answer is thirteen.", "topic": "Linear equations", "d": 2, "orig": 9, "test": 1, "spr": true, "a": ["13"]}, {"q": "A plumber charges $C=60+45h$ dollars for $h$ hours of work. What does 45 represent?", "h": "Which number is multiplied by the number of hours?", "s": "45 is multiplied by $h$, so it is the charge for each hour. 60 is the fixed fee.", "v": "Forty five is multiplied by h, the number of hours, so it is the cost for each hour of work. Sixty is the fixed fee. The answer is B.", "topic": "Linear functions", "d": 1, "orig": 10, "test": 1, "o": ["The fixed service fee", "The charge per hour", "The total charge", "The number of hours worked"], "a": 1}, {"q": "If $2x+y=11$ and $x-y=1$, what is the value of $x$?", "h": "Add the two equations; the $y$ terms cancel.", "s": "$(2x+y)+(x-y)=11+1 \\Rightarrow 3x=12 \\Rightarrow x=4$.", "v": "Add the two equations. Plus y and minus y cancel, leaving three x equals twelve, so x is four. The answer is A.", "topic": "Systems of linear equations", "d": 2, "orig": 11, "test": 1, "o": ["$4$", "$3$", "$5$", "$7$"], "a": 0}, {"q": "What is the slope of a line perpendicular to $y=-4x+7$?", "h": "Perpendicular slopes are negative reciprocals: flip the fraction AND change the sign.", "s": "The given slope is $-4$. The negative reciprocal is $\\dfrac14$.", "v": "The slope of the given line is negative four. A perpendicular line has the negative reciprocal slope: flip it and change the sign, which gives one fourth. The answer is D.", "topic": "Linear functions", "d": 2, "orig": 12, "test": 1, "o": ["$-4$", "$4$", "$-\\dfrac14$", "$\\dfrac14$"], "a": 3}, {"q": "Pens cost <span class=\"usd\">$<\/span>1.50 and notebooks cost <span class=\"usd\">$<\/span>4. Ali has <span class=\"usd\">$<\/span>30 and buys 3 notebooks. What is the greatest number of pens he can buy?", "h": "Find how much money is left after the notebooks, then write an inequality for the pens.", "s": "Notebooks: $3\\times 4=12$, leaving $30-12=18$ dollars. $1.50p\\le 18 \\Rightarrow p\\le 12$. He can buy at most 12 pens.", "v": "Three notebooks cost twelve dollars, so Ali has eighteen dollars left. Each pen costs one dollar fifty, and eighteen divided by one point five is twelve. He can buy at most twelve pens. The answer is twelve.", "topic": "Linear inequalities", "d": 2, "orig": 13, "test": 1, "spr": true, "a": ["12"]}, {"q": "If $k(x-2)=6x+4$ has no solution, what is the value of $k$?", "h": "No solution means equal $x$-coefficients but different constants.", "s": "$kx-2k=6x+4$. For no solution the $x$-coefficients must match: $k=6$. Then the constants are $-12$ and $4$, which differ ✓. So $k=6$.", "v": "Distribute to get k x minus two k equals six x plus four. An equation has no solution when the x terms match but the constants do not. So k must be six. Then the constants are negative twelve and four, which are different, so there is no solution. The answer is C.", "topic": "Linear equations", "d": 3, "orig": 14, "test": 1, "o": ["$-2$", "$2$", "$6$", "$-6$"], "a": 2}, {"q": "$g$ is a linear function with $g(0)=5$ and $g(4)=17$. Which of the following defines $g$?", "h": "$g(0)$ is the $y$-intercept. Use the two points to find the slope.", "s": "Slope $=\\dfrac{17-5}{4-0}=3$ and the $y$-intercept is $g(0)=5$, so $g(x)=3x+5$.", "v": "The y intercept is g of zero, which is five. The slope is seventeen minus five, which is twelve, divided by four, which is three. So g of x equals three x plus five. The answer is B.", "topic": "Linear functions", "d": 2, "orig": 15, "test": 1, "o": ["$g(x)=4x+5$", "$g(x)=3x+5$", "$g(x)=5x+3$", "$g(x)=3x+17$"], "a": 1}, {"q": "A concert sells student tickets for <span class=\"usd\">$<\/span>5 and general tickets for <span class=\"usd\">$<\/span>9. A total of 120 tickets were sold for <span class=\"usd\">$<\/span>760. How many student tickets were sold?", "h": "Write one equation for the number of tickets and one for the money.", "s": "$s+g=120$ and $5s+9g=760$. With $g=120-s$: $5s+1080-9s=760 \\Rightarrow 4s=320 \\Rightarrow s=80$.", "v": "Let s be student tickets and g be general tickets. s plus g is one hundred twenty, and five s plus nine g is seven hundred sixty. Replace g with one hundred twenty minus s. That gives five s plus one thousand eighty minus nine s equals seven hundred sixty, so four s equals three hundred twenty, and s is eighty. The answer is C.", "topic": "Systems of linear equations", "d": 3, "orig": 16, "test": 1, "o": ["$40$", "$60$", "$80$", "$100$"], "a": 2}, {"q": "For which list of $(m,\\ n)$ pairs are all the pairs solutions to the inequality $m+n\\lt 30$?", "h": "Add each pair. Every sum must be strictly less than 30.", "s": "Sums — A: 29, <b>30<\/b>, <b>30<\/b> ✗. B: 28, 29, <b>30<\/b> ✗. C: 27, 28, 29 ✓. D: 26, <b>30<\/b>, 28 ✗.<br>Only C works.", "v": "Add the numbers in each pair. In choice A, two plus twenty eight is thirty, which is not less than thirty. In choice B, four plus twenty six is thirty. In choice D, two plus twenty eight is thirty. In choice C the sums are twenty seven, twenty eight and twenty nine, all less than thirty. The answer is C.", "topic": "Linear inequalities", "d": 3, "orig": 17, "test": 1, "o": ["$(0,\\ 29),\\ (2,\\ 28),\\ (4,\\ 26)$", "$(0,\\ 28),\\ (2,\\ 27),\\ (4,\\ 26)$", "$(0,\\ 27),\\ (2,\\ 26),\\ (4,\\ 25)$", "$(0,\\ 26),\\ (2,\\ 28),\\ (4,\\ 24)$"], "a": 2}, {"q": "The system $4x-3y=5$ and $8x-6y=c$ has infinitely many solutions. What is the value of $c$?", "h": "Infinitely many solutions means one equation is a multiple of the other.", "s": "$8x-6y=2(4x-3y)$, so $c=2\\times 5=10$.", "v": "Eight x minus six y is exactly two times four x minus three y. For the equations to be the same line, c must be two times five, which is ten. The answer is ten.", "topic": "Systems of linear equations", "d": 3, "orig": 18, "test": 1, "spr": true, "a": ["10"]}, {"q": "$h$ is a linear function with $h(3)=11$ and $h(7)=23$. What is $h(-2)$?", "h": "Find the slope, then move from $x=3$ to $x=-2$.", "s": "Slope $=\\dfrac{23-11}{7-3}=3$. From $x=3$ to $x=-2$ is 5 units left: $h(-2)=11-5\\cdot 3=-4$.", "v": "The slope is twenty three minus eleven, which is twelve, over seven minus three, which is four. So the slope is three. Going from x equals three to x equals negative two is five steps to the left, so subtract five times three, which is fifteen, from eleven. That gives negative four. The answer is A.", "topic": "Linear functions", "d": 3, "orig": 19, "test": 1, "o": ["$-4$", "$-1$", "$2$", "$5$"], "a": 0}, {"q": "The system $ax+3y=7$ and $4x-6y=2$ has no solution. What is the value of $a$?", "h": "No solution means parallel lines: the $x$- and $y$-coefficients are in the same ratio, but the constants are not.", "s": "$\\dfrac a4=\\dfrac{3}{-6} \\Rightarrow a=-2$. The constants $7$ and $2$ are not in the ratio $-\\tfrac12$, so the lines are parallel, not identical ✓.", "v": "For no solution the two lines must be parallel, so the coefficients must be in the same ratio. a over four must equal three over negative six, which is negative one half. So a is negative two. The constants seven and two do not follow that ratio, so the lines are parallel and never meet. The answer is C.", "topic": "Systems of linear equations", "d": 4, "orig": 20, "test": 1, "o": ["$2$", "$-8$", "$-2$", "$8$"], "a": 2}, {"q": "A line passes through $(2,\\ k)$ and $(k,\\ 8)$ and has slope $\\dfrac12$. What is the value of $k$?", "h": "Write the slope formula with $k$ in it and set it equal to $\\tfrac12$.", "s": "$\\dfrac{8-k}{k-2}=\\dfrac12 \\Rightarrow 16-2k=k-2 \\Rightarrow 3k=18 \\Rightarrow k=6$.<br>Check: $(2,6)$ and $(6,8)$ give slope $\\tfrac24=\\tfrac12$ ✓.", "v": "The slope is eight minus k over k minus two, and it equals one half. Cross multiply: sixteen minus two k equals k minus two. So three k equals eighteen, and k is six. The answer is six.", "topic": "Linear functions", "d": 4, "orig": 21, "test": 1, "spr": true, "a": ["6"]}, {"q": "Tank A holds 1,200 liters of water and is drained at a constant rate; after 15 minutes, 900 liters remain. At the same moment, tank B, which holds 300 liters, starts filling at 25 liters per minute. After how many minutes will the two tanks hold the same amount of water?", "h": "Find tank A's rate first, then write an expression for each tank and set them equal.", "s": "Tank A loses 300 L in 15 min, i.e. 20 L/min: $A=1200-20t$. Tank B: $B=300+25t$.<br>$1200-20t=300+25t \\Rightarrow 900=45t \\Rightarrow t=20$ minutes.", "v": "Tank A loses three hundred liters in fifteen minutes, which is twenty liters per minute. So tank A has twelve hundred minus twenty t liters, and tank B has three hundred plus twenty five t liters. Set them equal: nine hundred equals forty five t, so t is twenty minutes. The answer is B.", "topic": "Linear equations", "d": 4, "orig": 22, "test": 1, "o": ["$15$", "$20$", "$24$", "$30$"], "a": 1}, {"q": "If $\\dfrac{x}{3}+4=10$, what is the value of $x$?", "h": "Subtract 4 first, then multiply both sides by 3.", "s": "$\\dfrac x3=6 \\Rightarrow x=18$.", "v": "Subtract four from both sides to get x over three equals six. Multiply by three, and x equals eighteen. The answer is C.", "topic": "Linear equations", "d": 1, "orig": 1, "test": 2, "o": ["$6$", "$14$", "$18$", "$42$"], "a": 2}, {"q": "Which expression is equivalent to $3(2x-4)-2x$?", "h": "Distribute the 3 to both terms in the parentheses, then combine like terms.", "s": "$3(2x-4)-2x=6x-12-2x=4x-12$.", "v": "Three times two x is six x, and three times negative four is negative twelve. Then six x minus two x is four x. The expression is four x minus twelve. The answer is A.", "topic": "Linear equations", "d": 1, "orig": 2, "test": 2, "o": ["$4x-12$", "$4x-4$", "$8x-12$", "$4x+12$"], "a": 0}, {"q": "What is the $y$-intercept of the line $y=-2x+6$?", "h": "In $y=mx+b$, the $y$-intercept is $b$.", "s": "In slope-intercept form $y=mx+b$, $b=6$. (At $x=0$, $y=6$.)", "v": "The equation is in slope intercept form. The constant term, six, is the y intercept, because when x is zero, y is six. The answer is C.", "topic": "Linear functions", "d": 1, "orig": 3, "test": 2, "o": ["$-2$", "$3$", "$6$", "$-6$"], "a": 2}, {"q": "A taxi charges <span class=\"usd\">$<\/span>3.50 plus <span class=\"usd\">$<\/span>2 per kilometer. What is the cost, in dollars, of a 12-kilometer ride?", "h": "Cost = fixed charge + (rate × kilometers).", "s": "$3.50+2(12)=3.50+24=\\$27.50$.", "v": "The cost is three dollars fifty plus two dollars times twelve kilometers. Two times twelve is twenty four, and twenty four plus three fifty is twenty seven dollars and fifty cents. The answer is B.", "topic": "Linear equations", "d": 1, "orig": 4, "test": 2, "o": ["$24$", "$27.50$", "$29.50$", "$42$"], "a": 1}, {"q": "If $7-2x=3x-18$, what is the value of $x$?", "h": "Collect the $x$ terms on one side and the numbers on the other.", "s": "$7+18=3x+2x \\Rightarrow 25=5x \\Rightarrow x=5$.", "v": "Add two x and eighteen to both sides. That gives twenty five equals five x, so x is five. The answer is five.", "topic": "Linear equations", "d": 1, "orig": 5, "test": 2, "spr": true, "a": ["5"]}, {"q": "\"Three times a number $n$, decreased by 4, is at least 20.\" Which inequality represents this statement?", "h": "\"At least\" means greater than or equal to. What is decreased by 4: $n$ or $3n$?", "s": "Three times $n$ is $3n$; decreased by 4 gives $3n-4$; \"at least 20\" means $\\ge 20$. So $3n-4\\ge 20$.", "v": "Three times a number is three n. Decreased by four makes it three n minus four. At least twenty means greater than or equal to twenty. The answer is C.", "topic": "Linear inequalities", "d": 2, "orig": 6, "test": 2, "o": ["$3n-4\\le 20$", "$3(n-4)\\ge 20$", "$3n-4\\ge 20$", "$3n-4\\gt 20$"], "a": 2}, {"q": "If $x+y=10$ and $x-y=4$, what is the value of $xy$?", "h": "Add the equations to find $x$, then find $y$.", "s": "Adding: $2x=14 \\Rightarrow x=7$, so $y=3$. Then $xy=21$.", "v": "Add the two equations: two x equals fourteen, so x is seven. Then y is ten minus seven, which is three. Seven times three is twenty one. The answer is A.", "topic": "Systems of linear equations", "d": 2, "orig": 7, "test": 2, "o": ["$21$", "$24$", "$16$", "$40$"], "a": 0}, {"q": "The table shows a linear relationship. <table class=\"dt\"><tr><th>$x$<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th>$y$<\/th><td>$-3$<\/td><td>1<\/td><td>5<\/td><td>9<\/td><\/tr><\/table>Which equation represents the relationship?", "h": "How much does $y$ change each time $x$ goes up by 1? What is $y$ when $x=0$?", "s": "$y$ rises by 4 for each 1 in $x$, so the slope is 4. At $x=0$, $y=-3$. So $y=4x-3$.", "v": "Each time x goes up by one, y goes up by four, so the slope is four. When x is zero, y is negative three, so that is the y intercept. The equation is y equals four x minus three. The answer is C.", "topic": "Linear functions", "d": 2, "orig": 8, "test": 2, "o": ["$y=-3x+4$", "$y=4x+3$", "$y=4x-3$", "$y=x-3$"], "a": 2}, {"q": "What is the slope of the line through $(0,\\ -2)$ and $(5,\\ 8)$?", "h": "Slope $=\\dfrac{\\text{change in }y}{\\text{change in }x}$.", "s": "$m=\\dfrac{8-(-2)}{5-0}=\\dfrac{10}{5}=2$.", "v": "The change in y is eight minus negative two, which is ten. The change in x is five. Ten divided by five is two. The answer is two.", "topic": "Linear functions", "d": 1, "orig": 9, "test": 2, "spr": true, "a": ["2"]}, {"q": "The function $T(d)=900-25d$ gives the number of pages that a printer's toner cartridge can still print $d$ days after it was installed. What is the best interpretation of $T(12)=600$?", "h": "The input $d$ is days; the output $T(d)$ is pages that can still be printed.", "s": "Input $d=12$ days, output $T=600$ pages still printable. So 12 days after installation, the cartridge can still print 600 pages.", "v": "In T of d, the input d is the number of days and the output is the number of pages the cartridge can still print. So T of twelve equals six hundred means that twelve days after installation, it can still print six hundred pages. The answer is B.", "topic": "Linear functions", "d": 2, "orig": 10, "test": 2, "o": ["The number of pages decreased by a total of 12 pages after 600 days.", "The cartridge could still print 600 pages 12 days after it was installed.", "The cartridge could still print 12 pages 600 days after it was installed.", "The number of pages decreased by a total of 600 pages after 12 days."], "a": 1}, {"q": "If $3a+2b=14$ and $a=2$, what is the value of $b$?", "h": "Substitute $a=2$ into the equation.", "s": "$3(2)+2b=14 \\Rightarrow 2b=8 \\Rightarrow b=4$.", "v": "Put two in for a. Three times two is six, so six plus two b is fourteen. Then two b is eight, and b is four. The answer is C.", "topic": "Linear equations", "d": 1, "orig": 11, "test": 2, "o": ["$2$", "$3$", "$4$", "$5$"], "a": 2}, {"q": "The perimeter of a rectangle is $P=2l+2w$. Which expression gives $w$ in terms of $P$ and $l$?", "h": "Treat $P$ and $l$ like numbers: isolate $2w$, then divide by 2.", "s": "$2w=P-2l \\Rightarrow w=\\dfrac{P-2l}{2}$.", "v": "Subtract two l from both sides to get two w equals P minus two l. Then divide everything by two: w equals P minus two l, all over two. The answer is B.", "topic": "Linear equations", "d": 2, "orig": 12, "test": 2, "o": ["$P-2l$", "$\\dfrac{P-2l}{2}$", "$\\dfrac P2-2l$", "$\\dfrac{P+2l}{2}$"], "a": 1}, {"q": "Which line is parallel to $2x-5y=10$?", "h": "Parallel lines have the same slope. Rewrite the equation as $y=mx+b$.", "s": "$-5y=-2x+10 \\Rightarrow y=\\dfrac25x-2$. The slope is $\\dfrac25$, so the parallel line is $y=\\dfrac25x+1$.", "v": "Solve for y. Negative five y equals negative two x plus ten, so y equals two fifths x minus two. The slope is two fifths. A parallel line has the same slope, so it is y equals two fifths x plus one. The answer is A.", "topic": "Linear functions", "d": 2, "orig": 13, "test": 2, "o": ["$y=\\dfrac25x+1$", "$y=-\\dfrac25x$", "$y=\\dfrac52x$", "$y=-\\dfrac52x+3$"], "a": 0}, {"q": "A park will plant tulip bulbs and daffodil bulbs. The number of daffodil bulbs will be 5 times the number of tulip bulbs. If 2,346 bulbs will be planted in total, how many of them will be tulip bulbs?", "h": "Let $t$ be the number of tulip bulbs. Then there are $5t$ daffodil bulbs.", "s": "$t+5t=2346 \\Rightarrow 6t=2346 \\Rightarrow t=391$.", "v": "Let t be the tulip bulbs. Then the daffodils are five t, and the total is six t. Six t equals two thousand three hundred forty six, so t is three hundred ninety one. The answer is three hundred ninety one.", "topic": "Linear equations", "d": 2, "orig": 14, "test": 2, "spr": true, "a": ["391"]}, {"q": "For a linear relationship between $x$ and $y$, the values $x=-8,\\ -4$ and $0$ correspond to $y=p+60,\\ p+30$ and $p$, where $p$ is a constant. What is the slope of the line that represents this relationship in the $xy$-plane?", "h": "Use any two points. The $p$ cancels when you subtract the $y$-values.", "s": "From $x=-4$ to $x=0$, $y$ changes from $p+30$ to $p$: a change of $-30$ over 4. Slope $=\\dfrac{-30}{4}=-\\dfrac{15}{2}$.", "v": "Take two of the points. When x goes from negative four to zero, an increase of four, y goes from p plus thirty to p, a decrease of thirty. The p cancels. The slope is negative thirty over four, which is negative fifteen halves. The answer is B.", "topic": "Linear functions", "d": 3, "orig": 15, "test": 2, "o": ["$\\dfrac{15}{2}$", "$-\\dfrac{15}{2}$", "$\\dfrac{p+30}{-4}$", "$\\dfrac{2p-30}{4}$"], "a": 1}, {"q": "Which point is a solution to the system $y\\ge x$ and $y\\le 4-x$?", "h": "Test each point in BOTH inequalities.", "s": "$(1,3)$: $3\\ge 1$ ✓ and $3\\le 4-1=3$ ✓.<br>$(3,2)$ fails $y\\ge x$; $(0,5)$ fails $y\\le 4-x$; $(2,-1)$ fails $y\\ge x$.", "v": "Test each point in both inequalities. For one, three: three is at least one, and three is at most four minus one, which is three. Both are true. Each of the other points breaks one of the inequalities. The answer is B.", "topic": "Linear inequalities", "d": 3, "orig": 16, "test": 2, "o": ["$(3,\\ 2)$", "$(1,\\ 3)$", "$(0,\\ 5)$", "$(2,\\ -1)$"], "a": 1}, {"q": "The system $2x+3y=12$ and $kx+6y=24$ has infinitely many solutions. What is the value of $k$?", "h": "For infinitely many solutions, the second equation must be a multiple of the first.", "s": "Doubling the first equation gives $4x+6y=24$, so $k=4$.", "v": "Infinitely many solutions means the two equations describe the same line. Doubling the first equation gives four x plus six y equals twenty four, which matches the second. So k is four. The answer is C.", "topic": "Systems of linear equations", "d": 2, "orig": 17, "test": 2, "o": ["$8$", "$6$", "$4$", "$2$"], "a": 2}, {"q": "The cost, in dollars, of renting a car for $d$ days is a linear function $f(d)$. If $f(3)=145$ and $f(7)=285$, what is the daily rate, in dollars?", "h": "The daily rate is the slope of $f$.", "s": "Rate $=\\dfrac{285-145}{7-3}=\\dfrac{140}{4}=\\$35$ per day.", "v": "The daily rate is the slope. The cost goes up by two hundred eighty five minus one hundred forty five, which is one hundred forty, over four extra days. One hundred forty divided by four is thirty five dollars per day. The answer is thirty five.", "topic": "Linear functions", "d": 3, "orig": 18, "test": 2, "spr": true, "a": ["35"]}, {"q": "The equation $5(x-c)+2x=7x-15$ has infinitely many solutions. What is the value of $c$?", "h": "Simplify the left side. For infinitely many solutions, both sides must be identical.", "s": "$5x-5c+2x=7x-5c$. Matching constants: $-5c=-15 \\Rightarrow c=3$.", "v": "Distribute and combine: the left side becomes seven x minus five c. The x terms already match, so the constants must match too. Negative five c equals negative fifteen, so c is three. The answer is B.", "topic": "Linear equations", "d": 3, "orig": 19, "test": 2, "o": ["$-3$", "$3$", "$5$", "$15$"], "a": 1}, {"q": "A line passes through $(-3,\\ 7)$ and is perpendicular to $y=3x-2$. Where does it cross the $x$-axis?", "h": "The perpendicular slope is $-\\tfrac13$. Write the line, then set $y=0$.", "s": "Slope $=-\\dfrac13$. $y-7=-\\dfrac13(x+3) \\Rightarrow y=-\\dfrac x3+6$.<br>At $y=0$: $\\dfrac x3=6 \\Rightarrow x=18$. The point is $(18,\\ 0)$.", "v": "The given slope is three, so the perpendicular slope is negative one third. Using the point negative three, seven, the line is y equals negative one third x plus six. Set y equal to zero: one third x equals six, so x is eighteen. The line crosses at eighteen, zero. The answer is A.", "topic": "Linear functions", "d": 4, "orig": 20, "test": 2, "o": ["$(18,\\ 0)$", "$(6,\\ 0)$", "$(-18,\\ 0)$", "$(21,\\ 0)$"], "a": 0}, {"q": "If $3x+5y=41$ and $5x+3y=39$, what is the value of $x-y$?", "h": "Subtract one equation from the other and look at what is left.", "s": "$(5x+3y)-(3x+5y)=39-41 \\Rightarrow 2x-2y=-2 \\Rightarrow x-y=-1$.", "v": "Subtract the first equation from the second. Five x minus three x is two x, three y minus five y is negative two y, and thirty nine minus forty one is negative two. So two times x minus y is negative two, and x minus y is negative one. The answer is negative one.", "topic": "Systems of linear equations", "d": 4, "orig": 21, "test": 2, "spr": true, "a": ["-1"]}, {"q": "Salesperson A earns <span class=\"usd\">$<\/span>400 per week plus 6% of sales. Salesperson B earns <span class=\"usd\">$<\/span>250 per week plus 9% of sales. For what weekly sales amount, in dollars, do they earn the same?", "h": "Write each pay as base + (percent as a decimal) × sales, and set them equal.", "s": "$400+0.06s=250+0.09s \\Rightarrow 150=0.03s \\Rightarrow s=5{,}000$.", "v": "A earns four hundred plus zero point zero six s, and B earns two hundred fifty plus zero point zero nine s. Set them equal: one hundred fifty equals zero point zero three s, so s is five thousand dollars. The answer is D.", "topic": "Linear equations", "d": 4, "orig": 22, "test": 2, "o": ["$1{,}500$", "$8{,}000$", "$15{,}000$", "$5{,}000$"], "a": 3}, {"q": "If $2x+9=3$, what is the value of $x$?", "h": "Subtract 9 from both sides, then divide by 2.", "s": "$2x=3-9=-6 \\Rightarrow x=-3$.", "v": "Subtract nine from both sides: two x equals negative six. Divide by two, and x equals negative three. The answer is B.", "topic": "Linear equations", "d": 1, "orig": 1, "test": 3, "o": ["$-6$", "$-3$", "$3$", "$6$"], "a": 1}, {"q": "If $y=5x-2$, what is $y$ when $x=-1$?", "h": "Substitute $x=-1$ carefully: $5\\cdot(-1)$ is negative.", "s": "$y=5(-1)-2=-5-2=-7$.", "v": "Put negative one in for x. Five times negative one is negative five, and negative five minus two is negative seven. The answer is A.", "topic": "Linear functions", "d": 1, "orig": 2, "test": 3, "o": ["$-7$", "$-3$", "$3$", "$7$"], "a": 0}, {"q": "Which ordered pair is a solution to $4x-y=10$?", "h": "Substitute each pair and see which one gives exactly 10.", "s": "$(2,-2)$: $4(2)-(-2)=8+2=10$ ✓. The other pairs give 11, 9 and $-10$.", "v": "Try each pair. For two, negative two: four times two is eight, minus negative two is eight plus two, which is ten. That works. The other pairs give eleven, nine and negative ten. The answer is C.", "topic": "Linear equations", "d": 1, "orig": 3, "test": 3, "o": ["$(3,\\ 1)$", "$(1,\\ -5)$", "$(2,\\ -2)$", "$(0,\\ 10)$"], "a": 2}, {"q": "A seedling is 8 cm tall and grows 1.5 cm per week. Which expression gives its height, in cm, after $w$ weeks?", "h": "Start value + (growth per week) × (number of w
